<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>康荣</title>
<meta name="theme-color" content="#ffffff">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#fff; --text:#202124; --text-soft:#4d5156; --muted:#70757a;
  --line:#dfe1e5; --line-soft:#ebebeb; --link:#1a0dab; --link-visited:#681da8;
  --url:#006621; --btn-bg:#f8f9fa; --btn-border:#f8f9fa; --btn-text:#3c4043;
  --btn-hover-border:#dadce0; --btn-hover-shadow:0 1px 1px rgba(0,0,0,.1);
  --blue:#4285F4; --search-shadow:0 1px 6px rgba(32,33,36,.28);
  --search-bg:#fff; --chip-bg:#f1f3f4; --suggest-hover:#f8f9fa;
  --footer-bg:#f2f2f2; --tab-line:#ebebeb; --tab-active:#1a73e8;
  --g-ease:cubic-bezier(.4,0,.2,1);
  --g-ease-out:cubic-bezier(0,0,.2,1);
  --g-ease-in:cubic-bezier(.4,0,1,1);
}
html.dark{
  --bg:#202124; --text:#e8eaed; --text-soft:#bdc1c6; --muted:#9aa0a6;
  --line:#3c4043; --line-soft:#3c4043; --link:#8ab4f8; --link-visited:#c58af9;
  --url:#5db85e; --btn-bg:#303134; --btn-border:#303134; --btn-text:#e8eaed;
  --btn-hover-border:#5f6368; --btn-hover-shadow:0 1px 1px rgba(0,0,0,.5);
  --blue:#8ab4f8; --search-shadow:0 1px 6px rgba(0,0,0,.6);
  --search-bg:#202124; --chip-bg:#3c4043; --suggest-hover:#303134;
  --footer-bg:#171717; --tab-line:#3c4043; --tab-active:#8ab4f8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:arial,sans-serif; font-size:14px; color:var(--text);
  background:var(--bg); -webkit-font-smoothing:antialiased;
  transition:background .2s var(--g-ease),color .2s var(--g-ease);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
[hidden]{display:none !important;}
i.las,i.lar,i.fa-solid,i.fa-brands{display:inline-block;line-height:1;vertical-align:middle;}

/* 进度条 */
.progress-bar{
  position:fixed; top:0; left:0; right:0; height:3px; z-index:9999;
  display:none; overflow:hidden; pointer-events:none; background:transparent;
}
.progress-bar.active{display:block;}
.progress-bar::before{
  content:''; position:absolute; top:0; height:100%;
  background:#4285F4; border-radius:0 3px 3px 0;
  box-shadow:0 0 8px rgba(66,133,244,.6);
  animation:progressIndeterminate 1.8s var(--g-ease) infinite;
}
html.dark .progress-bar::before{background:#8ab4f8;box-shadow:0 0 8px rgba(138,180,248,.6);}
@keyframes progressIndeterminate{
  0%{left:-35%; width:35%;} 50%{left:40%; width:45%;} 100%{left:100%; width:35%;}
}

/* 搜索框 */
.searchbox{
  display:flex; align-items:center; height:46px;
  background:var(--search-bg); border:1px solid var(--line);
  border-radius:24px; padding:0 12px 0 18px; width:100%;
  transition:box-shadow .2s var(--g-ease),border-color .2s var(--g-ease);
}
.searchbox:hover,.searchbox:focus-within{box-shadow:var(--search-shadow);border-color:transparent;}
.searchbox .si{font-size:18px;color:var(--muted);margin-right:12px;flex-shrink:0;}
.searchbox input{
  flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
  font-family:inherit;font-size:16px;color:var(--text);
}
.searchbox input::placeholder{color:var(--muted);opacity:.9;}
.clr-btn{
  display:none;place-items:center;width:28px;height:28px;border:0;border-radius:50%;
  background:transparent;color:var(--muted);cursor:pointer;padding:0;flex-shrink:0;font-size:14px;
  transition:background .15s var(--g-ease),color .15s var(--g-ease);
}
.clr-btn:hover{background:var(--chip-bg);color:var(--text);}
.clr-btn.on{display:grid;}
.go-btn{
  flex-shrink:0;width:34px;height:34px;border:0;border-radius:50%;background:transparent;
  cursor:pointer;display:grid;place-items:center;padding:0;
  transition:background .15s var(--g-ease);color:var(--blue);font-size:18px;
}
.go-btn:hover{background:var(--chip-bg);}

/* 联想 */
.suggest{
  position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--search-bg);
  border-radius:0 0 24px 24px;box-shadow:0 4px 6px rgba(32,33,36,.28);
  overflow:hidden;z-index:100;display:none;padding:0 0 8px;
  animation:suggestIn .12s var(--g-ease-out);
}
.suggest.open{display:block;}
@keyframes suggestIn{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:none;}}
.sug{display:flex;align-items:center;gap:14px;padding:8px 20px;font-size:15px;cursor:pointer;color:var(--text);transition:background .12s var(--g-ease);}
.sug:hover,.sug.active{background:var(--suggest-hover);}
.sug .sug-ico{width:18px;text-align:center;font-size:14px;color:var(--muted);flex-shrink:0;}
.sug .sug-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* 圆形图标按钮 */
.round-btn{
  width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
  border:1px solid transparent;background:transparent;cursor:pointer;padding:0;flex-shrink:0;
  transition:background .15s var(--g-ease),transform .15s var(--g-ease);
}
.round-btn:hover{background:var(--chip-bg);}
.round-btn:active{transform:scale(.94);}
.mi-btn img{width:24px;height:24px;object-fit:contain;display:block;border-radius:50%;}
.comra-icon-btn svg{width:24px;height:24px;display:block;}

/* 首页 */
.home-view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.home-header{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 22px;flex-shrink:0;}
.header-left{display:flex;align-items:center;gap:6px;}
.header-right{display:flex;align-items:center;gap:6px;}
.header-link{font-size:13px;color:var(--text-soft);padding:6px 10px;border-radius:4px;transition:background .15s var(--g-ease),color .15s var(--g-ease);}
.header-link:hover{background:var(--chip-bg);color:var(--text);}
.theme-toggle{width:38px;height:38px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;transition:background .15s var(--g-ease),color .15s var(--g-ease);font-size:17px;}
.theme-toggle:hover{background:var(--chip-bg);color:var(--text);}
.theme-toggle:active{transform:scale(.94);}

.home-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 20px 12vh;}
.logo{display:flex;align-items:center;justify-content:center;margin-bottom:14px;user-select:none;}
.logo-mark{width:104px;height:104px;display:block;flex-shrink:0;filter:drop-shadow(0 3px 10px rgba(66,133,244,.20));}
html.dark .logo-mark{filter:drop-shadow(0 3px 12px rgba(138,180,248,.28));}
.logo-sub{margin-top:0;margin-bottom:34px;font-size:15px;letter-spacing:.5em;text-indent:.5em;color:var(--muted);font-weight:500;}

.home-search{width:100%;max-width:584px;display:flex;flex-direction:column;align-items:center;position:relative;}
.home-search .searchbox{height:46px;padding-left:18px;padding-right:8px;}
.home-btns{display:flex;gap:11px;margin-top:28px;}
.home-btn{height:36px;padding:0 16px;border:1px solid var(--btn-border);border-radius:4px;background:var(--btn-bg);color:var(--btn-text);font-size:14px;cursor:pointer;transition:border-color .15s var(--g-ease),box-shadow .15s var(--g-ease),color .15s var(--g-ease);}
.home-btn:hover{border-color:var(--btn-hover-border);box-shadow:var(--btn-hover-shadow);color:var(--text);}
.lang-note{margin-top:30px;font-size:13px;color:var(--text-soft);}
.lang-note a{color:#1a0dab;cursor:pointer;}
html.dark .lang-note a{color:#8ab4f8;}
.lang-note a:hover{text-decoration:underline;}
.home-footer{background:var(--footer-bg);border-top:1px solid var(--line-soft);padding:15px 30px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);}
.home-footer a{color:var(--muted);padding:0 6px;cursor:pointer;}
.home-footer a:hover{text-decoration:underline;color:var(--text);}
.footer-left,.footer-right{display:flex;gap:4px;flex-wrap:wrap;}

/* 结果页 */
.results-view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.r-header{display:flex;align-items:center;gap:18px;padding:14px 26px 12px;flex-shrink:0;position:sticky;top:0;z-index:80;background:var(--bg);border-bottom:1px solid transparent;transition:border-color .15s var(--g-ease),box-shadow .15s var(--g-ease);}
.r-header.scrolled{border-bottom-color:var(--line-soft);box-shadow:0 1px 4px rgba(32,33,36,.1);}
html.dark .r-header.scrolled{border-bottom-color:#3c4043;box-shadow:0 1px 4px rgba(0,0,0,.5);}
.r-left{display:flex;align-items:center;gap:6px;flex-shrink:0;}
.r-logo{display:flex;align-items:center;flex-shrink:0;cursor:pointer;}
.r-logo svg{width:28px;height:28px;display:block;}
.r-search-wrap{flex:1;max-width:692px;position:relative;min-width:0;}
.r-search-wrap .searchbox{height:44px;padding-left:16px;padding-right:6px;}
.r-theme{width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;display:grid;place-items:center;padding:0;margin-left:auto;transition:background .15s var(--g-ease),color .15s var(--g-ease);font-size:17px;}
.r-theme:hover{background:var(--chip-bg);color:var(--text);}
.r-theme:active{transform:scale(.94);}
.r-tabs{display:flex;gap:0;padding:0 26px;border-bottom:1px solid var(--tab-line);flex-shrink:0;overflow-x:auto;scrollbar-width:none;}
.r-tabs::-webkit-scrollbar{display:none;}
.r-tab{padding:10px 4px 9px;margin-right:22px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;transition:color .15s var(--g-ease),border-color .15s var(--g-ease);flex-shrink:0;}
.r-tab:hover{color:var(--text);}
.r-tab.active{color:var(--tab-active);border-bottom-color:var(--tab-active);}
.r-stat{padding:10px 26px 0;max-width:1120px;margin:0 auto;width:100%;font-size:14px;color:var(--muted);}

.r-content{width:100%;max-width:1120px;margin:0 auto;padding:14px 26px 60px;display:grid;grid-template-columns:minmax(0,652px) 360px;gap:32px;align-items:start;justify-content:center;}
.r-main{min-width:0;width:100%;}
.r-aside{min-width:0;position:sticky;top:90px;max-height:calc(100vh - 108px);overflow-y:auto;overscroll-behavior:contain;display:flex;flex-direction:column;gap:18px;scrollbar-width:thin;scrollbar-color:var(--line) transparent;scrollbar-gutter:stable;}
.r-aside::-webkit-scrollbar{width:6px;}
.r-aside::-webkit-scrollbar-track{background:transparent;}
.r-aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.r-aside::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* 结果条目 */
.g-result{margin-bottom:29px;max-width:600px;animation:gFadeIn .22s var(--g-ease-out) both;}
@keyframes gFadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
.g-site{display:flex;align-items:center;gap:12px;margin-bottom:3px;}
.g-fav{width:26px;height:26px;border-radius:50%;background:var(--chip-bg);display:grid;place-items:center;flex-shrink:0;overflow:hidden;font-size:11px;font-weight:700;color:#fff;}
.g-fav img{width:18px;height:18px;object-fit:contain;display:block;}
.g-site-info{min-width:0;flex:1;}
.g-site-name{font-size:12px;color:var(--text);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:6px;}
.g-source-tag{font-size:9px;font-weight:700;letter-spacing:.05em;padding:1px 5px;border-radius:3px;background:var(--chip-bg);color:var(--muted);flex-shrink:0;}
.g-source-tag.official{background:#e6f4ea;color:#137333;display:inline-flex;align-items:center;gap:3px;}
html.dark .g-source-tag.official{background:rgba(52,168,83,.18);color:#81c995;}
.g-site-url{font-size:12px;color:var(--url);line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.g-title{display:block;font-size:20px;line-height:1.3;color:var(--link);margin-bottom:4px;word-break:break-word;transition:color .15s var(--g-ease);}
.g-title:hover{text-decoration:underline;}
.g-title:visited{color:var(--link-visited);}
.g-snippet{font-size:14px;line-height:1.58;color:var(--text-soft);word-break:break-word;}

/* 卡片 */
.g-card{border:1px solid var(--line);border-radius:8px;padding:18px 20px;max-width:none;margin-bottom:0;animation:gFadeIn .22s var(--g-ease-out) both;background:var(--bg);}
.g-card-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.g-card-label i{font-size:13px;}
.g-card-title{font-size:17px;font-weight:500;color:var(--text);margin-bottom:10px;line-height:1.35;}
.g-card-body{font-size:13.5px;line-height:1.62;color:var(--text-soft);white-space:pre-wrap;word-break:break-word;}
.g-card-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--link);}
.g-card-link:hover{text-decoration:underline;}
.g-calc{font-size:26px;font-weight:500;color:var(--text);letter-spacing:-.01em;line-height:1.3;word-break:break-word;}
.g-calc small{font-size:14px;color:var(--muted);font-weight:400;}

.wx-top{display:flex;align-items:center;gap:14px;}
.wx-emoji{font-size:40px;line-height:1;flex-shrink:0;}
.wx-place{font-size:16px;font-weight:500;color:var(--text);line-height:1.3;}
.wx-desc{font-size:12.5px;color:var(--muted);margin-top:2px;}
.wx-temp{margin-left:auto;font-size:32px;font-weight:400;color:var(--text);letter-spacing:-.02em;flex-shrink:0;}
.wx-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px;}
.wx-days{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);}
html.dark .wx-days{border-top-color:#3c4043;}
.wx-day{flex:1;text-align:center;padding:4px 0;}
.wx-day .d{font-size:11.5px;color:var(--muted);}
.wx-day .e{font-size:20px;margin:5px 0;line-height:1;}
.wx-day .t{font-size:12px;color:var(--text);font-weight:500;}

/* 右栏辅助卡片 */
.side-card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:var(--bg);animation:gFadeIn .22s var(--g-ease-out) both;}
.side-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.side-title i{font-size:14px;color:var(--muted);}
.source-row{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--text-soft);padding:7px 0;}
.source-row + .source-row{border-top:1px solid var(--line-soft);}
html.dark .source-row + .source-row{border-top-color:#3c4043;}
.source-row span{display:flex;align-items:center;gap:9px;}
.source-row i{font-size:13px;color:var(--muted);}
.source-row b{color:var(--text);font-weight:600;font-size:13px;}

.related-list{display:flex;flex-direction:column;gap:2px;margin:0 -8px;}
.related-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--text);cursor:pointer;transition:background .12s var(--g-ease);}
.related-item:hover{background:var(--chip-bg);}
.related-item i{font-size:12px;color:var(--muted);flex-shrink:0;}

/* 骨架屏 */
.g-skeleton{max-width:600px;margin-bottom:29px;animation:gFadeIn .2s var(--g-ease-out) both;}
.sk-site{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.sk-fav{width:26px;height:26px;border-radius:50%;background:var(--line);flex-shrink:0;animation:skPulse 1.4s var(--g-ease) infinite;}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:6px;}
.sk-line{height:12px;border-radius:6px;background:var(--line);animation:skPulse 1.4s var(--g-ease) infinite;}
.sk-w30{width:30%;} .sk-w50{width:50%;} .sk-w75{width:75%;} .sk-w90{width:90%;}
.sk-title{height:18px;width:70%;margin-bottom:11px;border-radius:8px;}
@keyframes skPulse{0%,100%{opacity:.55;}50%{opacity:1;}}

/* 空 / 分页 / 更多 */
.g-empty{padding:40px 0 20px;max-width:600px;animation:gFadeIn .22s var(--g-ease-out) both;}
.g-empty h3{font-size:18px;font-weight:400;color:var(--text);margin:0 0 12px;}
.g-empty p{font-size:14px;color:var(--muted);line-height:1.7;margin:0;}

.pagination{display:flex;align-items:center;justify-content:center;gap:6px;margin:40px auto 20px;max-width:600px;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--line-soft);}
html.dark .pagination{border-top-color:#3c4043;}
.page-btn{min-width:36px;height:36px;padding:0 12px;border:1px solid var(--line);border-radius:18px;background:var(--bg);color:var(--text-soft);font-size:13px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-family:inherit;user-select:none;transition:border-color .15s var(--g-ease),color .15s var(--g-ease),background .15s var(--g-ease);}
.page-btn i{font-size:13px;}
.page-btn:hover:not(:disabled):not(.current){border-color:var(--blue);color:var(--blue);background:rgba(66,133,244,.05);}
.page-btn.current{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;cursor:default;}
.page-btn:disabled{opacity:.38;cursor:not-allowed;}
.page-ellipsis{min-width:24px;text-align:center;color:var(--muted);font-size:13px;user-select:none;padding:0 4px;}

.g-more{margin-top:24px;max-width:600px;padding:20px 0 40px;border-top:1px solid var(--line-soft);}
html.dark .g-more{border-top-color:#3c4043;}
.g-more-title{font-size:14px;color:var(--muted);margin-bottom:14px;}
.g-more-links{display:flex;flex-wrap:wrap;gap:8px;}
.g-more-links a{padding:8px 14px;border:1px solid var(--line);border-radius:18px;font-size:13px;color:var(--text-soft);transition:border-color .15s var(--g-ease),color .15s var(--g-ease),background .15s var(--g-ease);display:inline-flex;align-items:center;gap:7px;}
.g-more-links a i{font-size:13px;line-height:1;display:inline-block;vertical-align:middle;}
.g-more-links a:hover{border-color:var(--blue);color:var(--blue);background:rgba(66,133,244,.06);}

/* 响应式 */
@media (max-width:1024px){
  .r-content{display:flex;flex-direction:column;max-width:740px;gap:0;padding:12px 16px 40px;align-items:stretch;}
  .r-aside{position:static;order:-1;margin-bottom:14px;gap:14px;max-height:none;overflow:visible;}
  .r-aside .side-card{display:none;}
  .r-stat{max-width:none;padding:8px 16px 0;}
}
@media (max-width:860px){
  .home-header{padding:10px 14px;gap:8px;}
  .header-link{font-size:12px;padding:5px 7px;}
  .round-btn{width:36px;height:36px;}
  .mi-btn img{width:22px;height:22px;}
  .comra-icon-btn svg{width:22px;height:22px;}
  .r-header{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"rleft rlogo rtheme" "rsearch rsearch rsearch";align-items:center;gap:10px 8px;padding:10px 14px;}
  .r-left{grid-area:rleft;justify-self:start;}
  .r-logo{grid-area:rlogo;justify-self:center;}
  .r-logo svg{width:26px;height:26px;}
  .r-theme{grid-area:rtheme;justify-self:end;margin-left:0;}
  .r-search-wrap{grid-area:rsearch;max-width:none;flex:initial;}
  .r-tabs{padding:0 14px;}
  .r-tab{margin-right:16px;font-size:13px;}
  .g-title{font-size:18px;}
  .pagination{gap:4px;margin:32px auto 16px;}
  .page-btn{min-width:32px;height:32px;padding:0 9px;font-size:12px;}
}
@media (max-width:640px){
  .home-main{padding:0 20px 18vh;}
  .logo-mark{width:72px;height:72px;}
  .logo{margin-bottom:12px;}
  .logo-sub{font-size:13px;margin-bottom:26px;}
  .home-search{max-width:100%;}
  .searchbox{height:44px;padding:0 12px 0 14px;border-radius:22px;}
  .searchbox input{font-size:15px;}
  .home-btns{gap:8px;margin-top:22px;}
  .home-btn{height:34px;padding:0 13px;font-size:13px;}

const OFFICIAL_SITES = SITE_DATA.trim().split('\n').filter(line => line.trim() && line.indexOf('|') > -1).map(line => {
  const parts = line.split('|'); if(parts.length < 3) return null;
  const name = parts[0].trim();
  const aliasArr = (parts[1] || '').split(',').map(a => norm(a)).filter(Boolean);
  const names = [norm(name), ...aliasArr].filter(Boolean);
  return { name, names, url: parts[2].trim(), desc: parts[3] ? parts[3].trim() : '', cat: parts[4] ? parts[4].trim() : '' };
}).filter(Boolean);

function matchOfficial(query){
  const q = norm(query); if(!q) return null;
  let best = null, bestScore = 0;
  for(let i = 0; i < OFFICIAL_SITES.length; i++){
    const site = OFFICIAL_SITES[i];
    for(let j = 0; j < site.names.length; j++){
      const n = site.names[j]; if(!n) continue;
      let s = 0;
      if(n === q){ s = 1000; }
      else if(n.length >= 2 && q.length >= 2){
        if(q.indexOf(n) !== -1){ if(q.length <= n.length * 3 + 2) s = 600 + n.length * 10; }
        else if(n.indexOf(q) !== -1){ if(q.length >= n.length * 0.6) s = 500 + q.length * 10; }
      }
      if(s > bestScore){ bestScore = s; best = site; }
    }
  }
  return bestScore >= 500 ? { site: best, score: bestScore } : null;
}

function tryMath(raw){
  let s=String(raw).replace(/\s/g,'').replace(/[×✕✖]/g,'*').replace(/[÷]/g,'/').replace(/（/g,'(').replace(/）/g,')').replace(/[，。？！、,.?!]/g,'');
  s=s.replace(/(等于多少|等于几|等于|是多少|是几|计算|算一下|帮我算|请问|求)/g,''); if(!s) return null;
  let m=s.match(/^(\d+(?:\.\d+)?)(?:的)?(平方|立方|二次方|三次方)$/);
  if(m){ const n=parseFloat(m[1]); const p=(m[2]==='平方'||m[2]==='二次方')?2:3; return {expr:`${m[1]}${m[2]}`,val:Math.pow(n,p)}; }
  m=s.match(/^(?:根号|√)(\d+(?:\.\d+)?)$/); if(m) return {expr:`√${m[1]}`,val:Math.sqrt(parseFloat(m[1]))};
  m=s.match(/^(\d+(?:\.\d+)?)%(?:的)?(\d+(?:\.\d+)?)$/); if(m) return {expr:`${m[1]}% × ${m[2]}`,val:parseFloat(m[1])/100*parseFloat(m[2])};
  m=s.match(/^(\d+(?:\.\d+)?)的(\d+(?:\.\d+)?)%$/); if(m) return {expr:`${m[1]} × ${m[2]}%`,val:parseFloat(m[1])*parseFloat(m[2])/100};
  if(/^[\d+\-*/().%]+$/.test(s)&&/[+\-*/%]/.test(s)){ try{ const v=Function('"use strict";return('+s+')')(); if(typeof v==='number'&&isFinite(v)) return {expr:s,val:v}; }catch(e){} }
  return null;
}

/* SearXNG：解析 HTML（公共实例 JSON API 通常被禁用） */
async function searxngSearch(q){
  const instances = ['https://searx.be', 'https://search.bus-hit.me', 'https://searx.tiekoetter.com', 'https://priv.au'];
  for(const base of instances){
    try{
      const target = `${base}/search?q=${encodeURIComponent(q)}&safesearch=0`;
      const res = await proxiedFetch(target, {}, 7000); if(!res) continue;
      const html = await res.text(); const results = [];
      const re = /<article[^>]*class="[^"]*result[^"]*"[^>]*>[\s\S]*?<a[^>]*href="([^"]+)"[^>]*>([\s\S]*?)<\/a>[\s\S]*?<p[^>]*class="[^"]*content[^"]*"[^>]*>([\s\S]*?)<\/p>/gi;
      let m;
      while((m = re.exec(html)) !== null && results.length < 20){
        const url = m[1].startsWith('http') ? m[1] : base + m[1];
        results.push({ title: stripHtml(m[2]), url, snippet: stripHtml(m[3]), site: domainOf(url) || 'SearXNG', source: 'searxng' });
      }
      if(results.length) return results;
    }catch(e){ continue; }
  }
  return [];
}

/* 打分排序 */
const SOURCE_WEIGHT = { official:1000, kb:8, tavily:6, ddg:5, searxng:5, purili:5, 'ddg-html':5, hn:3, github:3, openalex:2, crossref:2 };
function scoreResult(r, query){
  if(r.source === 'official') return 99999;
  const q = norm(query); const title = norm(r.title || ''); const sn = norm(r.snippet || '');
  let score = 1;
  if(q && title.indexOf(q) !== -1) score += 20;
  if(q && sn.indexOf(q) !== -1) score += 5;
  const tokens = q.match(/[\u4e00-\u9fa5]{2,}|[a-z]{3,}/gi) || [];
  tokens.forEach(t => { const tt = norm(t); if(title.indexOf(tt) !== -1) score += 6; if(sn.indexOf(tt) !== -1) score += 2; });
  score += (SOURCE_WEIGHT[r.source] || 0);
  if(r.snippet && r.snippet.length > 40) score += 2;
  if(r.url) score += 1;
  return score;
}

/* 检索主流程 */
async function runSearch(query){
  const t0 = performance.now(); const c = norm(query); const cards = []; const collected = [];

  /* 官网匹配 */
  const official = matchOfficial(query); let officialHit = false;
  if(official){
    const s = official.site;
    collected.push({ title: s.name + ' — 官方网站', url: s.url, snippet: s.desc || (s.name + ' 官方网站，点击直达。'), site: domainOf(s.url) || s.cat || '官网', source: 'official', officialName: s.name });
    cards.push({ type:'note', label:'官方网站 · 康荣预置', icon:'la-check-circle', title: s.name, text: (s.desc || '') + '\n\n' + s.url, url: s.url });
    officialHit = true;
  }

  /* 结构化直答 */
  if(/(几点了|现在几点|现在时间|当前时间)/.test(c)) cards.push({ type:'note', label:'当前时间', icon:'la-clock', text: timeText() });
  if(/(今天几号|今天日期|几月几号|什么日期)/.test(c)) cards.push({ type:'note', label:'今天日期', icon:'la-calendar', text: dateText() });
  if(/(星期几|周几)/.test(c)) cards.push({ type:'note', label:'星期', icon:'la-calendar-day', text: '今天是 ' + WEEK[new Date().getDay()] + '。' });
  const math = tryMath(query); if(math) cards.push({ type:'calc', label:'计算结果', icon:'la-calculator', expr: math.expr, val: fmt(math.val) });

  /* 本地知识库 */
  const kb = matchKB(c); const hasKB = !!(kb.item && kb.score >= 2);
  if(hasKB){
    if(!officialHit) cards.push({ type:'note', label:'康荣速览', icon:'la-lightbulb', title: kb.item.title, text: kb.item.desc });
    collected.push({ title: kb.item.title, url: null, snippet: kb.item.desc, site: '康荣知识库', source: 'kb' });
  }

  /* 网络检索 */
  const isWx = /(天气|气温|温度|下雨|冷不冷|热不热|刮风|阴晴)/.test(c);
  const city = isWx ? (extractCity(query) || '北京') : null;
  const hasChinese = /[\u4e00-\u9fa5]/.test(query);

  const settled = await Promise.allSettled([
    ddgSearch(query),
    tavilySearch(query),
    searxngSearch(query),
    puriliSearch(query),
    ddgHtmlSearch(query),
    hnSearch(query, 30),
    openAlexSearch(query, 30),
    crossrefSearch(query, 20),
    githubSearch(query, 20),
    city ? fetchWeather(city) : Promise.resolve(null)
  ]);

  const ddg = settled[0].status==='fulfilled'?settled[0].value:{answer:null,related:[]};
  const tav = settled[1].status==='fulfilled'?settled[1].value:{answer:null,results:[]};
  const searxngRes = settled[2].status==='fulfilled'?settled[2].value:[];
  const puriliRes = settled[3].status==='fulfilled'?settled[3].value:[];
  const ddgHtmlRes = settled[4].status==='fulfilled'?settled[4].value:[];
  const hnRes = settled[5].status==='fulfilled'?settled[5].value:[];
  const oaRes = settled[6].status==='fulfilled'?settled[6].value:[];
  const crRes = settled[7].status==='fulfilled'?settled[7].value:[];
  const ghRes = settled[8].status==='fulfilled'?settled[8].value:[];
  const wx = settled[9].status==='fulfilled'?settled[9].value:null;

  if(wx) cards.push({ type:'weather', label:'实时天气 · wttr.in', icon:'la-cloud-sun', data: wx });

  if(ddg){
    const ans = ddg.answer || ddg.abstract;
    if(ans && !officialHit) cards.push({ type:'note', label: ddg.answer?'即时答案 · DuckDuckGo':('速览 · '+(ddg.heading||'DuckDuckGo')), icon:'la-bolt', text: ans, url: ddg.abstractUrl });
    ddg.related.slice(0,10).forEach(r => { if(!r.url) return; collected.push({ title: trim(String(r.text||'').split(' - ')[0].trim(),90)||domainOf(r.url)||r.url, url: r.url, snippet: r.text, site: domainOf(r.url)||'DuckDuckGo', source:'ddg' }); });
  }

  if(tav){
    const hasAnswerCard = cards.some(x => x.label && x.label.indexOf('答案') !== -1);
    if(tav.answer && !hasAnswerCard && !officialHit) cards.push({ type:'note', label:'联网摘要 · Tavily', icon:'la-bolt', text: tav.answer });
    tav.results.forEach(r => { if(!r.url||!r.content) return; collected.push({ title: r.title||domainOf(r.url)||r.url, url: r.url, snippet: r.content, site: domainOf(r.url)||'网页', source:'tavily' }); });
  }

  [...searxngRes, ...puriliRes, ...ddgHtmlRes, ...hnRes, ...oaRes, ...crRes, ...ghRes].forEach(r => collected.push(r));

  /* 去重 & 排序 */
  const seen = new Set(); const deduped = [];
  collected.forEach(r => { const key = normalizeUrl(r.url); if(key && seen.has(key)) return; if(key) seen.add(key); r.score = scoreResult(r, query); deduped.push(r); });
  deduped.sort((a,b) => { if(a.source === 'official' && b.source !== 'official') return -1; if(b.source === 'official' && a.source !== 'official') return 1; return b.score - a.score; });

  const elapsed = ((performance.now()-t0)/1000).toFixed(2);
  return { cards, all: deduped, query, elapsed, kbHit: hasKB, officialHit };
}

  const rows = []; groups.forEach(g => { const n = state.all.filter(g.test).length; if(n > 0) rows.push({ label: g.label, icon: g.icon, n }); }); if(!rows.length) return null;
  const box = document.createElement('div'); box.className = 'side-card'; const title = document.createElement('div'); title.className = 'side-title'; title.innerHTML = '<i class="las la-chart-pie"></i>结果来源'; box.appendChild(title);
  rows.forEach(r => { const row = document.createElement('div'); row.className = 'source-row'; const left = document.createElement('span'); left.innerHTML = '<i class="las ' + r.icon + '"></i>' + r.label; const right = document.createElement('b'); right.textContent = r.n; row.appendChild(left); row.appendChild(right); box.appendChild(row); }); return box;
}

function renderRelatedSearches(query){
  const q = String(query || '').trim(); if(!q) return null;
  const suffixes = ['是什么', '官网', '新闻', '百科', '教程']; const list = suffixes.map(s => q + ' ' + s);
  const box = document.createElement('div'); box.className = 'side-card'; const title = document.createElement('div'); title.className = 'side-title'; title.innerHTML = '<i class="las la-search"></i>相关搜索'; box.appendChild(title);
  const wrap = document.createElement('div'); wrap.className = 'related-list';
  list.forEach(t => { const item = document.createElement('div'); item.className = 'related-item'; const ic = document.createElement('i'); ic.className = 'las la-search'; const span = document.createElement('span'); span.textContent = t; item.appendChild(ic); item.appendChild(span); item.addEventListener('click', () => performSearch(t)); wrap.appendChild(item); });
  box.appendChild(wrap); return box;
}

/* 骨架屏 */
function renderSkeleton(count){
  P.rMain.innerHTML = ''; P.rAside.innerHTML = '';
  for(let i = 0; i < count; i++){ const sk = document.createElement('div'); sk.className = 'g-skeleton'; sk.innerHTML = '<div class="sk-site"><div class="sk-fav"></div><div class="sk-lines"><div class="sk-line sk-w30"></div><div class="sk-line sk-w50"></div></div></div><div class="sk-line sk-title"></div><div class="sk-line sk-w90"></div><div class="sk-line sk-w75"></div>'; P.rMain.appendChild(sk); }
}

/* 分页 */
function computePages(current, total){
  const pages = []; if(total <= 7){ for(let i=1;i<=total;i++) pages.push(i); return pages; }
  if(current <= 4){ for(let i=1;i<=5;i++) pages.push(i); pages.push('...'); pages.push(total); }
  else if(current >= total-3){ pages.push(1); pages.push('...'); for(let i=total-4;i<=total;i++) pages.push(i); }
  else{ pages.push(1); pages.push('...'); for(let i=current-1;i<=current+1;i++) pages.push(i); pages.push('...'); pages.push(total); }
  return pages;
}

function renderPagination(totalPages){
  if(totalPages <= 1) return null; const currentPage = state.page; const box = document.createElement('div'); box.className='pagination';
  const prev = document.createElement('button'); prev.className='page-btn'; prev.type='button'; prev.innerHTML = '<i class="las la-angle-left"></i><span>上一页</span>'; prev.disabled = currentPage === 1; prev.addEventListener('click', () => { if(currentPage>1) goToPage(currentPage-1); }); box.appendChild(prev);
  computePages(currentPage, totalPages).forEach(p => { if(p === '...'){ const sp = document.createElement('span'); sp.className='page-ellipsis'; sp.textContent='…'; box.appendChild(sp); } else { const b = document.createElement('button'); b.className='page-btn'+(p===currentPage?' current':''); b.type='button'; b.textContent=p; if(p!==currentPage) b.addEventListener('click',()=>goToPage(p)); box.appendChild(b); } });
  const next = document.createElement('button'); next.className='page-btn'; next.type='button'; next.innerHTML = '<span>下一页</span><i class="las la-angle-right"></i>'; next.disabled = currentPage === totalPages; next.addEventListener('click', () => { if(currentPage<totalPages) goToPage(currentPage+1); }); box.appendChild(next);
  return box;
}

function goToPage(page){ state.page = page; renderCategory(); const headerH = P.rHeader.offsetHeight + 8; const top = P.rMain.getBoundingClientRect().top + window.scrollY - headerH; window.scrollTo({ top, behavior: 'smooth' }); }

/* 渲染调度 */
function updateTabs(){ P.rTabs.querySelectorAll('.r-tab').forEach(tab => { const cat = tab.dataset.tab; const label = CAT_LABELS[cat]||cat; const n = countForCat(cat); tab.textContent = n>0 ? label+' ('+n+')' : label; }); }

function updateStat(){ const list = getFiltered(state.cat); const total = list.length; if(total > 0){ const start = (state.page-1)*state.pageSize + 1; const end = Math.min(state.page*state.pageSize, total); const rangeText = (start===end) ? ('第 '+start+' 条') : ('第 '+start+'–'+end+' 条'); P.rStat.textContent = rangeText + '，共 ' + total + ' 条结果（用时 ' + state.elapsed + ' 秒）'; } else { P.rStat.textContent = '找不到与「'+trim(state.query,30)+'」相关的结果'; } }

function renderAside(){ P.rAside.innerHTML = ''; if(state.cards.length){ state.cards.forEach((c, idx) => { const el = renderCard(c); el.style.animationDelay = (idx * 30) + 'ms'; P.rAside.appendChild(el); }); } if(state.all.length){ const stats = renderSourceStats(); if(stats) P.rAside.appendChild(stats); } const related = renderRelatedSearches(state.query); if(related) P.rAside.appendChild(related); P.rAside.scrollTop = 0; }

function renderCategory(){
  const list = getFiltered(state.cat); const totalPages = Math.max(1, Math.ceil(list.length / state.pageSize)); if(state.page > totalPages) state.page = totalPages; if(state.page < 1) state.page = 1;
  const start = (state.page-1)*state.pageSize; const end = Math.min(start + state.pageSize, list.length);
  renderAside(); P.rMain.innerHTML = '';
  if(list.length === 0){ P.rMain.appendChild(renderEmpty(state.query)); updateStat(); if(state.cat === 'all') P.rMain.appendChild(renderMoreBlock(state.query)); return; }
  for(let i=start;i<end;i++){ const el = renderResult(list[i]); el.style.animationDelay = ((i - start) * 25) + 'ms'; P.rMain.appendChild(el); }
  const pg = renderPagination(totalPages); if(pg) P.rMain.appendChild(pg); updateStat(); if(state.cat === 'all') P.rMain.appendChild(renderMoreBlock(state.query));
}

function renderAll(data){
  state.query = data.query; state.cards = data.cards || []; state.all = data.all || []; state.elapsed = data.elapsed || '0'; state.kbHit = !!data.kbHit; state.page = 1; state.cat = 'all';
  P.rTabs.querySelectorAll('.r-tab').forEach(t => t.classList.remove('active')); const allTab = P.rTabs.querySelector('[data-tab="all"]'); if(allTab) allTab.classList.add('active');
  updateTabs(); renderCategory();
}

/* 搜索历史 */
const HISTORY_KEY = 'comra_history_v1';
function loadHistory(){ try{ const raw = localStorage.getItem(HISTORY_KEY); const arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; }catch(e){ return []; } }
function saveHistory(list){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0,12))); }catch(e){} }
function addHistory(q){ const list = loadHistory().filter(x => x !== q); list.unshift(q); saveHistory(list); }

/* 视图切换 */
function showHome(){ state.token++; state.busy = false; state.view = 'home'; P.homeView.hidden = false; P.resultsView.hidden = true; document.title = '康荣'; window.scrollTo(0,0); hideProgress(); setTimeout(() => P.qHome.focus(), 30); }
function showResults(q){ state.view = 'results'; P.qResults.value = q; P.clrResults.classList.toggle('on', !!q); P.homeView.hidden = true; P.resultsView.hidden = false; P.rHeader.classList.remove('scrolled'); document.title = q + ' · 康荣'; window.scrollTo(0,0); }
function getActiveInput(){ return state.view === 'home' ? P.qHome : P.qResults; }

/* 进度条 */
let progressTimer = null;
function showProgress(){ clearTimeout(progressTimer); P.progressBar.classList.add('active'); }
function hideProgress(){ clearTimeout(progressTimer); progressTimer = setTimeout(() => P.progressBar.classList.remove('active'), 220); }

/* 搜索动作 */
async function performSearch(rawQuery){
  const query = String(rawQuery == null ? getActiveInput().value : rawQuery).trim(); if(!query){ getActiveInput().focus(); return; } if(state.busy) return;
  state.busy = true; const token = ++state.token; addHistory(query); showResults(query); showProgress(); P.rStat.textContent = ''; renderSkeleton(4);
  try{ const data = await runSearch(query); if(token !== state.token) return; renderAll(data); hideProgress(); window.scrollTo({ top:0, behavior:'smooth' }); }
  catch(e){ if(token !== state.token) return; hideProgress(); P.rMain.innerHTML = ''; P.rAside.innerHTML = ''; const err = document.createElement('div'); err.className='g-empty'; err.innerHTML = '<h3>检索出错了</h3><p>请检查网络连接后重试，或换个关键词。</p>'; P.rMain.appendChild(err); P.rMain.appendChild(renderMoreBlock(query)); }
  finally{ if(token === state.token) state.busy = false; }
}

async function luckySearch(){
  const q = P.qHome.value.trim();
  if(!q){ const site = OFFICIAL_SITES[Math.floor(Math.random() * OFFICIAL_SITES.length)]; window.open(site.url, '_blank', 'noopener'); return; }
  const off = matchOfficial(q); if(off){ window.open(off.site.url, '_blank', 'noopener'); return; }
  state.busy = true;
  try{ const data = await runSearch(q); const first = data.all.find(l => l.url); if(first){ window.open(first.url, '_blank', 'noopener'); state.busy = false; return; } }catch(e){}
  state.busy = false; performSearch(q);
}

/* 联想 */
let sugItems = []; let sugIndex = -1;
function hideSuggest(el){ el.classList.remove('open'); el.innerHTML=''; sugItems=[]; sugIndex=-1; }
function showSuggest(v, el, input){
  const n = norm(v); if(!n){ hideSuggest(el); return; }
  const out = []; const seen = new Set();
  OFFICIAL_SITES.forEach(site => { for(const nm of site.names){ if(!nm) continue; if(nm.indexOf(n) === 0 || (nm.length >= 2 && nm.indexOf(n) !== -1)){ if(!seen.has(site.name)){ seen.add(site.name); out.push({ t: site.name, type: 'site' }); } break; } } });
  loadHistory().forEach(h => { if(norm(h).indexOf(n) !== -1 && !seen.has(h)){ seen.add(h); out.push({ t:h, type:'history' }); } });
  KB.forEach(item => { if(norm(item.title).indexOf(n) !== -1 && !seen.has(item.title)){ seen.add(item.title); out.push({ t:item.title, type:'kb' }); } });
  if(!out.length){ hideSuggest(el); return; }
  sugItems = out.slice(0,8).map(x => x.t); sugIndex = -1; el.innerHTML = '';
  out.slice(0,8).forEach(x => { const row = document.createElement('div'); row.className='sug'; const ico = document.createElement('i'); ico.className = 'sug-ico las ' + (x.type === 'site' ? 'la-globe' : (x.type==='history' ? 'la-history' : 'la-lightbulb')); const txt = document.createElement('span'); txt.className='sug-t'; txt.textContent = x.t; row.appendChild(ico); row.appendChild(txt); row.addEventListener('mousedown', e => { e.preventDefault(); input.value = x.t; hideSuggest(el); onInput(input, input.parentNode.parentNode); performSearch(x.t); }); el.appendChild(row); });
  el.classList.add('open');
}
function moveSug(dir, el){ const rows = el.querySelectorAll('.sug'); if(!rows.length) return; if(sugIndex>=0) rows[sugIndex].classList.remove('active'); sugIndex = (sugIndex + dir + rows.length) % rows.length; rows[sugIndex].classList.add('active'); }
function onInput(input, wrap){ const v = input.value.trim(); const clr = wrap.querySelector('.clr-btn'); if(clr) clr.classList.toggle('on', !!v); const sug = wrap.querySelector('.suggest'); if(v) showSuggest(v, sug, input); else hideSuggest(sug); }
function setupInput(input, wrap, suggestEl){
  input.addEventListener('input', () => onInput(input, wrap));
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ if(e.isComposing) return; e.preventDefault(); if(sugIndex>=0 && sugItems[sugIndex]){ input.value = sugItems[sugIndex]; hideSuggest(suggestEl); onInput(input, wrap); } performSearch(input.value); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); moveSug(1, suggestEl); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); moveSug(-1, suggestEl); }
    else if(e.key === 'Escape'){ hideSuggest(suggestEl); }
  });
  input.addEventListener('blur', () => setTimeout(() => hideSuggest(suggestEl), 130));
}

/* 事件绑定 */
setupInput(P.qHome, P.homeSearchWrap, P.sugHome);
setupInput(P.qResults, P.rSearchWrap, P.sugResults);
$('goHome').addEventListener('click', () => performSearch(P.qHome.value));
$('goResults').addEventListener('click', () => performSearch(P.qResults.value));
$('btnSearch').addEventListener('click', () => performSearch(P.qHome.value));
$('btnLucky').addEventListener('click', luckySearch);
$('clrHome').addEventListener('click', () => { P.qHome.value=''; P.clrHome.classList.remove('on'); hideSuggest(P.sugHome); P.qHome.focus(); });
$('clrResults').addEventListener('click', () => { P.qResults.value=''; P.clrResults.classList.remove('on'); hideSuggest(P.sugResults); P.qResults.focus(); });
$('rLogo').addEventListener('click', e => { e.preventDefault(); showHome(); });
$('comraIconHome').addEventListener('click', () => { P.qHome.focus(); });

P.rTabs.addEventListener('click', e => { const tab = e.target.closest('.r-tab'); if(!tab || tab.classList.contains('active')) return; P.rTabs.querySelectorAll('.r-tab').forEach(t => t.classList.remove('active')); tab.classList.add('active'); state.cat = tab.dataset.tab || 'all'; state.page = 1; renderCategory(); window.scrollTo({ top:0, behavior:'smooth' }); });

window.addEventListener('scroll', () => { if(state.view !== 'results') return; if(window.scrollY > 2) P.rHeader.classList.add('scrolled'); else P.rHeader.classList.remove('scrolled'); }, { passive:true });

document.addEventListener('mousedown', e => { if(!P.sugHome.contains(e.target) && e.target !== P.qHome) hideSuggest(P.sugHome); if(!P.sugResults.contains(e.target) && e.target !== P.qResults) hideSuggest(P.sugResults); });

/* 主题 */
function applyTheme(dark){ document.documentElement.classList.toggle('dark', dark); if(P.themeIconHome) P.themeIconHome.className = 'las ' + (dark?'la-sun':'la-moon'); if(P.themeIconResults) P.themeIconResults.className = 'las ' + (dark?'la-sun':'la-moon'); const meta = document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', dark?'#202124':'#ffffff'); try{ localStorage.setItem('comra_theme', dark?'dark':'light'); }catch(e){} }
(function initTheme(){ let saved=null; try{ saved=localStorage.getItem('comra_theme'); }catch(e){} if(saved) applyTheme(saved==='dark'); else applyTheme(!!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)); })();
$('themeBtnHome').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));
$('themeBtnResults').addEventListener('click', () => applyTheme(!document.documentElement.classList.contains('dark')));

/* 杂项 */
$('lnkAbout').addEventListener('click', e => { e.preventDefault(); performSearch('康荣 ComRa 是什么'); });
$('lnkKB').addEventListener('click', e => { e.preventDefault(); performSearch('预置官网库'); });
$('langZh').addEventListener('click', e => { e.preventDefault(); performSearch('康荣 ComRa 是什么'); });
$('langEn').addEventListener('click', e => { e.preventDefault(); performSearch('ComRa search engine'); });
$('fAbout').addEventListener('click', e => { e.preventDefault(); performSearch('康荣 ComRa 是什么'); });
$('fHow').addEventListener('click', e => { e.preventDefault(); performSearch('康荣的检索链路'); });
$('fKB').addEventListener('click', e => { e.preventDefault(); performSearch('预置官网库'); });
$('fPrivacy').addEventListener('click', e => { e.preventDefault(); performSearch('隐私与数据说明'); });
$('fTerms').addEventListener('click', e => { e.preventDefault(); performSearch('康荣 ComRa 是什么'); });
$('fSettings').addEventListener('click', e => { e.preventDefault(); applyTheme(!document.documentElement.classList.contains('dark')); });

setTimeout(() => P.qHome.focus(), 200);
})();
</script>
