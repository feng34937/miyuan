<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>康荣</title>
<meta name="theme-color" content="#ffffff">
<!-- Line Awesome（页面其余图标） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
<!-- Font Awesome（外部引擎按钮图标） -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#fff; --text:#202124; --text-soft:#4d5156; --muted:#70757a;
  --line:#dfe1e5; --line-soft:#ebebeb; --link:#1a0dab; --link-visited:#681da8;
  --url:#006621; --btn-bg:#f8f9fa; --btn-border:#f8f9fa; --btn-text:#3c4043;
  --btn-hover-border:#dadce0; --btn-hover-shadow:0 1px 1px rgba(0,0,0,.1);
  --blue:#4285F4; --search-shadow:0 1px 6px rgba(32,33,36,.28);
  --search-bg:#fff; --chip-bg:#f1f3f4; --suggest-hover:#f8f9fa;
  --footer-bg:#f2f2f2; --tab-line:#ebebeb; --tab-active:#1a73e8;
  --g-ease:cubic-bezier(.4,0,.2,1);
  --g-ease-out:cubic-bezier(0,0,.2,1);
  --g-ease-in:cubic-bezier(.4,0,1,1);
}
html.dark{
  --bg:#202124; --text:#e8eaed; --text-soft:#bdc1c6; --muted:#9aa0a6;
  --line:#3c4043; --line-soft:#3c4043; --link:#8ab4f8; --link-visited:#c58af9;
  --url:#5db85e; --btn-bg:#303134; --btn-border:#303134; --btn-text:#e8eaed;
  --btn-hover-border:#5f6368; --btn-hover-shadow:0 1px 1px rgba(0,0,0,.5);
  --blue:#8ab4f8; --search-shadow:0 1px 6px rgba(0,0,0,.6);
  --search-bg:#202124; --chip-bg:#3c4043; --suggest-hover:#303134;
  --footer-bg:#171717; --tab-line:#3c4043; --tab-active:#8ab4f8;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:arial,sans-serif; font-size:14px; color:var(--text);
  background:var(--bg); -webkit-font-smoothing:antialiased;
  transition:background .2s var(--g-ease),color .2s var(--g-ease);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;}
[hidden]{display:none !important;}
i.las,i.lar{display:inline-block;line-height:1;vertical-align:middle;}

/* ============================================================
   顶部加载进度条
   ============================================================ */
.progress-bar{
  position:fixed; top:0; left:0; right:0;
  height:3px; z-index:9999;
  display:none; overflow:hidden;
  pointer-events:none; background:transparent;
}
.progress-bar.active{display:block;}
.progress-bar::before{
  content:'';
  position:absolute; top:0; height:100%;
  background:#4285F4;
  border-radius:0 3px 3px 0;
  box-shadow:0 0 8px rgba(66,133,244,.6);
  animation:progressIndeterminate 1.8s var(--g-ease) infinite;
}
html.dark .progress-bar::before{
  background:#8ab4f8;
  box-shadow:0 0 8px rgba(138,180,248,.6);
}
@keyframes progressIndeterminate{
  0%{left:-35%; width:35%;}
  50%{left:40%; width:45%;}
  100%{left:100%; width:35%;}
}

/* ============================================================
   搜索框
   ============================================================ */
.searchbox{
  display:flex; align-items:center; height:46px;
  background:var(--search-bg); border:1px solid var(--line);
  border-radius:24px; padding:0 12px 0 18px; width:100%;
  transition:box-shadow .2s var(--g-ease),border-color .2s var(--g-ease);
}
.searchbox:hover,.searchbox:focus-within{
  box-shadow:var(--search-shadow); border-color:transparent;
}
.searchbox .si{font-size:18px;color:var(--muted);margin-right:12px;flex-shrink:0;}
.searchbox input{
  flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;
  font-family:inherit;font-size:16px;color:var(--text);
}
.searchbox input::placeholder{color:var(--muted);opacity:.9;}
.clr-btn{
  display:none;place-items:center;width:28px;height:28px;border:0;
  border-radius:50%;background:transparent;color:var(--muted);cursor:pointer;
  padding:0;flex-shrink:0;font-size:14px;
  transition:background .15s var(--g-ease),color .15s var(--g-ease);
}
.clr-btn:hover{background:var(--chip-bg);color:var(--text);}
.clr-btn.on{display:grid;}
.go-btn{
  flex-shrink:0;width:34px;height:34px;border:0;border-radius:50%;
  background:transparent;cursor:pointer;display:grid;place-items:center;
  padding:0;transition:background .15s var(--g-ease);color:var(--blue);font-size:18px;
}
.go-btn:hover{background:var(--chip-bg);}

/* ============================================================
   联想下拉
   ============================================================ */
.suggest{
  position:absolute;left:0;right:0;top:calc(100% + 6px);
  background:var(--search-bg);border-radius:0 0 24px 24px;
  box-shadow:0 4px 6px rgba(32,33,36,.28);
  overflow:hidden;z-index:100;display:none;padding:0 0 8px;
  animation:suggestIn .12s var(--g-ease-out);
}
.suggest.open{display:block;}
@keyframes suggestIn{
  from{opacity:0; transform:translateY(-4px);}
  to{opacity:1; transform:none;}
}
.sug{
  display:flex;align-items:center;gap:14px;padding:8px 20px;
  font-size:15px;cursor:pointer;color:var(--text);
  transition:background .12s var(--g-ease);
}
.sug:hover,.sug.active{background:var(--suggest-hover);}
.sug .sug-ico{width:18px;text-align:center;font-size:14px;color:var(--muted);flex-shrink:0;}
.sug .sug-t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

/* ============================================================
   圆形图标按钮
   ============================================================ */
.round-btn{
  width:38px;height:38px;border-radius:50%;
  display:grid;place-items:center;
  border:1px solid transparent;background:transparent;
  cursor:pointer;padding:0;flex-shrink:0;
  transition:background .15s var(--g-ease),transform .15s var(--g-ease);
}
.round-btn:hover{background:var(--chip-bg);}
.round-btn:active{transform:scale(.94);}
.mi-btn img{width:24px;height:24px;object-fit:contain;display:block;border-radius:50%;}
.comra-icon-btn svg{width:24px;height:24px;display:block;}

/* ============================================================
   首页
   ============================================================ */
.home-view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.home-header{
  display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:14px 22px;flex-shrink:0;
}
.header-left{display:flex;align-items:center;gap:6px;}
.header-right{display:flex;align-items:center;gap:6px;}
.header-link{
  font-size:13px;color:var(--text-soft);padding:6px 10px;
  border-radius:4px;transition:background .15s var(--g-ease),color .15s var(--g-ease);
}
.header-link:hover{background:var(--chip-bg);color:var(--text);}
.theme-toggle{
  width:38px;height:38px;border:0;border-radius:50%;background:transparent;
  color:var(--muted);cursor:pointer;display:grid;place-items:center;
  padding:0;transition:background .15s var(--g-ease),color .15s var(--g-ease);
  font-size:17px;
}
.theme-toggle:hover{background:var(--chip-bg);color:var(--text);}
.theme-toggle:active{transform:scale(.94);}

.home-main{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;padding:0 20px 12vh;
}

.logo{
  display:flex;
  align-items:center;
  justify-content:center;
  margin-bottom:14px;
  user-select:none;
}
.logo-mark{
  width:104px;
  height:104px;
  display:block;
  flex-shrink:0;
  filter:drop-shadow(0 3px 10px rgba(66,133,244,.20));
}
html.dark .logo-mark{
  filter:drop-shadow(0 3px 12px rgba(138,180,248,.28));
}
.logo-sub{
  margin-top:0;
  margin-bottom:34px;
  font-size:15px;
  letter-spacing:.5em;
  text-indent:.5em;
  color:var(--muted);
  font-weight:500;
}

.home-search{
  width:100%;max-width:584px;display:flex;flex-direction:column;
  align-items:center;position:relative;
}
.home-search .searchbox{height:46px;padding-left:18px;padding-right:8px;}
.home-btns{display:flex;gap:11px;margin-top:28px;}
.home-btn{
  height:36px;padding:0 16px;border:1px solid var(--btn-border);
  border-radius:4px;background:var(--btn-bg);color:var(--btn-text);
  font-size:14px;cursor:pointer;
  transition:border-color .15s var(--g-ease),box-shadow .15s var(--g-ease),color .15s var(--g-ease);
}
.home-btn:hover{
  border-color:var(--btn-hover-border);
  box-shadow:var(--btn-hover-shadow);color:var(--text);
}
.lang-note{margin-top:30px;font-size:13px;color:var(--text-soft);}
.lang-note a{color:#1a0dab;cursor:pointer;}
html.dark .lang-note a{color:#8ab4f8;}
.lang-note a:hover{text-decoration:underline;}
.home-footer{
  background:var(--footer-bg);border-top:1px solid var(--line-soft);
  padding:15px 30px;display:flex;justify-content:space-between;
  gap:16px;flex-wrap:wrap;font-size:14px;color:var(--muted);
}
.home-footer a{color:var(--muted);padding:0 6px;cursor:pointer;}
.home-footer a:hover{text-decoration:underline;color:var(--text);}
.footer-left,.footer-right{display:flex;gap:4px;flex-wrap:wrap;}

/* ============================================================
   结果页
   ============================================================ */
.results-view{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;}
.r-header{
  display:flex;align-items:center;gap:18px;
  padding:14px 26px 12px;flex-shrink:0;
  position:sticky;top:0;z-index:80;background:var(--bg);
  border-bottom:1px solid transparent;
  transition:border-color .15s var(--g-ease),box-shadow .15s var(--g-ease);
}
.r-header.scrolled{
  border-bottom-color:var(--line-soft);
  box-shadow:0 1px 4px rgba(32,33,36,.1);
}
html.dark .r-header.scrolled{
  border-bottom-color:#3c4043;
  box-shadow:0 1px 4px rgba(0,0,0,.5);
}
.r-left{display:flex;align-items:center;gap:6px;flex-shrink:0;}

.r-logo{
  display:flex;align-items:center;
  flex-shrink:0;cursor:pointer;
}
.r-logo svg{width:28px;height:28px;display:block;}

.r-search-wrap{flex:1;max-width:692px;position:relative;min-width:0;}
.r-search-wrap .searchbox{height:44px;padding-left:16px;padding-right:6px;}
.r-theme{
  width:38px;height:38px;flex-shrink:0;border:0;border-radius:50%;
  background:transparent;color:var(--muted);cursor:pointer;
  display:grid;place-items:center;padding:0;margin-left:auto;
  transition:background .15s var(--g-ease),color .15s var(--g-ease);
  font-size:17px;
}
.r-theme:hover{background:var(--chip-bg);color:var(--text);}
.r-theme:active{transform:scale(.94);}
.r-tabs{
  display:flex;gap:0;padding:0 26px;border-bottom:1px solid var(--tab-line);
  flex-shrink:0;overflow-x:auto;scrollbar-width:none;
}
.r-tabs::-webkit-scrollbar{display:none;}
.r-tab{
  padding:10px 4px 9px;margin-right:22px;font-size:14px;color:var(--muted);
  cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap;
  transition:color .15s var(--g-ease),border-color .15s var(--g-ease);
  flex-shrink:0;
}
.r-tab:hover{color:var(--text);}
.r-tab.active{color:var(--tab-active);border-bottom-color:var(--tab-active);}
.r-stat{
  padding:10px 26px 0;
  max-width:1120px;
  margin:0 auto;
  width:100%;
  font-size:14px;color:var(--muted);
}

/* ---------- 两栏布局 ---------- */
.r-content{
  width:100%;
  max-width:1120px;
  margin:0 auto;
  padding:14px 26px 60px;
  display:grid;
  grid-template-columns:minmax(0,652px) 360px;
  gap:32px;
  align-items:start;
  justify-content:center;
}
.r-main{min-width:0;width:100%;}

/* 右栏：桌面端独立滚动 */
.r-aside{
  min-width:0;
  position:sticky;
  top:90px;
  max-height:calc(100vh - 108px);
  overflow-y:auto;
  overscroll-behavior:contain;
  display:flex;
  flex-direction:column;
  gap:18px;
  scrollbar-width:thin;
  scrollbar-color:var(--line) transparent;
  scrollbar-gutter:stable;
}
.r-aside::-webkit-scrollbar{width:6px;}
.r-aside::-webkit-scrollbar-track{background:transparent;}
.r-aside::-webkit-scrollbar-thumb{background:var(--line);border-radius:3px;}
.r-aside::-webkit-scrollbar-thumb:hover{background:var(--muted);}

/* ============================================================
   结果条目
   ============================================================ */
.g-result{
  margin-bottom:29px;max-width:600px;
  animation:gFadeIn .22s var(--g-ease-out) both;
}
@keyframes gFadeIn{
  from{opacity:0;transform:translateY(4px);}
  to{opacity:1;transform:none;}
}
.g-site{display:flex;align-items:center;gap:12px;margin-bottom:3px;}
.g-fav{
  width:26px;height:26px;border-radius:50%;background:var(--chip-bg);
  display:grid;place-items:center;flex-shrink:0;overflow:hidden;
  font-size:11px;font-weight:700;color:#fff;
}
.g-fav img{width:18px;height:18px;object-fit:contain;display:block;}
.g-site-info{min-width:0;flex:1;}
.g-site-name{
  font-size:12px;color:var(--text);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  display:flex;align-items:center;gap:6px;
}
.g-source-tag{
  font-size:9px;font-weight:700;letter-spacing:.05em;
  padding:1px 5px;border-radius:3px;
  background:var(--chip-bg);color:var(--muted);flex-shrink:0;
}
.g-site-url{
  font-size:12px;color:var(--url);line-height:1.3;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.g-title{
  display:block;font-size:20px;line-height:1.3;color:var(--link);
  margin-bottom:4px;word-break:break-word;
  transition:color .15s var(--g-ease);
}
.g-title:hover{text-decoration:underline;}
.g-title:visited{color:var(--link-visited);}
.g-snippet{font-size:14px;line-height:1.58;color:var(--text-soft);word-break:break-word;}

/* ============================================================
   卡片（右栏）
   ============================================================ */
.g-card{
  border:1px solid var(--line);border-radius:8px;padding:18px 20px;
  max-width:none;margin-bottom:0;
  animation:gFadeIn .22s var(--g-ease-out) both;
  background:var(--bg);
}
.g-card-label{
  font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted);margin-bottom:12px;
  display:flex;align-items:center;gap:6px;
}
.g-card-label i{font-size:13px;}
.g-card-title{font-size:17px;font-weight:500;color:var(--text);margin-bottom:10px;line-height:1.35;}
.g-card-body{font-size:13.5px;line-height:1.62;color:var(--text-soft);white-space:pre-wrap;word-break:break-word;}
.g-card-link{display:inline-block;margin-top:12px;font-size:13px;color:var(--link);}
.g-card-link:hover{text-decoration:underline;}
.g-calc{font-size:26px;font-weight:500;color:var(--text);letter-spacing:-.01em;line-height:1.3;word-break:break-word;}
.g-calc small{font-size:14px;color:var(--muted);font-weight:400;}

.wx-top{display:flex;align-items:center;gap:14px;}
.wx-emoji{font-size:40px;line-height:1;flex-shrink:0;}
.wx-place{font-size:16px;font-weight:500;color:var(--text);line-height:1.3;}
.wx-desc{font-size:12.5px;color:var(--muted);margin-top:2px;}
.wx-temp{margin-left:auto;font-size:32px;font-weight:400;color:var(--text);letter-spacing:-.02em;flex-shrink:0;}
.wx-meta{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:12px;}
.wx-days{display:flex;gap:6px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft);}
html.dark .wx-days{border-top-color:#3c4043;}
.wx-day{flex:1;text-align:center;padding:4px 0;}
.wx-day .d{font-size:11.5px;color:var(--muted);}
.wx-day .e{font-size:20px;margin:5px 0;line-height:1;}
.wx-day .t{font-size:12px;color:var(--text);font-weight:500;}

/* ============================================================
   右栏辅助卡片
   ============================================================ */
.side-card{
  border:1px solid var(--line);
  border-radius:8px;
  padding:16px 18px;
  background:var(--bg);
  animation:gFadeIn .22s var(--g-ease-out) both;
}
.side-title{
  font-size:13px;
  font-weight:700;
  color:var(--text);
  margin-bottom:10px;
  display:flex;
  align-items:center;
  gap:8px;
}
.side-title i{font-size:14px;color:var(--muted);}
.source-row{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;color:var(--text-soft);
  padding:7px 0;
}
.source-row + .source-row{border-top:1px solid var(--line-soft);}
html.dark .source-row + .source-row{border-top-color:#3c4043;}
.source-row span{display:flex;align-items:center;gap:9px;}
.source-row i{font-size:13px;color:var(--muted);}
.source-row b{color:var(--text);font-weight:600;font-size:13px;}

.related-list{display:flex;flex-direction:column;gap:2px;margin:0 -8px;}
.related-item{
  display:flex;align-items:center;gap:10px;
  padding:8px 10px;border-radius:6px;
  font-size:13.5px;color:var(--text);
  cursor:pointer;
  transition:background .12s var(--g-ease);
}
.related-item:hover{background:var(--chip-bg);}
.related-item i{font-size:12px;color:var(--muted);flex-shrink:0;}

/* ============================================================
   骨架屏
   ============================================================ */
.g-skeleton{
  max-width:600px;margin-bottom:29px;
  animation:gFadeIn .2s var(--g-ease-out) both;
}
.sk-site{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.sk-fav{
  width:26px;height:26px;border-radius:50%;
  background:var(--line);flex-shrink:0;
  animation:skPulse 1.4s var(--g-ease) infinite;
}
.sk-lines{flex:1;display:flex;flex-direction:column;gap:6px;}
.sk-line{
  height:12px;border-radius:6px;background:var(--line);
  animation:skPulse 1.4s var(--g-ease) infinite;
}
.sk-w30{width:30%;}
.sk-w50{width:50%;}
.sk-w75{width:75%;}
.sk-w90{width:90%;}
.sk-title{height:18px;width:70%;margin-bottom:11px;border-radius:8px;}
@keyframes skPulse{
  0%,100%{opacity:.55;}
  50%{opacity:1;}
}

/* ============================================================
   空 / 分页 / 更多
   ============================================================ */
.g-empty{padding:40px 0 20px;max-width:600px;animation:gFadeIn .22s var(--g-ease-out) both;}
.g-empty h3{font-size:18px;font-weight:400;color:var(--text);margin:0 0 12px;}
.g-empty p{font-size:14px;color:var(--muted);line-height:1.7;margin:0;}

.pagination{
  display:flex;align-items:center;justify-content:center;gap:6px;
  margin:40px auto 20px;max-width:600px;flex-wrap:wrap;
  padding:16px 0;border-top:1px solid var(--line-soft);
}
html.dark .pagination{border-top-color:#3c4043;}
.page-btn{
  min-width:36px;height:36px;padding:0 12px;border:1px solid var(--line);
  border-radius:18px;background:var(--bg);color:var(--text-soft);
  font-size:13px;cursor:pointer;display:inline-flex;align-items:center;
  justify-content:center;gap:5px;font-family:inherit;user-select:none;
  transition:border-color .15s var(--g-ease),color .15s var(--g-ease),background .15s var(--g-ease);
}
.page-btn i{font-size:13px;}
.page-btn:hover:not(:disabled):not(.current){
  border-color:var(--blue);color:var(--blue);background:rgba(66,133,244,.05);
}
.page-btn.current{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700;cursor:default;}
.page-btn:disabled{opacity:.38;cursor:not-allowed;}
.page-ellipsis{min-width:24px;text-align:center;color:var(--muted);font-size:13px;user-select:none;padding:0 4px;}

.g-more{margin-top:24px;max-width:600px;padding:20px 0 40px;border-top:1px solid var(--line-soft);}
html.dark .g-more{border-top-color:#3c4043;}
.g-more-title{font-size:14px;color:var(--muted);margin-bottom:14px;}
.g-more-links{display:flex;flex-wrap:wrap;gap:8px;}
.g-more-links a{
  padding:8px 14px;border:1px solid var(--line);border-radius:18px;
  font-size:13px;color:var(--text-soft);
  transition:border-color .15s var(--g-ease),color .15s var(--g-ease),background .15s var(--g-ease);
  display:inline-flex;align-items:center;gap:7px;
}
.g-more-links a i{
  font-size:13px;
  line-height:1;
  display:inline-block;
  vertical-align:middle;
}

function matchKB(c){ let best=null,bestScore=0; for(let i=0;i<KB.length;i++){ const item=KB[i]; let s=0; for(let j=0;j<item.keys.length;j++){ const k=norm(item.keys[j]); if(k&&c.indexOf(k)!==-1) s+=k.length; } if(s>bestScore){ bestScore=s; best=item; } } return { item:best, score:bestScore }; }

function tryMath(raw){
  let s=String(raw).replace(/\s/g,'').replace(/[×✕✖]/g,'*').replace(/[÷]/g,'/').replace(/（/g,'(').replace(/）/g,')').replace(/[，。？！、,.?!]/g,'');
  s=s.replace(/(等于多少|等于几|等于|是多少|是几|计算|算一下|帮我算|请问|求)/g,'');
  if(!s) return null;
  let m=s.match(/^(\d+(?:\.\d+)?)(?:的)?(平方|立方|二次方|三次方)$/);
  if(m){ const n=parseFloat(m[1]); const p=(m[2]==='平方'||m[2]==='二次方')?2:3; return {expr:`${m[1]}${m[2]}`,val:Math.pow(n,p)}; }

  if(m) return {expr:`√${m[1]}`,val:Math.sqrt(parseFloat(m[1]))};
  m=s.match(/^(\d+(?:\.\d+)?)%(?:的)?(\d+(?:\.\d+)?)$/);
  if(m) return {expr:`${m[1]}% × ${m[2]}`,val:parseFloat(m[1])/100*parseFloat(m[2])};
  m=s.match(/^(\d+(?:\.\d+)?)的(\d+(?:\.\d+)?)%$/);
  if(m) return {expr:`${m[1]} × ${m[2]}%`,val:parseFloat(m[1])*parseFloat(m[2])/100};
  if(/^[\d+\-*/().%]+$/.test(s)&&/[+\-*/%]/.test(s)){ try{ const v=Function('"use strict";return('+s+')')(); if(typeof v==='number'&&isFinite(v)) return {expr:s,val:v}; }catch(e){} }
  return null;
}

function zhWeather(desc){ if(!desc) return '未知'; const s=String(desc).trim(); if(WEATHER_ZH[s]) return WEATHER_ZH[s]; const low=s.toLowerCase(); if(low.includes('thunder')) return '雷阵雨'; if(low.includes('heavy rain')) return '大雨'; if(low.includes('moderate rain')) return '中雨'; if(low.includes('light rain')) return '小雨'; if(low.includes('rain')) return '有雨'; if(low.includes('heavy snow')) return '大雪'; if(low.includes('light snow')) return '小雪'; if(low.includes('snow')) return '有雪'; if(low.includes('sleet')) return '雨夹雪'; if(low.includes('drizzle')) return '毛毛雨'; if(low.includes('fog')) return '雾'; if(low.includes('haze')) return '霾'; if(low.includes('overcast')) return '阴'; if(low.includes('cloud')) return '多云'; if(low.includes('sun')||low.includes('clear')) return '晴'; return s; }
function weatherEmoji(desc){ const s=String(desc||''); if(/雷/.test(s)) return '⛈️'; if(/暴雨|大雨/.test(s)) return '🌧️'; if(/中雨|小雨|雨|毛毛/.test(s)) return '🌦️'; if(/雪|冰粒/.test(s)) return '❄️'; if(/雾|霾|烟/.test(s)) return '🌫️'; if(/阴/.test(s)) return '☁️'; if(/多云|局部/.test(s)) return '⛅'; if(/晴|明朗/.test(s)) return '☀️'; return '🌤️'; }
function extractCity(q){ let s=String(q).replace(/\s/g,''); s=s.replace(/^(今天|明天|现在|请问|查一下|查询|帮我查)/,''); let m=s.match(/^([\u4e00-\u9fa5]{2,10}?)(?:的)?(?:天气|气温|温度|下雨|冷不冷|热不热)/); if(m) return m[1].replace(/(今天|明天|现在|的|天气)$/g,'').trim()||null; m=s.match(/(?:天气|气温|温度)(?:在|是|如何|怎么样)?([\u4e00-\u9fa5]{2,10})/); if(m) return m[1].replace(/(今天|明天|现在|的|怎么样|如何)$/g,'').trim()||null; return null; }

/* ===== 打分排序 ===== */
const SOURCE_WEIGHT = { kb:8, tavily:6, ddg:5, baidu:5, sogou:4, '360':4, wiki:4, news:4, hn:3, github:3, openalex:2, crossref:2 };
function scoreResult(r, query){
  const q = norm(query); const title = norm(r.title || ''); const sn = norm(r.snippet || '');
  let score = 1;
  if(q && title.includes(q)) score += 20;
  if(q && sn.includes(q)) score += 5;
  const tokens = q.match(/[\u4e00-\u9fa5]{2,}|[a-z]{3,}/gi) || [];
  tokens.forEach(t => { const tt = norm(t); if(title.includes(tt)) score += 6; if(sn.includes(tt)) score += 2; });
  score += (SOURCE_WEIGHT[r.source] || 0);
  if(r.snippet && r.snippet.length > 40) score += 2;
  if(r.url) score += 1;
  return score;
}

/* ===== 检索主流程 ===== */
async function runSearch(query){
  const t0 = performance.now(); const c = norm(query); const cards = []; const collected = [];

  if(/(几点了|现在几点|现在时间|当前时间)/.test(c)) cards.push({ type:'note', label:'当前时间', icon:'la-clock', text: timeText() });
  if(/(今天几号|今天日期|几月几号|什么日期)/.test(c)) cards.push({ type:'note', label:'今天日期', icon:'la-calendar', text: dateText() });
  if(/(星期几|周几)/.test(c)) cards.push({ type:'note', label:'星期', icon:'la-calendar-day', text: '今天是 ' + WEEK[new Date().getDay()] + '。' });

  const math = tryMath(query);
  if(math) cards.push({ type:'calc', label:'计算结果', icon:'la-calculator', expr: math.expr, val: fmt(math.val) });

  const kb = matchKB(c); const hasKB = !!(kb.item && kb.score >= 2);
  if(hasKB){
    cards.push({ type:'note', label:'康荣速览', icon:'la-lightbulb', title: kb.item.title, text: kb.item.desc });
    collected.push({ title: kb.item.title, url: null, snippet: kb.item.desc, site: '康荣知识库', source: 'kb' });
  }

  const isWx = /(天气|气温|温度|下雨|冷不冷|热不热|刮风|阴晴)/.test(c);
  const city = isWx ? (extractCity(query) || '北京') : null;
  const hasChinese = /[\u4e00-\u9fa5]/.test(query);

  const settled = await Promise.allSettled([
    ddgSearch(query),
    tavilySearch(query),
    baiduBaikeSearch(query),
    sogouBaikeSearch(query),
    q360BaikeSearch(query),
    wikiSearch(query, 'zh', 25),
    hasChinese ? wikiSearch(query, 'en', 15) : Promise.resolve([]),
    fetchNewsRSS(),
    hnSearch(query, 30),
    openAlexSearch(query, 30),
    crossrefSearch(query, 20),
    githubSearch(query, 20),
    city ? fetchWeather(city) : Promise.resolve(null)
  ]);

  const ddg = settled[0].status==='fulfilled'?settled[0].value:{answer:null,related:[]};
  const tav = settled[1].status==='fulfilled'?settled[1].value:{answer:null,results:[]};
  const baidu = settled[2].status==='fulfilled'?settled[2].value:[];
  const sogou = settled[3].status==='fulfilled'?settled[3].value:[];
  const q360 = settled[4].status==='fulfilled'?settled[4].value:[];
  const wikiZh = settled[5].status==='fulfilled'?settled[5].value:[];
  const wikiEn = settled[6].status==='fulfilled'?settled[6].value:[];
  const news = settled[7].status==='fulfilled'?settled[7].value:[];
  const hnRes = settled[8].status==='fulfilled'?settled[8].value:[];
  const oaRes = settled[9].status==='fulfilled'?settled[9].value:[];
  const crRes = settled[10].status==='fulfilled'?settled[10].value:[];
  const ghRes = settled[11].status==='fulfilled'?settled[11].value:[];
  const wx = settled[12].status==='fulfilled'?settled[12].value:null;

  if(wx) cards.push({ type:'weather', label:'实时天气 · wttr.in', icon:'la-cloud-sun', data: wx });

  if(ddg){
    const ans = ddg.answer || ddg.abstract;
    if(ans) cards.push({ type:'note', label: ddg.answer?'即时答案 · DuckDuckGo':('速览 · '+(ddg.heading||'DuckDuckGo')), icon:'la-bolt', text: ans, url: ddg.abstractUrl });
    ddg.related.slice(0,10).forEach(r => { if(!r.url) return; collected.push({ title: trim(String(r.text||'').split(' - ')[0].trim(),90)||domainOf(r.url)||r.url, url: r.url, snippet: r.text, site: domainOf(r.url)||'DuckDuckGo', source:'ddg' }); });
  }

  if(tav){
    const hasAnswerCard = cards.some(x => x.label && x.label.indexOf('答案') !== -1);
    if(tav.answer && !hasAnswerCard) cards.push({ type:'note', label:'联网摘要 · Tavily', icon:'la-bolt', text: tav.answer });
    tav.results.forEach(r => { if(!r.url||!r.content) return; collected.push({ title: r.title||domainOf(r.url)||r.url, url: r.url, snippet: r.content, site: domainOf(r.url)||'网页', source:'tavily' }); });
  }

  [...baidu, ...sogou, ...q360, ...wikiZh, ...wikiEn, ...news, ...hnRes, ...oaRes, ...crRes, ...ghRes].forEach(r => collected.push(r));

  const seen = new Set(); const deduped = [];
  collected.forEach(r => {
    const key = normalizeUrl(r.url);
    if(key && seen.has(key)) return;
    if(key) seen.add(key);
    r.score = scoreResult(r, query);
    deduped.push(r);
  });
  deduped.sort((a,b) => b.score - a.score);

  const elapsed = ((performance.now()-t0)/1000).toFixed(2);
  return { cards, all: deduped, query, elapsed, kbHit: hasKB };
}

function makeFavicon(url, site){
  const d = document.createElement('div'); d.className='g-fav';
  const letter = String(site||'网').trim().charAt(0).toUpperCase()||'网';
  d.textContent = letter; d.style.background = colorFrom(site||url||'x');
  if(url){ const dom = domainOf(url); if(dom){ const img = document.createElement('img'); img.alt=''; img.src='https://icons.duckduckgo.com/ip3/'+dom+'.ico'; img.onload=()=>{ d.textContent=''; d.style.background='transparent'; d.appendChild(img); }; img.onerror=()=>{}; } }
  return d;
}

const SOURCE_TAG = { kb:'康荣', tavily:'Tavily', ddg:'DDG', baidu:'百度百科', sogou:'搜狗百科', '360':'360百科', wiki:'维基', news:'新闻', hn:'HN', github:'GitHub', openalex:'OpenAlex', crossref:'Crossref' };

function renderResult(r){
  const el = document.createElement('div'); el.className='g-result';
  const site = document.createElement('div'); site.className='g-site';
  site.appendChild(makeFavicon(r.url, r.site));
  const info = document.createElement('div'); info.className='g-site-info';
  const nameEl = document.createElement('div'); nameEl.className='g-site-name';
  const nameTxt = document.createElement('span'); nameTxt.textContent = r.site||'网页'; nameEl.appendChild(nameTxt);
  const tagTxt = SOURCE_TAG[r.source];
  if(tagTxt){ const tag = document.createElement('span'); tag.className='g-source-tag'; tag.textContent = tagTxt; nameEl.appendChild(tag); }
  const urlEl = document.createElement('div'); urlEl.className='g-site-url'; urlEl.textContent = prettyUrl(r.url);
  info.appendChild(nameEl); info.appendChild(urlEl); site.appendChild(info); el.appendChild(site);
  const a = document.createElement('a'); a.className='g-title'; a.textContent = trim(r.title||prettyUrl(r.url)||'未命名结果',120);
  if(r.url){ a.href=r.url; a.target='_blank'; a.rel='noopener noreferrer'; }
  el.appendChild(a);
  if(r.snippet){ const sn = document.createElement('div'); sn.className='g-snippet'; sn.textContent = trim(r.snippet,320); el.appendChild(sn); }
  return el;
}

function renderCard(c){
  const el = document.createElement('div'); el.className='g-card';
  const k = document.createElement('div'); k.className='g-card-label';
  if(c.icon){ const ic = document.createElement('i'); ic.className='las '+c.icon; k.appendChild(ic); }
  k.appendChild(document.createTextNode(c.label||'速览')); el.appendChild(k);
  if(c.type==='calc'){ const v = document.createElement('div'); v.className='g-calc'; v.innerHTML = '<small>'+escapeHtml(c.expr)+' =</small> '+escapeHtml(c.val); el.appendChild(v); }
  else if(c.type==='note'){
    if(c.title){ const h = document.createElement('div'); h.className='g-card-title'; h.textContent=c.title; el.appendChild(h); }
    const b = document.createElement('div'); b.className='g-card-body'; b.textContent=c.text; el.appendChild(b);
    if(c.url){ const a = document.createElement('a'); a.className='g-card-link'; a.href=c.url; a.target='_blank'; a.rel='noopener noreferrer'; a.innerHTML='访问来源 <i class="las la-external-link-alt"></i>'; el.appendChild(a); }
  }else if(c.type==='weather'){ el.appendChild(renderWeather(c.data)); }
  return el;
}

function renderWeather(w){
  const box = document.createElement('div');
  const top = document.createElement('div'); top.className='wx-top';
  const emoji = document.createElement('div'); emoji.className='wx-emoji'; emoji.textContent = weatherEmoji(w.desc);
  const info = document.createElement('div');
  const place = document.createElement('div'); place.className='wx-place'; place.textContent = w.place;
  const desc = document.createElement('div'); desc.className='wx-desc'; desc.textContent = w.desc;
  info.appendChild(place); info.appendChild(desc);
  const temp = document.createElement('div'); temp.className='wx-temp'; temp.textContent = w.temp+'°';
  top.appendChild(emoji); top.appendChild(info); top.appendChild(temp); box.appendChild(top);
  const meta = document.createElement('div'); meta.className='wx-meta';
  ['体感 '+w.feels+'°C','湿度 '+w.humidity+'%','风速 '+w.wind+' km/h'].forEach(t => { const sp = document.createElement('span'); sp.textContent = t; meta.appendChild(sp); });
  box.appendChild(meta);
  if(w.forecast && w.forecast.length){
    const days = document.createElement('div'); days.className='wx-days';
    w.forecast.forEach(f => {
      const d = document.createElement('div'); d.className='wx-day';
      const dl = document.createElement('div'); dl.className='d'; dl.textContent = f.label;
      const e = document.createElement('div'); e.className='e'; e.textContent = weatherEmoji(f.desc);
      const t = document.createElement('div'); t.className='t'; t.textContent = f.min+'° / '+f.max+'°';
      d.appendChild(dl); d.appendChild(e); d.appendChild(t); days.appendChild(d);
    });
    box.appendChild(days);
  }
  return box;
}

  const el = document.createElement('div'); el.className='g-empty';
  const h = document.createElement('h3'); h.textContent = '找不到与「'+trim(query,40)+'」相关的结果';

  el.appendChild(h); el.appendChild(p); return el;
}

function renderSourceStats(){
  const groups = [
    { label:'网页', icon:'la-globe', test: r => r.source==='tavily'||r.source==='ddg'||r.source==='kb' },
    { label:'百科', icon:'la-book', test: r => r.source==='wiki'||r.source==='baidu'||r.source==='sogou'||r.source==='360' },
    { label:'新闻', icon:'la-newspaper', test: r => r.source==='news' },
    { label:'技术', icon:'la-code', test: r => r.source==='hn'||r.source==='github' },
    { label:'学术', icon:'la-graduation-cap', test: r => r.source==='openalex'||r.source==='crossref' }
  ];
  const rows = [];
  groups.forEach(g => {
    const n = state.all.filter(g.test).length;
    if(n > 0) rows.push({ label: g.label, icon: g.icon, n });
  });
  if(!rows.length) return null;

  const box = document.createElement('div');
  box.className = 'side-card';
  const title = document.createElement('div');
  title.className = 'side-title';
  title.innerHTML = '<i class="las la-chart-pie"></i>结果来源';
  box.appendChild(title);

  rows.forEach(r => {
    const row = document.createElement('div');
    row.className = 'source-row';
    const left = document.createElement('span');
    left.innerHTML = '<i class="las ' + r.icon + '"></i>' + r.label;
    const right = document.createElement('b');
    right.textContent = r.n;
    row.appendChild(left);
    row.appendChild(right);
    box.appendChild(row);
  });
  return box;
}

function renderRelatedSearches(query){
  const q = String(query || '').trim();
  if(!q) return null;
  const suffixes = ['是什么', '百科', '新闻', '官网', '教程'];
  const list = suffixes.map(s => q + ' ' + s);

  const box = document.createElement('div');
  box.className = 'side-card';
  const title = document.createElement('div');
  title.className = 'side-title';
  title.innerHTML = '<i class="las la-search"></i>相关搜索';
  box.appendChild(title);

  const wrap = document.createElement('div');
  wrap.className = 'related-list';
  list.forEach(t => {
    const item = document.createElement('div');
    item.className = 'related-item';
    const ic = document.createElement('i');
    ic.className = 'las la-search';
    const span = document.createElement('span');
    span.textContent = t;
    item.appendChild(ic);
    item.appendChild(span);
    item.addEventListener('click', () => performSearch(t));
    wrap.appendChild(item);
  });

  return box;
}

/* ============================================================
   分页
   ============================================================ */
function computePages(current, total){
  const pages = [];
  if(total <= 7){ for(let i=1;i<=total;i++) pages.push(i); return pages; }
  if(current <= 4){ for(let i=1;i<=5;i++) pages.push(i); pages.push('...'); pages.push(total); }
  else if(current >= total-3){ pages.push(1); pages.push('...'); for(let i=total-4;i<=total;i++) pages.push(i); }
  else{ pages.push(1); pages.push('...'); for(let i=current-1;i<=current+1;i++) pages.push(i); pages.push('...'); pages.push(total); }
  return pages;
}

function renderPagination(totalPages){
  if(totalPages <= 1) return null;
  const currentPage = state.page;
  const box = document.createElement('div'); box.className='pagination';

  const prev = document.createElement('button'); prev.className='page-btn'; prev.type='button';
  prev.innerHTML = '<i class="las la-angle-left"></i><span>上一页</span>';
  prev.disabled = currentPage === 1;
  prev.addEventListener('click', () => { if(currentPage>1) goToPage(currentPage-1); });
  box.appendChild(prev);

  computePages(currentPage, totalPages).forEach(p => {
    if(p === '...'){ const sp = document.createElement('span'); sp.className='page-ellipsis'; sp.textContent='…'; box.appendChild(sp); }
    else{ const b = document.createElement('button'); b.className='page-btn'+(p===currentPage?' current':''); b.type='button'; b.textContent=p; if(p!==currentPage) b.addEventListener('click',()=>goToPage(p)); box.appendChild(b); }
  });

  const next = document.createElement('button'); next.className='page-btn'; next.type='button';
  next.innerHTML = '<span>下一页</span><i class="las la-angle-right"></i>';
  next.disabled = currentPage === totalPages;
  next.addEventListener('click', () => { if(currentPage<totalPages) goToPage(currentPage+1); });
  box.appendChild(next);

  return box;
}

function goToPage(page){
  state.page = page;
  renderCategory();
  const headerH = P.rHeader.offsetHeight + 8;
  const top = P.rMain.getBoundingClientRect().top + window.scrollY - headerH;
  window.scrollTo({ top, behavior: 'smooth' });
}

/* ============================================================
   渲染调度
   ============================================================ */
function updateTabs(){
  P.rTabs.querySelectorAll('.r-tab').forEach(tab => {
    const cat = tab.dataset.tab; const label = CAT_LABELS[cat]||cat; const n = countForCat(cat);
    tab.textContent = n>0 ? label+' ('+n+')' : label;
  });
}

function updateStat(){
  const list = getFiltered(state.cat); const total = list.length;
  if(total > 0){
    const start = (state.page-1)*state.pageSize + 1;
    const end = Math.min(state.page*state.pageSize, total);
    const rangeText = (start===end) ? ('第 '+start+' 条') : ('第 '+start+'–'+end+' 条');
    P.rStat.textContent = rangeText + '，共 ' + total + ' 条结果（用时 ' + state.elapsed + ' 秒）';
  }else{
    P.rStat.textContent = '找不到与「'+trim(state.query,30)+'」相关的结果';
  }
}

function renderAside(){
  P.rAside.innerHTML = '';

  if(state.cards.length){
    state.cards.forEach((c, idx) => {
      const el = renderCard(c);
      el.style.animationDelay = (idx * 30) + 'ms';
      P.rAside.appendChild(el);
    });
  }

  if(state.all.length){
    const stats = renderSourceStats();
    if(stats) P.rAside.appendChild(stats);
  }

  const related = renderRelatedSearches(state.query);
  if(related) P.rAside.appendChild(related);

  /* 切换结果后右栏滚动条回到顶部 */
  P.rAside.scrollTop = 0;
}

function renderCategory(){
  const list = getFiltered(state.cat);
  const totalPages = Math.max(1, Math.ceil(list.length / state.pageSize));
  if(state.page > totalPages) state.page = totalPages;
  if(state.page < 1) state.page = 1;

  const start = (state.page-1)*state.pageSize;
  const end = Math.min(start + state.pageSize, list.length);

  renderAside();

  P.rMain.innerHTML = '';

  if(list.length === 0){
    P.rMain.appendChild(renderEmpty(state.query));
    updateStat();
    if(state.cat === 'all') P.rMain.appendChild(renderMoreBlock(state.query));
    return;
  }

  for(let i=start;i<end;i++){
    const el = renderResult(list[i]);
    el.style.animationDelay = ((i - start) * 25) + 'ms';
    P.rMain.appendChild(el);
  }

  const pg = renderPagination(totalPages);
  if(pg) P.rMain.appendChild(pg);

  updateStat();

  if(state.cat === 'all') P.rMain.appendChild(renderMoreBlock(state.query));
}

function renderAll(data){
  state.query = data.query;
  state.cards = data.cards || [];
  state.all = data.all || [];
  state.elapsed = data.elapsed || '0';
  state.kbHit = !!data.kbHit;
  state.page = 1;
  state.cat = 'all';

  P.rTabs.querySelectorAll('.r-tab').forEach(t => t.classList.remove('active'));
  const allTab = P.rTabs.querySelector('[data-tab="all"]');
  if(allTab) allTab.classList.add('active');

  updateTabs();
  renderCategory();
}

/* ============================================================
   搜索历史
   ============================================================ */
const HISTORY_KEY = 'comra_history_v1';
function loadHistory(){ try{ const raw = localStorage.getItem(HISTORY_KEY); const arr = raw ? JSON.parse(raw) : []; return Array.isArray(arr) ? arr : []; }catch(e){ return []; } }
function saveHistory(list){ try{ localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0,12))); }catch(e){} }
function addHistory(q){ const list = loadHistory().filter(x => x !== q); list.unshift(q); saveHistory(list); }

/* ============================================================
   搜索动作
   ============================================================ */
async function performSearch(rawQuery){
  const query = String(rawQuery == null ? getActiveInput().value : rawQuery).trim();
  if(!query){ getActiveInput().focus(); return; }
  if(state.busy) return;

  state.busy = true; const token = ++state.token;
  addHistory(query); showResults(query);

  showProgress();
  P.rStat.textContent = '';
  renderSkeleton(4);

  try{
    const data = await runSearch(query);
    if(token !== state.token) return;
    renderAll(data);
    hideProgress();
    window.scrollTo({ top:0, behavior:'smooth' });
  }catch(e){
    if(token !== state.token) return;
    hideProgress();
    P.rMain.innerHTML = '';
    P.rAside.innerHTML = '';
    const err = document.createElement('div'); err.className='g-empty';
    err.innerHTML = '<h3>检索出错了</h3><p>请检查网络连接后重试，或换个关键词。</p>';
    P.rMain.appendChild(err); P.rMain.appendChild(renderMoreBlock(query));
  }finally{
    if(token === state.token) state.busy = false;
  }
}

async function luckySearch(){
  const q = P.qHome.value.trim();
  if(!q){ const item = KB[Math.floor(Math.random()*KB.length)]; P.qHome.value = item.title; P.clrHome.classList.add('on'); performSearch(item.title); return; }
  state.busy = true;
  try{
    const data = await runSearch(q);
    const first = data.all.find(l => l.url);
    if(first){ window.open(first.url, '_blank', 'noopener'); state.busy = false; return; }
  }catch(e){}
  state.busy = false; performSearch(q);
}

/* ============================================================
   搜索联想
   ============================================================ */
let sugItems = []; let sugIndex = -1;
function hideSuggest(el){ el.classList.remove('open'); el.innerHTML=''; sugItems=[]; sugIndex=-1; }
function showSuggest(v, el, input){
  const n = norm(v); if(!n){ hideSuggest(el); return; }
  const out = []; const seen = new Set();
  loadHistory().forEach(h => { if(norm(h).indexOf(n) !== -1 && !seen.has(h)){ seen.add(h); out.push({ t:h, type:'history' }); } });
  KB.forEach(item => { if(norm(item.title).indexOf(n) !== -1 && !seen.has(item.title)){ seen.add(item.title); out.push({ t:item.title, type:'kb' }); } });
  if(!out.length){ hideSuggest(el); return; }
  sugItems = out.slice(0,8).map(x => x.t); sugIndex = -1;
  el.innerHTML = '';
  out.slice(0,8).forEach(x => {
    const row = document.createElement('div'); row.className='sug';
    const ico = document.createElement('i'); ico.className = 'sug-ico las ' + (x.type==='history'?'la-history':'la-lightbulb');
    const txt = document.createElement('span'); txt.className='sug-t'; txt.textContent = x.t;
    row.appendChild(ico); row.appendChild(txt);
    row.addEventListener('mousedown', e => { e.preventDefault(); input.value = x.t; hideSuggest(el); onInput(input, input.parentNode.parentNode); performSearch(x.t); });
    el.appendChild(row);
  });
  el.classList.add('open');
}
function moveSug(dir, el){ const rows = el.querySelectorAll('.sug'); if(!rows.length) return; if(sugIndex>=0) rows[sugIndex].classList.remove('active'); sugIndex = (sugIndex + dir + rows.length) % rows.length; rows[sugIndex].classList.add('active'); }
function onInput(input, wrap){ const v = input.value.trim(); const clr = wrap.querySelector('.clr-btn'); if(clr) clr.classList.toggle('on', !!v); const sug = wrap.querySelector('.suggest'); if(v) showSuggest(v, sug, input); else hideSuggest(sug); }
function setupInput(input, wrap, suggestEl){
  input.addEventListener('input', () => onInput(input, wrap));
  input.addEventListener('keydown', e => {
    if(e.key === 'Enter'){ if(e.isComposing) return; e.preventDefault(); if(sugIndex>=0 && sugItems[sugIndex]){ input.value = sugItems[sugIndex]; hideSuggest(suggestEl); onInput(input, wrap); } performSearch(input.value); }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); moveSug(1, suggestEl); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); moveSug(-1, suggestEl); }
    else if(e.key === 'Escape'){ hideSuggest(suggestEl); }
  });
  input.addEventListener('blur', () => setTimeout(() => hideSuggest(suggestEl), 130));
}

function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  if(P.themeIconHome) P.themeIconHome.className = 'las ' + (dark?'la-sun':'la-moon');
  if(P.themeIconResults) P.themeIconResults.className = 'las ' + (dark?'la-sun':'la-moon');
  const meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute('content', dark?'#202124':'#ffffff');
  try{ localStorage.setItem('comra_theme', dark?'dark':'light'); }catch(e){}
