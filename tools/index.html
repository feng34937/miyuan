                else if (parentNode.children) parentNode.children.push(rootDirNode);
                else { alert('父节点不是文件夹'); return; }
                const folderMap = new Map();
                folderMap.set('', rootDirNode);
                for (const file of files) {
                    const pathParts = file.webkitRelativePath.split('/');
                    const fileName = pathParts.pop();
                    let currentFolder = rootDirNode;
                    let currentPath = '';
                    for (const folderName of pathParts) {
                        currentPath = currentPath ? `${currentPath}/${folderName}` : folderName;
                        if (!folderMap.has(currentPath)) { const newFolder = { id: generateId('fdir'),
                                name: folderName, type: 'folder', children: [] };
                            currentFolder.children.push(newFolder);
                            folderMap.set(currentPath, newFolder);
                            currentFolder = newFolder; } else currentFolder = folderMap.get(currentPath);
                    }
                    const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : 'txt';
                    const fileTypeMap = { html: 'html', js: 'js', css: 'css', py: 'py', png: 'img', jpg: 'img', jpeg: 'img',
                        gif: 'img', svg: 'img', txt: 'txt', md: 'txt', json: 'json', zip: 'zip', ttf: 'font', mp4: 'video',
                        mp3: 'audio' };
                    const fileType = fileTypeMap[ext] || 'txt';
                    const size = file.size > 1024 * 1024 ? (file.size / (1024 * 1024)).toFixed(1) + ' MB' : (file.size /
                        1024).toFixed(1) + ' KB';
                    currentFolder.children.push({ id: generateId('f'), name: fileName, type: 'file', fileType, size,
                        children: [] });
                }
                if (!state.expandedNodes.has(rootDirId)) state.expandedNodes.add(rootDirId);
                saveData();
                renderTree();
            }

            function setupDragAndDrop() {
                const container = treeContainer;
                container.addEventListener('dragenter', (e) => { e.preventDefault();
                    container.classList.add('drag-over'); });
                container.addEventListener('dragover', (e) => { e.preventDefault(); });
                container.addEventListener('dragleave', (e) => { if (e.target === container) container.classList.remove(
                        'drag-over'); });
                container.addEventListener('drop', async (e) => {
                    e.preventDefault();
                    container.classList.remove('drag-over');
                    const items = e.dataTransfer.items;
                    if (!items || items.length === 0) return;
                    let targetParentId = state.currentFolderId;
                    if (state.selectedNodeIds.size === 1) {
                        const selectedId = Array.from(state.selectedNodeIds)[0];
                        const selectedNode = getNodeById(getCurrentData(), selectedId);
                        if (selectedNode && (selectedNode.type === 'folder' || selectedNode.type === 'chapter' || selectedNode
                                .type === 'section')) targetParentId = selectedId;
                    }
                    for (const item of items) {
                        if (item.kind === 'file') {
                            const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
                            if (entry) await processEntry(entry, targetParentId);
                        }
                    }
                    saveData();
                    renderTree();
                });
            }
            async function processEntry(entry, parentId) {
                if (entry.isFile) {
                    const file = await new Promise((resolve, reject) => entry.file(resolve, reject));
                    const fileName = file.name;
                    const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : 'txt';
                    const fileTypeMap = { html: 'html', js: 'js', css: 'css', py: 'py', png: 'img', jpg: 'img', jpeg: 'img',
                        gif: 'img', svg: 'img', ico: 'img', txt: 'txt', md: 'txt', json: 'json', zip: 'zip', rar: 'zip',
                        ttf: 'font', woff: 'font', woff2: 'font', mp4: 'video', mov: 'video', mp3: 'audio', wav: 'audio' };
                    const fileType = fileTypeMap[ext] || 'txt';
                    const size = file.size > 1024 * 1024 ? (file.size / (1024 * 1024)).toFixed(1) + ' MB' : (file.size /
                        1024).toFixed(1) + ' KB';
                    addNode(parentId, { id: generateId('f'), name: fileName, type: 'file', fileType, size,
                        children: [] });
                } else if (entry.isDirectory) {
                    const dirName = entry.name;
                    const dirId = generateId('fdir');
                    const dirNode = { id: dirId, name: dirName, type: 'folder', children: [] };
                    addNode(parentId, dirNode);
                    const reader = entry.createReader();
                    const readEntries = () => new Promise((resolve, reject) => {
                        reader.readEntries(async (entries) => { if (entries.length === 0) resolve();
                            else { for (const childEntry of entries) await processEntry(childEntry, dirId);
                                resolve(); } }, reject);
                    });
                    await readEntries();
                }
            }

            function openRenameModal(nodeId) {
                const data = getCurrentData();
                const node = getNodeById(data, nodeId);
                if (!node || nodeId === 'root') return;
                modalTitle.innerHTML = `<i class="las la-pen"></i> 重命名`;
                modalInput.value = node.title || node.name || '';
                modalInput.placeholder = '输入新名称...';
                state.modalAction = 'rename';
                state.modalTargetId = nodeId;
                state.modalParentId = null;
                modalOverlay.classList.add('active');
                modalInput.focus();
                modalInput.select();
            }

            function performRename() {
                const newName = modalInput.value.trim();
                if (!newName) { alert('名称不能为空'); return; }
                const data = getCurrentData();
                const node = getNodeById(data, state.modalTargetId);
                if (!node) { closeModal(); return; }
                if (node.title !== undefined) node.title = newName;
                if (node.name !== undefined) node.name = newName;
                saveData();
                closeModal();
                renderTree();
            }

            function openModal(title, placeholder, action, parentId) {
                modalTitle.innerHTML = `<i class="las la-plus-circle"></i> ${title}`;
                modalInput.value = '';
                modalInput.placeholder = placeholder;
                state.modalAction = action;
                state.modalParentId = parentId;
                state.modalTargetId = null;
                modalOverlay.classList.add('active');
                modalInput.focus();
            }

            function closeModal() {
                modalOverlay.classList.remove('active');
                state.modalAction = null;
                state.modalParentId = null;
                state.modalTargetId = null;
            }

            function confirmModal() {
                const name = modalInput.value.trim();
                if (!name) { alert('名称不能为空'); return; }
                if (state.modalAction === 'rename') { performRename(); return; }
                const parentId = state.modalParentId;
                const action = state.modalAction;
                if (action === 'new-file') {
                    const ext = name.includes('.') ? name.split('.').pop().toLowerCase() : 'txt';
                    const fileTypeMap = { html: 'html', js: 'js', css: 'css', py: 'py', txt: 'txt', json: 'json', zip: 'zip',
                        png: 'img', jpg: 'img', svg: 'img' };
                    const fileType = fileTypeMap[ext] || 'txt';
                    addNode(parentId, { id: generateId('f'), name, type: 'file', fileType, size: '0 KB',
                        children: [] });
                } else if (action === 'new-folder') {
                    addNode(parentId, { id: generateId('fdir'), name, type: 'folder', children: [] });
                } else if (action === 'new-chapter') {
                    addNode(parentId, { id: generateId('ch'), title: name, type: 'section', children: [] });
                }
                closeModal();
            }

            function handleDoubleClick(nodeId) {
                if (state.searchQuery) return;
                const data = getCurrentData();
                const node = getNodeById(data, nodeId);
                if (node && (node.type === 'folder' || node.type === 'chapter' || node.type === 'section')) {
                    state.currentFolderId = nodeId;
                    state.selectedNodeIds.clear();
                    renderTree();
                }
            }

            function initEventListeners() {
                btnDarkMode.addEventListener('click', () => { const mode = getThemeMode();
                    const nextMode = mode === 'auto' ? 'light' : (mode === 'light' ? 'dark' : 'auto');
                    setThemeMode(nextMode); });
                $$('.tab').forEach(tab => { tab.addEventListener('click', () => { const tabName = tab.dataset.tab; if (
                            state.currentTab === tabName) return;
                        state.currentTab = tabName;
                        state.currentFolderId = 'root';
                        state.selectedNodeIds.clear();
                        state.lastSelectedId = null;
                        state.expandedNodes.clear();
                        state.expandedNodes.add('root');
                        state.searchQuery = '';
                        searchInput.value = '';
                        $$('.tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        renderTree(); }); });
                searchInput.addEventListener('input', e => handleSearch(e.target.value));
                searchInput.addEventListener('keydown', e => { if (e.key === 'Escape') { searchInput.value = '';
                        handleSearch(''); if (state.mobileSearchActive) setMobileSearchActive(false); } if (e
                        .key === 'Enter') { const sr = getSearchResults(getCurrentData(), state.searchQuery); if (
                            sr.matchedIds.size > 0) selectNode(Array.from(sr.matchedIds)[0]); } });
                clearSearchBtn.addEventListener('click', () => { if (state.mobileSearchActive && !searchInput.value
                        .trim()) { setMobileSearchActive(false);
                        searchInput.blur(); } else { searchInput.value = '';
                        handleSearch(''); if (state.mobileSearchActive) searchInput.focus(); } });
                mobileSearchBtn.addEventListener('click', () => setMobileSearchActive(true));
                searchExitBtn.addEventListener('click', () => { setMobileSearchActive(false);
                    searchInput.blur(); });
                document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'f') { e
                        .preventDefault(); if (window.innerWidth <= 768) setMobileSearchActive(true);
                        else searchInput.focus();
                        searchInput.select(); } });
                treeContainer.addEventListener('click', e => {
                    const moreBtn = e.target.closest('.more-btn');
                    if (moreBtn) { e.stopPropagation();
                        e.preventDefault();
                        const actionsContainer = moreBtn.closest('.node-actions'); if (actionsContainer)
                            actionsContainer.classList.toggle('more-open'); return; }
                    const checkbox = e.target.closest('.node-checkbox');
                    if (checkbox) { e.stopPropagation();
                        toggleCheckboxSelection(checkbox.dataset.id, checkbox.checked); return; }
                    const actionBtn = e.target.closest('[data-action]');
                    if (actionBtn) { e.stopPropagation();
                        e.preventDefault();
                        const action = actionBtn.dataset.action;
                        const parentId = actionBtn.dataset.parentId || actionBtn.dataset.nodeId || state.currentFolderId;
                        const nodeId = actionBtn.dataset.nodeId;
                        if (action === 'new-file') openModal('新建文件', '输入文件名称...', 'new-file', parentId);
                        else if (action === 'new-folder') openModal('新建目录', '输入目录名称...', 'new-folder',
                            parentId);
                        else if (action === 'new-chapter') openModal('新建子节点', '输入名称...', 'new-chapter',
                            parentId);
                        else if (action === 'upload-file') triggerFileUpload(parentId);
                        else if (action === 'upload-dir') triggerDirUpload(parentId);
                        else if (action === 'rename') openRenameModal(nodeId);
                        else if (action === 'copy-path') copyNodePath(nodeId);
                        else if (action === 'toggle-hidden') toggleHiddenNode(nodeId);
                        else if (action === 'delete') { if (nodeId && nodeId !== 'root') { if (state
                                    .selectedNodeIds.has(nodeId) && state.selectedNodeIds.size > 1)
                                    batchDeleteSelected();
                                else if (confirm('确定要删除该节点及其所有子节点吗？')) deleteNode(nodeId); } }
                        return; }
                    const row = e.target.closest('.node-row');
                    if (row) { const nodeId = row.dataset.id; if (nodeId) selectNode(nodeId, { ctrlKey: e.ctrlKey ||
                                e.metaKey, shiftKey: e.shiftKey }); }
                });
                treeContainer.addEventListener('dblclick', e => {
                    const row = e.target.closest('.node-row');
                    if (row) { const nodeId = row.dataset.id; if (nodeId) handleDoubleClick(nodeId); }
                });
                breadcrumbContent.addEventListener('click', e => {
                    const crumb = e.target.closest('.crumb');
                    if (crumb && crumb.dataset.crumbId) { const id = crumb.dataset.crumbId; if (id !== state
                            .currentFolderId) { state.currentFolderId = id;
                            state.selectedNodeIds.clear();
                            renderTree(); } }
                });
                btnUp.addEventListener('click', () => { if (state.searchQuery) { searchInput.value = '';
                        handleSearch(''); return; } if (state.currentFolderId !== 'root') { const parentId =
                            getParentId(getCurrentData(), state.currentFolderId);
                        state.currentFolderId = parentId || 'root';
                        state.selectedNodeIds.clear();
                        renderTree(); } });
                $('#btnRefresh').addEventListener('click', () => renderTree());
                $('#btnToggleDetail').addEventListener('click', () => { state.detailPanelVisible = !state
                        .detailPanelVisible;
                    detailPanel.classList.toggle('collapsed', !state.detailPanelVisible); if (state
                        .detailPanelVisible) updateDetailPanel(); });
                $('#btnSortAsc').addEventListener('click', () => { state.sortDirection = state.sortDirection ===
                        'asc' ? null : 'asc';
                    applySort(); });
                $('#btnSortDesc').addEventListener('click', () => { state.sortDirection = state.sortDirection ===
                        'desc' ? null : 'desc';
                    applySort(); });
                btnDeleteSelected.addEventListener('click', () => { if (state.selectedNodeIds.size === 0) { alert(
                            '请先选择要删除的文件或文件夹'); return; }
                    batchDeleteSelected(); });
                btnCopy.addEventListener('click', () => copySelected('copy'));
                btnCut.addEventListener('click', () => copySelected('cut'));
                btnPaste.addEventListener('click', pasteClipboard);
                btnNewFile.addEventListener('click', () => openModal('新建文件', '输入文件名称...', 'new-file',
                    state.currentFolderId));
                btnNewFolder.addEventListener('click', () => openModal('新建文件夹', '输入文件夹名称...', 'new-folder',
                    state.currentFolderId));
                btnCreateShortcut.addEventListener('click', openShortcutModal);
                btnToggleHidden.addEventListener('click', toggleShowHidden);
                shortcutCancel.addEventListener('click', () => { shortcutModalOverlay.classList.remove('active');
                    state.shortcutSourceId = null; });
                shortcutConfirm.addEventListener('click', confirmShortcutCreation);
                shortcutModalOverlay.addEventListener('click', e => { if (e.target === shortcutModalOverlay) {
                        shortcutModalOverlay.classList.remove('active');
                        state.shortcutSourceId = null; } });
                $('#panelCloseBtn').addEventListener('click', () => { state.detailPanelVisible = false;
                    detailPanel.classList.add('collapsed'); });
                modalCancel.addEventListener('click', closeModal);
                modalConfirm.addEventListener('click', confirmModal);
                modalOverlay.addEventListener('click', e => { if (e.target === modalOverlay) closeModal(); });
                modalInput.addEventListener('keydown', e => { if (e.key === 'Enter') confirmModal(); if (e.key ===
                        'Escape') closeModal(); });
                fileInput.addEventListener('change', handleFileUpload);
                dirInput.addEventListener('change', handleDirUpload);
                setupDragAndDrop();
            }

            function init() {
                state.currentFolderId = 'root';
                state.expandedNodes.add('root');
                applyTheme();
                detailPanel.classList.add('collapsed');
                initEventListeners();
                renderTree();
                updateClipboardButtons();
            }
            init();
        })();
    </script>
</body>
</html>
