<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>米遇安索引 - 文件索引 & 书本目录</title>
    <!-- 网站标签页图标（png） -->
    <link rel="icon" href="https://feng34937.github.io/miyuan/MIYUAN_LOGO_NOBACKGROUND.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/line-awesome/1.3.0/line-awesome/css/line-awesome.min.css">
    <style>
        * {
            border-radius: 0 !important;
        }
        :root {
            --primary: rgba(26, 26, 46, 0.85);
            --accent: #4a90d9;
            --accent-light: rgba(74, 144, 217, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.62);
            --glass-border: rgba(255, 255, 255, 0.55);
            --glass-highlight: rgba(255, 255, 255, 0.35);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
            --glass-blur: blur(24px) saturate(180%);
            --bg: #f0f2f7;
            --card-bg: rgba(255, 255, 255, 0.65);
            --text: #2c3e50;
            --text-secondary: #6b7a8d;
            --text-light: #95a5a6;
            --border: rgba(255, 255, 255, 0.5);
            --danger: #e74c3c;
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.15);
            --font-sans: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
        }
        body.dark {
            --primary: rgba(15, 15, 30, 0.82);
            --accent: #4a90d9;
            --accent-light: rgba(74, 144, 217, 0.15);
            --glass-bg: rgba(30, 30, 46, 0.65);
            --glass-border: rgba(255, 255, 255, 0.12);
            --glass-highlight: rgba(255, 255, 255, 0.06);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            --glass-blur: blur(24px) saturate(160%);
            --bg: #12121a;
            --card-bg: rgba(30, 30, 46, 0.68);
            --text: #e0e0e8;
            --text-secondary: #a0a0b8;
            --text-light: #7a7a92;
            --border: rgba(255, 255, 255, 0.08);
            --danger: #e74c3c;
            --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-sans);
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            padding-bottom: 36px;
            transition: background 0.3s, color 0.3s;
            position: relative;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 20% 20%, rgba(74, 144, 217, 0.08), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(155, 89, 182, 0.06), transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.03), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        body.dark::before {
            background: radial-gradient(ellipse at 20% 20%, rgba(74, 144, 217, 0.1), transparent 50%),
                radial-gradient(ellipse at 80% 80%, rgba(155, 89, 182, 0.08), transparent 50%),
                radial-gradient(ellipse at 50% 50%, rgba(255, 255, 255, 0.02), transparent 70%);
        }
        .top-bar,
        .tabs-bar,
        .breadcrumb-bar,
        .toolbar,
        .detail-panel,
        .status-bar,
        .modal-box {
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: var(--glass-shadow);
            border-color: var(--glass-border);
        }
        .top-bar {
            background: var(--primary);
            color: #fff;
            padding: 0 24px;
            height: 60px;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--glass-border);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.15), inset 0 1px 0 var(--glass-highlight);
        }
        .top-bar .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 20px;
            font-weight: 700;
            white-space: nowrap;
        }
        .top-bar .logo .logo-icon {
            font-size: 26px;
            color: var(--accent);
        }
        .top-bar .logo span {
            background: linear-gradient(135deg, #fff 60%, #a8d8ea);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .top-bar .search-wrapper {
            flex: 1;
            max-width: 500px;
            position: relative;
            margin-left: auto;
        }
        .top-bar .search-wrapper .search-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 18px;
            pointer-events: none;
        }
        .top-bar .search-wrapper input {
            width: 100%;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0 40px;
            font-size: 14px;
            font-family: var(--font-sans);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(8px);
        }
        .top-bar .search-wrapper input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .top-bar .search-wrapper input:focus {
            background: rgba(255, 255, 255, 0.18);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(74, 144, 217, 0.25);
        }
        .top-bar .search-wrapper .clear-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #aaa;
            font-size: 18px;
            cursor: pointer;
            display: none;
        }
        .top-bar .search-wrapper .clear-btn.visible {
            display: block;
        }
        .top-bar .top-actions {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .top-bar .top-actions button {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 13px;
            font-family: var(--font-sans);
            transition: all 0.25s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        .top-bar .top-actions button:hover {
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.15);
        }
        .mobile-search-btn,
        .search-exit-btn {
            display: none;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 8px 14px;
            cursor: pointer;
            font-size: 16px;
            backdrop-filter: blur(8px);
        }
        .tabs-bar {
            background: var(--card-bg);
            display: flex;
            gap: 4px;
            padding: 0 24px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
            overflow-x: auto;
            box-shadow: 0 2px 16px rgba(0, 0, 0, 0.06), inset 0 1px 0 var(--glass-highlight);
        }
        .tabs-bar .tab {
            padding: 14px 22px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 3px solid transparent;
            transition: all 0.25s;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: none;
            font-family: var(--font-sans);
        }
        .tabs-bar .tab:hover {
            color: var(--accent);
            background: var(--accent-light);
        }
        .tabs-bar .tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: 600;
        }
        .tabs-bar .tab .tab-badge {
            background: var(--accent);
            color: #fff;
            font-size: 11px;
            padding: 2px 8px;
            font-weight: 600;
        }
        .breadcrumb-bar {
            background: var(--card-bg);
            padding: 10px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-shrink: 0;
            min-height: 42px;
            overflow-x: auto;
            white-space: nowrap;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
        }
        .breadcrumb-bar .crumb {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 8px;
            color: var(--text-secondary);
            background: none;
            border: none;
            font-size: 13px;
            white-space: nowrap;
        }
        .breadcrumb-bar .crumb:hover {
            background: var(--accent-light);
            color: var(--accent);
        }
        .breadcrumb-bar .crumb.current {
            color: var(--accent);
            font-weight: 600;
            cursor: default;
        }
        .breadcrumb-bar .crumb-sep {
            color: var(--text-light);
            font-size: 12px;
        }
        .toolbar {
            background: var(--card-bg);
            padding: 10px 24px;
            border-bottom: 1px solid var(--glass-border);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 1px 8px rgba(0, 0, 0, 0.04);
        }
        .toolbar .tool-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .toolbar .tool-divider {
            width: 1px;
            height: 24px;
            background: var(--border);
            margin: 0 4px;
        }
        .toolbar button {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--glass-border);
            color: var(--text-secondary);
            padding: 7px 14px;
            cursor: pointer;
            font-size: 13px;
            font-family: var(--font-sans);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
            backdrop-filter: blur(8px);
        }
        body.dark .toolbar button {
            background: rgba(255, 255, 255, 0.05);
        }
        .toolbar button:hover:not(:disabled) {
            background: var(--accent-light);
            color: var(--accent);
            border-color: rgba(74, 144, 217, 0.3);
        }
        .toolbar button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .toolbar .tool-info {
            font-size: 12px;
            color: var(--text-light);
        }
        .main-content {
            flex: 1;
            display: flex;
            overflow: hidden;
            position: relative;
            min-height: 0;
            z-index: 1;
        }
        .tree-view-container {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px 24px;
            background: transparent;
            scroll-behavior: smooth;
            position: relative;
            z-index: 1;
        }
        .tree-view-container.drag-over::after {
            content: '释放鼠标以上传文件/文件夹';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(74, 144, 217, 0.2);
            border: 3px dashed var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: var(--accent);
            z-index: 999;
            pointer-events: none;
            backdrop-filter: blur(8px);
            margin: 16px 20px 24px;
            box-sizing: border-box;
        }
        .tree-view-container::-webkit-scrollbar {
            width: 8px;
        }
        .tree-view-container::-webkit-scrollbar-thumb {
            background: rgba(160, 160, 180, 0.4);
        }
        .tree-node .node-row {
            display: flex;
            align-items: center;
            padding: 7px 10px;
            cursor: pointer;
            transition: all 0.18s;
            gap: 6px;
            min-height: 36px;
            background: transparent;
            border: 1px solid transparent;
            margin: 1px 0;
        }
        .tree-node .node-row:hover {
            background: var(--accent-light);
            border-color: rgba(74, 144, 217, 0.15);
        }
        .tree-node .node-row.selected {
            background: var(--accent-light);
            box-shadow: inset 0 0 0 2px var(--accent), 0 0 8px rgba(74, 144, 217, 0.2);
            border-color: rgba(74, 144, 217, 0.3);
        }
        .tree-node .toggle-icon {
            display: none;
        }
        .tree-node .node-icon {
            font-size: 18px;
            flex-shrink: 0;
            width: 24px;
            text-align: center;
        }
        .tree-node .node-label {
            flex: 1;
            font-size: 14px;
            color: var(--text);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .tree-node .node-badge {
            font-size: 11px;
            color: var(--text-light);
            background: rgba(255, 255, 255, 0.3);
            padding: 3px 8px;
            flex-shrink: 0;
            backdrop-filter: blur(4px);
        }
        body.dark .tree-node .node-badge {
            background: rgba(255, 255, 255, 0.08);
        }
        .tree-node .node-children {
            display: none;
        }
        .node-actions {
            display: flex;
            gap: 2px;
            flex-shrink: 0;
            margin-left: 8px;
            opacity: 0.7;
            flex-wrap: wrap;
            align-items: center;
        }
        .node-row:hover .node-actions {
            opacity: 1;
        }
        .node-actions button {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--glass-border);
            cursor: pointer;
            padding: 3px 5px;
            font-size: 14px;
            color: var(--text-light);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            backdrop-filter: blur(4px);
        }
        body.dark .node-actions button {
            background: rgba(255, 255, 255, 0.05);
        }
        .node-actions button:hover {
            background: var(--accent-light);
            color: var(--accent);
            border-color: rgba(74, 144, 217, 0.3);
        }
        .node-actions button.delete-btn:hover {
            background: rgba(231, 76, 60, 0.15);
            color: var(--danger);
            border-color: rgba(231, 76, 60, 0.3);
        }
        .file-icon-html {
            color: #e44d26;
        }
        .file-icon-js {
            color: #f7df1e;
        }
        .file-icon-css {
            color: #264de4;
        }
        .file-icon-py {
            color: #3776ab;
        }
        .file-icon-img {
            color: #e91e63;
        }
        .file-icon-txt {
            color: #607d8b;
        }
        .file-icon-json {
            color: #f39c12;
        }
        .file-icon-zip {
            color: #795548;
        }
        .file-icon-font {
            color: #9c27b0;
        }
        .file-icon-video {
            color: #ff5722;
        }
        .file-icon-audio {
            color: #00bcd4;
        }
        .detail-panel {
            width: 320px;
            background: var(--card-bg);
            border-left: 1px solid var(--glass-border);
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transition: all 0.3s;
            box-shadow: -4px 0 24px rgba(0, 0, 0, 0.08);
        }
        .detail-panel.collapsed {
            width: 0;
            padding: 0;
            border-left: none;
            overflow: hidden;
        }
        .detail-panel .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 12px;
        }
        .detail-panel .panel-header h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .detail-panel .panel-close {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            color: var(--text-light);
        }
        .detail-panel .detail-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 10px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        .detail-panel .detail-item .detail-label {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-light);
            font-weight: 600;
        }
        .detail-panel .detail-item .detail-value {
            font-size: 14px;
            color: var(--text);
            word-break: break-all;
            line-height: 1.5;
        }
        .status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--primary);
            color: rgba(255, 255, 255, 0.85);
            padding: 8px 24px;
            display: flex;
            align-items: center;
            gap: 20px;
            font-size: 12px;
            flex-wrap: wrap;
            min-height: 36px;
            z-index: 200;
            border-top: 1px solid var(--glass-border);
            box-shadow: 0 -2px 16px rgba(0, 0, 0, 0.1), inset 0 1px 0 var(--glass-highlight);
        }
        .status-bar .status-item {
            display: flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }
        .status-bar .status-spacer {
            flex: 1;
        }
        .status-bar .search-indicator {
            background: rgba(255, 255, 255, 0.15);
            padding: 3px 10px;
            display: flex;
            align-items: center;
            gap: 6px;
            backdrop-filter: blur(8px);
        }
        .status-bar .copyright {
            white-space: nowrap;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            margin-left: 8px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-box {
            background: var(--card-bg);
            box-shadow: var(--shadow-lg);
            padding: 24px;
            width: 360px;
            max-width: 90vw;
            border: 1px solid var(--glass-border);
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.2), inset 0 1px 0 var(--glass-highlight);
        }
        .modal-box h3 {
            margin-bottom: 16px;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text);
        }
        .modal-box input,
        .modal-box select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--glass-border);
            font-size: 14px;
            font-family: var(--font-sans);
            outline: none;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.3);
            color: var(--text);
            backdrop-filter: blur(8px);
        }
        body.dark .modal-box input,
        body.dark .modal-box select {
            background: rgba(255, 255, 255, 0.05);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 8px 16px;
            border: 1px solid var(--glass-border);
            cursor: pointer;
            font-size: 13px;
            font-family: var(--font-sans);
            display: flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.3);
            color: var(--text-secondary);
            backdrop-filter: blur(8px);
        }
        body.dark .modal-box .modal-actions button {
            background: rgba(255, 255, 255, 0.05);
        }
        .modal-box .modal-actions .btn-confirm {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }
        .hidden-input {
            display: none;
        }
        .node-checkbox {
            margin-right: 6px;
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--accent);
        }
        .multi-delete-btn {
            background: var(--danger);
            color: #fff !important;
            border-color: var(--danger) !important;
        }
        @media (max-width: 768px) {
            .top-bar {
                padding: 0 12px;
                height: 52px;
                gap: 10px;
            }
            .top-bar .logo {
                font-size: 16px;
            }
            .top-bar .logo .logo-icon {
                font-size: 20px;
            }
            .top-bar .search-wrapper {
                display: none;
                max-width: none;
                flex: 1;
                margin-left: 0;
            }
            .top-bar.search-active .search-wrapper {
                display: block;
                flex: 1;
                margin: 0;
            }
            .top-bar.search-active .logo,
            .top-bar.search-active .top-actions {
                display: none;
            }
            .top-bar.search-active .mobile-search-btn {
                display: none;
            }
            .top-bar.search-active .search-exit-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-left: 8px;
                flex-shrink: 0;
            }
            .mobile-search-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                margin-left: auto;
            }
            .top-bar .top-actions button span {
                display: none;
            }
            .top-bar .top-actions button {
                padding: 8px 10px;
            }
            .tabs-bar {
                padding: 0 12px;
            }
            .tabs-bar .tab {
                padding: 12px 14px;
                font-size: 14px;
            }
            .breadcrumb-bar {
                padding: 8px 12px;
                font-size: 12px;
            }
            .toolbar {
                padding: 8px 12px;
                gap: 6px;
            }
            .toolbar button {
                padding: 6px 10px;
                font-size: 12px;
            }
            .tree-view-container {
                padding: 10px 8px 16px;
            }
            .detail-panel {
                width: 280px;
                position: absolute;
                right: 0;
                top: 0;
                bottom: 0;
                z-index: 50;
                box-shadow: var(--shadow-lg);
                transform: translateX(0);
                transition: transform 0.3s;
            }
            .detail-panel.collapsed {
                transform: translateX(100%);
                width: 280px;
                padding: 20px;
                border-left: 1px solid var(--glass-border);
            }
            .status-bar {
                padding: 6px 12px;
                gap: 10px;
                font-size: 11px;
            }
            .status-bar .status-spacer {
                display: none;
            }
            .node-row .node-label {
                font-size: 13px;
            }
            .node-actions .action-btn-extra {
                display: none;
            }
            .node-actions.more-open .action-btn-extra {
                display: flex;
            }
            .node-actions .more-btn {
                display: flex;
            }
            .node-actions .rename-btn,
            .node-actions .delete-btn,
            .node-actions .hide-btn {
                display: flex;
            }
            .node-actions.more-open .rename-btn,
            .node-actions.more-open .delete-btn,
            .node-actions.more-open .hide-btn {
                display: flex;
            }
            .node-actions.more-open {
                flex-wrap: wrap;
            }
            .node-actions .more-btn {
                order: 100;
            }
            .node-actions.more-open .more-btn {
                order: initial;
            }
            .node-actions {
                flex-wrap: nowrap;
            }
        }
        @media (min-width: 769px) {
            .node-actions .more-btn {
                display: none;
            }
            .node-actions .action-btn-extra {
                display: flex;
            }
        }
        @media (max-width: 480px) {
            .top-bar .logo span {
                display: none;
            }
            .toolbar .tool-divider {
                display: none;
            }
            .detail-panel {
                width: 100%;
            }
            .detail-panel.collapsed {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header class="top-bar" id="topBar">
        <div class="logo"><i class="las la-sitemap logo-icon"></i><span>米遇安索引</span></div>
        <button id="mobileSearchBtn" class="mobile-search-btn" title="搜索"><i class="las la-search"></i></button>
        <div class="search-wrapper" id="searchWrapper">
            <i class="las la-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="搜索名称、路径或类型..." autocomplete="off">
            <button class="clear-btn" id="clearSearchBtn"><i class="las la-times"></i></button>
        </div>
        <button id="searchExitBtn" class="search-exit-btn" title="退出搜索"><i class="las la-times"></i></button>
        <div class="top-actions">
            <button id="btnDarkMode" title="切换主题模式"><i class="las la-adjust"></i></button>
            <button id="btnUp" title="返回上一级"><i class="las la-arrow-up"></i><span>向上</span></button>
        </div>
    </header>
    <nav class="tabs-bar" id="tabsBar">
        <button class="tab active" data-tab="files"><i class="las la-folder"></i> 文件索引 <span class="tab-badge" id="fileNodeCount">0</span></button>
        <button class="tab" data-tab="book"><i class="las la-book"></i> 书本目录 <span class="tab-badge" id="bookNodeCount">0</span></button>
    </nav>
    <div class="breadcrumb-bar" id="breadcrumbBar">
        <i class="las la-map-marker-alt"></i>
        <span id="breadcrumbContent"></span>
    </div>
    <div class="toolbar" id="toolbar">
        <div class="tool-row">
            <button id="btnRefresh"><i class="las la-sync-alt"></i> 刷新</button>
            <button id="btnToggleDetail"><i class="las la-info-circle"></i> 详情</button>
            <div class="tool-divider"></div>
            <button id="btnSortAsc"><i class="las la-sort-alpha-up"></i> 升序</button>
            <button id="btnSortDesc"><i class="las la-sort-alpha-down"></i> 降序</button>
            <button id="btnDeleteSelected"><i class="las la-trash-alt"></i> 删除</button>
            <div class="tool-divider"></div>
            <button id="btnToggleHidden" title="显示/隐藏已隐藏的文件"><i class="las la-eye-slash"></i> 显示隐藏</button>
            <span class="tool-info" id="toolbarInfo"></span>
        </div>
        <div class="tool-row">
            <button id="btnCopy" title="复制选中节点"><i class="las la-copy"></i> 复制</button>
            <button id="btnCut" title="剪切选中节点"><i class="las la-cut"></i> 剪切</button>
            <button id="btnPaste" title="粘贴到当前文件夹"><i class="las la-paste"></i> 粘贴</button>
            <button id="btnNewFile" title="新建文件"><i class="las la-file-plus"></i> 新建文件</button>
            <button id="btnNewFolder" title="新建文件夹"><i class="las la-folder-plus"></i> 新建文件夹</button>
            <button id="btnCreateShortcut" title="为选中节点创建快捷方式"><i class="las la-link"></i> 创建快捷方式</button>
            <span class="tool-info" id="clipboardInfo"></span>
        </div>
    </div>
    <main class="main-content">
        <div class="tree-view-container" id="treeContainer"></div>
        <aside class="detail-panel collapsed" id="detailPanel">
            <div class="panel-header">
                <h3><i class="las la-file-alt"></i> 节点详情</h3>
                <button class="panel-close" id="panelCloseBtn"><i class="las la-times"></i></button>
            </div>
            <div id="detailContent"></div>
        </aside>
    </main>
    <footer class="status-bar" id="statusBar">
        <span class="status-item"><i class="las la-chart-bar"></i> <span id="statTotal">总节点: 0</span></span>
        <span class="status-item"><i class="las la-folder"></i> <span id="statFolders">文件夹: 0</span></span>
        <span class="status-item"><i class="las la-file"></i> <span id="statFiles">文件: 0</span></span>
        <span class="status-item"><i class="las la-book"></i> <span id="statChapters">章节: 0</span></span>
        <span class="status-item"><i class="las la-eye"></i> <span id="statVisible">可见: 0</span></span>
        <span class="status-spacer"></span>
        <span class="search-indicator" id="searchIndicator" style="display:none;"></span>
        <span class="copyright">©米遇安</span>
    </footer>
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box">
            <h3 id="modalTitle"></h3>
            <input type="text" id="modalInput" placeholder="请输入名称..." autofocus>
            <div class="modal-actions">
                <button id="modalCancel"><i class="las la-times"></i> 取消</button>
                <button id="modalConfirm" class="btn-confirm"><i class="las la-check"></i> 确定</button>
            </div>
        </div>
    </div>
    <div class="modal-overlay" id="shortcutModalOverlay">
        <div class="modal-box">
            <h3><i class="las la-link"></i> 选择快捷方式存放位置</h3>
            <select id="shortcutTargetSelect"></select>
            <div class="modal-actions">
                <button id="shortcutCancel"><i class="las la-times"></i> 取消</button>
                <button id="shortcutConfirm" class="btn-confirm"><i class="las la-check"></i> 创建</button>
            </div>
        </div>
    </div>
    <input type="file" id="fileInput" multiple class="hidden-input">
    <input type="file" id="dirInput" webkitdirectory multiple class="hidden-input">

    <script>
        (function() {
            'use strict';

            // ---------- 本地存储 ----------
            const STORAGE_KEY_FILES = 'miyuan_fileData';
            const STORAGE_KEY_BOOK = 'miyuan_bookData';
            const THEME_STORAGE_KEY = 'miyuan_theme_mode';
            const defaultFileData = { rootLabel: '📁 项目根目录', nodes: [] };
            const defaultBookData = { title: '书本目录', rootLabel: '📚 书本目录', nodes: [] };

            function loadData(key, defaultData) {
                try {
                    const stored = localStorage.getItem(key);
                    if (stored) return JSON.parse(stored);
                } catch (e) { console.warn('加载数据失败', e); }
                return JSON.parse(JSON.stringify(defaultData));
            }
            let bookData = loadData(STORAGE_KEY_BOOK, defaultBookData);
            let fileData = loadData(STORAGE_KEY_FILES, defaultFileData);

            function saveData() {
                localStorage.setItem(STORAGE_KEY_FILES, JSON.stringify(fileData));
                localStorage.setItem(STORAGE_KEY_BOOK, JSON.stringify(bookData));
            }
            saveData();

            // ---------- 主题 ----------
            function getThemeMode() { return localStorage.getItem(THEME_STORAGE_KEY) || 'auto'; }

            function setThemeMode(mode) {
                localStorage.setItem(THEME_STORAGE_KEY, mode);
                applyTheme();
            }

            function applyTheme() {
                const mode = getThemeMode();
                const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
                const shouldDark = mode === 'dark' || (mode === 'auto' && darkQuery.matches);
                document.body.classList.toggle('dark', shouldDark);
                updateThemeButtonIcon(mode);
            }

            function updateThemeButtonIcon(mode) {
                const icon = document.querySelector('#btnDarkMode i');
                if (mode === 'auto') icon.className = 'las la-adjust';
                else if (mode === 'dark') icon.className = 'las la-moon';
                else icon.className = 'las la-sun';
            }
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (getThemeMode() ===
                    'auto') applyTheme(); });

            // ---------- 状态 ----------
            const state = {
                currentTab: 'files',
                currentFolderId: 'root',
                expandedNodes: new Set(),
                selectedNodeIds: new Set(),
                lastSelectedId: null,
                searchQuery: '',
                sortDirection: null,
                detailPanelVisible: false,
                preSearchExpanded: null,
                flatNodeMap: new Map(),
                modalAction: null,
                modalParentId: null,
                modalTargetId: null,
                clipboard: { mode: null, nodeIds: [] },
                shortcutSourceId: null,
                mobileSearchActive: false,
                showHidden: false
            };
            applyTheme();

            const $ = sel => document.querySelector(sel);
            const $$ = sel => document.querySelectorAll(sel);
            const topBar = $('#topBar');
            const mobileSearchBtn = $('#mobileSearchBtn');
            const searchExitBtn = $('#searchExitBtn');
            const searchWrapper = $('#searchWrapper');
            const searchInput = $('#searchInput');
            const clearSearchBtn = $('#clearSearchBtn');
            const treeContainer = $('#treeContainer');
            const breadcrumbContent = $('#breadcrumbContent');
            const detailPanel = $('#detailPanel');
            const detailContent = $('#detailContent');
            const toolbarInfo = $('#toolbarInfo');
            const clipboardInfo = $('#clipboardInfo');
            const searchIndicator = $('#searchIndicator');
            const modalOverlay = $('#modalOverlay');
            const modalTitle = $('#modalTitle');
            const modalInput = $('#modalInput');
            const modalCancel = $('#modalCancel');
            const modalConfirm = $('#modalConfirm');
            const shortcutModalOverlay = $('#shortcutModalOverlay');
            const shortcutTargetSelect = $('#shortcutTargetSelect');
            const shortcutCancel = $('#shortcutCancel');
            const shortcutConfirm = $('#shortcutConfirm');
            const fileInput = $('#fileInput');
            const dirInput = $('#dirInput');
            const btnDarkMode = $('#btnDarkMode');
            const btnDeleteSelected = $('#btnDeleteSelected');
            const btnCopy = $('#btnCopy');
            const btnCut = $('#btnCut');
            const btnPaste = $('#btnPaste');
            const btnNewFile = $('#btnNewFile');
            const btnNewFolder = $('#btnNewFolder');
            const btnCreateShortcut = $('#btnCreateShortcut');
            const btnToggleHidden = $('#btnToggleHidden');
            const btnUp = $('#btnUp');

            function setMobileSearchActive(active) {
                state.mobileSearchActive = active;
                topBar.classList.toggle('search-active', active);
                if (active) searchInput.focus();
            }

            // ---------- 工具函数 ----------
            function getCurrentData() { return state.currentTab === 'book' ? bookData : fileData; }

            function getNodeIconClass(node, isExpanded) {
                if (node.type === 'shortcut') return 'las la-link';
                if (state.currentTab === 'book') {
                    if (node.type === 'chapter') return isExpanded ? 'las la-book-open' : 'las la-book';
                    if (node.type === 'section') return isExpanded ? 'las la-file-alt' : 'las la-file';
                    return 'las la-file';
                } else {
                    if (node.type === 'folder') return isExpanded ? 'las la-folder-open' : 'las la-folder';
                    const ft = node.fileType || 'default';
                    const map = { html: 'las la-code', js: 'las la-file-code', css: 'las la-file-code', py: 'las la-file-code',
                        img: 'las la-file-image', txt: 'las la-file-alt', json: 'las la-file-code', zip: 'las la-file-archive',
                        font: 'las la-file-alt', video: 'las la-file-video', audio: 'las la-file-audio' };
                    return map[ft] || 'las la-file';
                }
            }

            function getFileTypeClass(fileType) {
                const map = { html: 'file-icon-html', js: 'file-icon-js', css: 'file-icon-css', py: 'file-icon-py', img: 'file-icon-img',
                    txt: 'file-icon-txt', json: 'file-icon-json', zip: 'file-icon-zip', font: 'file-icon-font', video: 'file-icon-video',
                    audio: 'file-icon-audio' };
                return map[fileType] || '';
            }

            function getAllNodes(data) {
                const result = [];
                const cleanRootLabel = (data.rootLabel || data.title || '根目录').replace(/[^\w\u4e00-\u9fa5\s]/g, '')
                    .trim() || '根目录';
                const traverse = (nodes, parentPath) => {
                    if (!nodes) return;
                    for (const node of nodes) {
                        const path = parentPath ? `${parentPath} / ${node.title||node.name}` : (node.title || node.name);
                        result.push({ ...node, _path: path, _parent: parentPath || '' });
                        if (node.children && node.children.length > 0) traverse(node.children, path);
                    }
                };
                traverse(data.nodes, cleanRootLabel);
                return result;
            }

            function buildFlatMap(data) {
                state.flatNodeMap.clear();
                const traverse = (nodes) => {
                    if (!nodes) return;
                    for (const node of nodes) {
                        state.flatNodeMap.set(node.id, node);
                        if (node.children && node.children.length > 0) traverse(node.children);
                    }
                };
                traverse(data.nodes);
            }

            function countNodes(data) {
                let total = 0,
                    folders = 0,
                    files = 0,
                    chapters = 0;
                const traverse = (nodes) => {
                    if (!nodes) return;
                    for (const node of nodes) {
                        total++;
                        if (node.type === 'folder') folders++;
                        if (node.type === 'file') files++;
                        if (node.type === 'chapter') chapters++;
                        if (node.children && node.children.length > 0) traverse(node.children);
                    }
                };
                traverse(data.nodes);
                return { total, folders, files, chapters };
            }

            function getNodeById(data, id) {
                if (!id || id === 'root') return { id: 'root', children: data.nodes, type: 'root', title: data.rootLabel || data
                        .title || '根目录' };
                const traverse = (nodes) => {
                    if (!nodes) return null;
                    for (const node of nodes) {
                        if (node.id === id) return node;
                        if (node.children) { const found = traverse(node.children); if (found) return found; }
                    }
                    return null;
                };
                return traverse(data.nodes);
            }

            function getParentId(data, id) {
                const traverse = (nodes, parentId) => {
                    if (!nodes) return null;
                    for (const node of nodes) {
                        if (node.id === id) return parentId || 'root';
                        if (node.children) { const found = traverse(node.children, node.id); if (found) return found; }
                    }
                    return null;
                };
                const result = traverse(data.nodes, null);
                return result === null ? null : result;
            }

            function getPathToNode(data, id) {
                if (id === 'root') return [{ id: 'root', label: data.rootLabel || data.title || '根目录', type: 'root' }];
                const path = [];
                const traverse = (nodes, trail) => {
                    if (!nodes) return false;
                    for (const node of nodes) {
                        const newTrail = [...trail, { id: node.id, label: node.title || node.name, type: node.type }];
                        if (node.id === id) { path.push(...newTrail); return true; }
                        if (node.children && traverse(node.children, newTrail)) return true;
                    }
                    return false;
                };
                traverse(data.nodes, [{ id: 'root', label: data.rootLabel || data.title || '根目录', type: 'root' }]);
                return path.length ? path : [];
            }

            function matchesSearch(node, query) {
                if (!query) return true;
                const q = query.toLowerCase();
                const label = (node.title || node.name || '').toLowerCase();
                const path = (node._path || '').toLowerCase();
                const fileType = (node.fileType || '').toLowerCase();
                const typeLabel = (node.type || '').toLowerCase();
                if (query.startsWith('/') || query.startsWith('\\')) return path.includes(q.replace(/^[\\/]+/, ''));
                return label.includes(q) || path.includes(q) || fileType.includes(q) || typeLabel.includes(q);
            }

            function getSearchResults(data, query) {
                if (!query) return { matchedIds: new Set(), visibleIds: new Set(), matchCount: 0 };
                const matchedIds = new Set(),
                    visibleIds = new Set();
                const allNodes = getAllNodes(data);
                const matchSet = new Set();
                for (const node of allNodes) { if (matchesSearch(node, query)) { matchSet.add(node.id);
                        matchedIds.add(node.id); } }
                const idToChildren = new Map();
                const traverseChildren = (nodes, parentId) => {
                    if (!nodes) return;
                    for (const node of nodes) {
                        if (parentId) { if (!idToChildren.has(parentId)) idToChildren.set(parentId, []);
                            idToChildren.get(parentId).push(node.id); }
                        if (node.children) traverseChildren(node.children, node.id);
                    }
                };
                traverseChildren(data.nodes, null);
                for (const matchId of matchSet) {
                    let currentId = matchId;
                    while (currentId) { visibleIds.add(currentId);
                        const parentId = getParentId(data, currentId); if (parentId && parentId !== 'root')
                            currentId = parentId;
                        else break; }
                }
                const addDescendants = (nodeId) => {
                    const children = idToChildren.get(nodeId);
                    if (children) { for (const childId of children) { visibleIds.add(childId);
                            addDescendants(childId); } }
                };
                for (const mid of Array.from(matchSet)) addDescendants(mid);
                return { matchedIds, visibleIds, matchCount: matchedIds.size };
            }

            // ---------- 渲染 ----------
            function renderTree() {
                const data = getCurrentData();
                buildFlatMap(data);

                if (state.searchQuery) {
                    const searchResult = getSearchResults(data, state.searchQuery);
                    const isSearchMode = true;
                    const visibleIds = searchResult.visibleIds;
                    const matchedIds = searchResult.matchedIds;
                    const allNodes = getAllNodes(data);
                    const visibleCount = visibleIds.size;
                    updateStats(data, visibleCount);
                    let html = '';
                    if (searchResult.matchCount === 0) {
                        html = `<div class="empty-state fade-in"><div class="empty-icon"><i class="las la-search" style="font-size:64px;opacity:0.6;"></i></div><p>未找到匹配 "<strong>${escapeHtml(state.searchQuery)}</strong>"</p></div>`;
                    } else {
                        const rootNode = { id: 'root', children: data.nodes, type: 'root', title: data.rootLabel || data
                                .title || '根目录' };
                        html = renderNodeRow(rootNode, 0, true, visibleIds, matchedIds, true);
                        html += renderNodes(data.nodes, 0, true, visibleIds, matchedIds);
                    }
                    treeContainer.innerHTML = html;
                    const sortInfo = state.sortDirection ?
                        ` | 排序: ${state.sortDirection==='asc'?'升序':'降序'}` : '';
                    toolbarInfo.textContent = `搜索结果: ${searchResult.matchCount} 个匹配项`;
                } else {
                    const currentFolder = getNodeById(data, state.currentFolderId);
                    const children = currentFolder ? (currentFolder.children || []) : data.nodes;
                    const filteredChildren = children.filter(n => state.showHidden || !n.hidden);
                    const visibleCount = filteredChildren.length;
                    updateStats(data, visibleCount);
                    let html = '';
                    if (filteredChildren.length === 0) {
                        html = `<div class="empty-state fade-in"><div class="empty-icon"><i class="las la-folder-open" style="font-size:64px;opacity:0.6;"></i></div><p>此文件夹为空</p></div>`;
                    } else {
                        html = renderListNodes(filteredChildren);
                    }
                    treeContainer.innerHTML = html;
                    const sortInfo = state.sortDirection ?
                        ` | 排序: ${state.sortDirection==='asc'?'升序':'降序'}` : '';
                    toolbarInfo.textContent =
                        `当前目录: ${currentFolder.title || currentFolder.name || '根目录'} | 子项: ${filteredChildren.length}${sortInfo}`;
                }

                $('#fileNodeCount').textContent = countNodes(fileData).total;
                $('#bookNodeCount').textContent = countNodes(bookData).total;
                updateBreadcrumb();
                updateDetailPanel();
                updateClipboardButtons();
                btnToggleHidden.innerHTML = state.showHidden ? '<i class="las la-eye"></i> 隐藏已隐藏' :
                    '<i class="las la-eye-slash"></i> 显示隐藏';
            }

            function renderListNodes(nodes) {
                let html = '';
                for (const node of nodes) { html += renderListRow(node); }
                return html;
            }

            function renderListRow(node) {
                const hasChildren = node.children && node.children.length > 0;
                const iconClass = getNodeIconClass(node, false);
                const fileTypeClass = node.type === 'file' ? getFileTypeClass(node.fileType) : '';
                const label = node.title || node.name;
                const badge = hasChildren ? `${node.children.length}` : '';
                const isSelected = state.selectedNodeIds.has(node.id);
                const sizeText = node.size ? ` · ${node.size}` : '';
                const selectedClass = isSelected ? 'selected' : '';
                const isFolder = node.type === 'folder' || node.type === 'chapter' || node.type === 'section' || node.type ===
                    'root';

                let actionsHtml = '';
                if (state.currentTab === 'files') {
                    const folderActions = isFolder ? `
                        <button class="new-file-btn action-btn-extra" data-action="new-file" data-parent-id="${node.id}" title="新建文件"><i class="las la-plus"></i></button>
                        <button class="new-folder-btn action-btn-extra" data-action="new-folder" data-parent-id="${node.id}" title="新建目录"><i class="las la-folder-plus"></i></button>
                        <button class="upload-file-btn action-btn-extra" data-action="upload-file" data-parent-id="${node.id}" title="上传文件"><i class="las la-upload"></i></button>
                        <button class="upload-dir-btn action-btn-extra" data-action="upload-dir" data-parent-id="${node.id}" title="上传目录"><i class="las la-folder-open"></i></button>
                    ` : '';
                    actionsHtml = `<div class="node-actions">${folderActions}
                        <button class="rename-btn" data-action="rename" data-node-id="${node.id}" title="重命名"><i class="las la-pen"></i></button>
                        <button class="copy-path-btn action-btn-extra" data-action="copy-path" data-node-id="${node.id}" title="复制路径"><i class="las la-copy"></i></button>
                        <button class="hide-btn" data-action="toggle-hidden" data-node-id="${node.id}" title="${node.hidden ? '取消隐藏' : '隐藏'}"><i class="las ${node.hidden ? 'la-eye' : 'la-eye-slash'}"></i></button>
                        <button class="delete-btn" data-action="delete" data-node-id="${node.id}" title="删除"><i class="las la-trash-alt"></i></button>
                        <button class="more-btn" data-action="toggle-more" title="更多操作"><i class="las la-ellipsis-h"></i></button>
                    </div>`;
                } else {
                    actionsHtml = `<div class="node-actions">${isFolder ? `<button class="new-chapter-btn action-btn-extra" data-action="new-chapter" data-parent-id="${node.id}" title="新建子节点"><i class="las la-plus"></i></button>` : ''}
                        <button class="rename-btn" data-action="rename" data-node-id="${node.id}" title="重命名"><i class="las la-pen"></i></button>
                        <button class="copy-path-btn action-btn-extra" data-action="copy-path" data-node-id="${node.id}" title="复制路径"><i class="las la-copy"></i></button>
                        <button class="hide-btn" data-action="toggle-hidden" data-node-id="${node.id}" title="${node.hidden ? '取消隐藏' : '隐藏'}"><i class="las ${node.hidden ? 'la-eye' : 'la-eye-slash'}"></i></button>
                        <button class="delete-btn" data-action="delete" data-node-id="${node.id}" title="删除"><i class="las la-trash-alt"></i></button>
                        <button class="more-btn" data-action="toggle-more" title="更多操作"><i class="las la-ellipsis-h"></i></button>
                    </div>`;
                }

                const checkboxHtml = `<input type="checkbox" class="node-checkbox" data-id="${node.id}" ${isSelected?'checked':''}>`;
                return `<div class="tree-node" data-node-id="${node.id}">
                    <div class="node-row ${selectedClass}" data-id="${node.id}">
                        ${checkboxHtml}
                        <span class="node-icon ${fileTypeClass}"><i class="${iconClass}"></i></span>
                        <span class="node-label">${label}${sizeText}</span>
                        ${badge ? `<span class="node-badge">${badge} 项</span>` : ''}
                        ${actionsHtml}
                    </div>
                </div>`;
            }

            function renderNodes(nodes, depth, isSearchMode, visibleIds, matchedIds) {
                if (!nodes || nodes.length === 0) return '';
                let html = '';
                for (const node of nodes) {
                    const isVisible = !isSearchMode || visibleIds.has(node.id);
                    if (!isVisible) continue;
                    html += renderNodeRow(node, depth, isSearchMode, visibleIds, matchedIds, false);
                }
                return html;
            }

            function renderNodeRow(node, depth, isSearchMode, visibleIds, matchedIds, isRoot = false) {
                const isVisible = !isSearchMode || isRoot || visibleIds.has(node.id);
                if (!isVisible) return '';
                const isMatch = isSearchMode && !isRoot && matchedIds.has(node.id);
                const hasChildren = node.children && node.children.length > 0;
                const isExpanded = state.expandedNodes.has(node.id) || (isSearchMode && isVisible && hasChildren && !isRoot);
                const iconClass = isRoot ? 'las la-folder-open' : getNodeIconClass(node, isExpanded);
                const fileTypeClass = node.type === 'file' ? getFileTypeClass(node.fileType) : '';
                const label = isRoot ? (node.title || '根目录') : (node.title || node.name);
                const badge = hasChildren ? `${node.children.length}` : '';
                const isSelected = state.selectedNodeIds.has(node.id);
                const sizeText = node.size ? ` · ${node.size}` : '';
                const toggleClass = hasChildren ? (isExpanded ? 'expanded' : '') : 'no-children';
                const selectedClass = isSelected ? 'selected' : '';
                const matchClass = isMatch ? 'match-highlight' : '';
                let displayLabel = label;
                if (isMatch && state.searchQuery) displayLabel = highlightText(label, state.searchQuery);

                let actionsHtml = '';
                if (!isRoot) {
                    actionsHtml = `<div class="node-actions">${node.type==='folder' ? `<button class="new-file-btn" data-action="new-file" data-parent-id="${node.id}" title="新建文件"><i class="las la-plus"></i></button><button class="new-folder-btn" data-action="new-folder" data-parent-id="${node.id}" title="新建目录"><i class="las la-folder-plus"></i></button>` : ''}<button class="rename-btn" data-action="rename" data-node-id="${node.id}"><i class="las la-pen"></i></button><button class="copy-path-btn" data-action="copy-path" data-node-id="${node.id}"><i class="las la-copy"></i></button><button class="hide-btn" data-action="toggle-hidden" data-node-id="${node.id}"><i class="las ${node.hidden ? 'la-eye' : 'la-eye-slash'}"></i></button><button class="delete-btn" data-action="delete" data-node-id="${node.id}"><i class="las la-trash-alt"></i></button></div>`;
                } else {
                    actionsHtml = `<div class="node-actions"><button class="new-file-btn" data-action="new-file" data-parent-id="root"><i class="las la-plus"></i></button><button class="new-folder-btn" data-action="new-folder" data-parent-id="root"><i class="las la-folder-plus"></i></button></div>`;
                }
                const checkboxHtml = `<input type="checkbox" class="node-checkbox" data-id="${node.id}" ${isSelected?'checked':''} ${isRoot?'disabled':''}>`;
                const childrenHtml = hasChildren && (isExpanded || isSearchMode) ?
                    `<div class="node-children ${isExpanded ? 'open' : ''}" style="max-height:none;opacity:1;display:block;">${renderNodes(node.children || [], depth + 1, isSearchMode, visibleIds, matchedIds)}</div>` :
                    '';
                return `<div class="tree-node" data-node-id="${isRoot ? 'root' : node.id}" data-depth="${depth}"><div class="node-row ${selectedClass} ${matchClass}" style="padding-left:${8 + depth * 22}px;" data-id="${isRoot ? 'root' : node.id}"><button class="toggle-icon ${toggleClass}" data-toggle="${isRoot ? 'root' : node.id}" style="display:inline-flex;">${hasChildren ? '<i class="las la-angle-right"></i>' : ''}</button>${checkboxHtml}<span class="node-icon ${fileTypeClass}"><i class="${iconClass}"></i></span><span class="node-label">${displayLabel}${sizeText}</span>${badge ? `<span class="node-badge">${badge} 项</span>` : ''}${actionsHtml}</div>${childrenHtml}</div>`;
            }

            function highlightText(text, query) {
                if (!query) return escapeHtml(text);
                const esc = escapeHtml(text);
                const escQ = escapeHtml(query);
                const regex = new RegExp(`(${escQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`, 'gi');
                return esc.replace(regex, '<mark>$1</mark>');
            }

            function escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }

            function updateStats(data, visibleCount) {
                const s = countNodes(data);
                $('#statTotal').textContent = `总节点: ${s.total}`;
                $('#statFolders').textContent = `文件夹: ${s.folders}`;
                $('#statFiles').textContent = `文件: ${s.files}`;
                $('#statChapters').textContent = `章节: ${s.chapters}`;
                $('#statVisible').textContent = `可见: ${visibleCount}`;
            }

            function updateBreadcrumb() {
                if (state.searchQuery) {
                    breadcrumbContent.innerHTML = `<span class="crumb current">搜索: ${escapeHtml(state.searchQuery)}</span>`;
                    return;
                }
                const data = getCurrentData();
                const path = getPathToNode(data, state.currentFolderId);
                let html = '';
                path.forEach((item, index) => {
                    if (index > 0) html += `<span class="crumb-sep"><i class="las la-angle-right"></i></span>`;
                    const isLast = index === path.length - 1;
                    html += `<button class="crumb ${isLast ? 'current' : ''}" data-crumb-id="${item.id}">${escapeHtml(item.label)}</button>`;
                });
                breadcrumbContent.innerHTML = html;
            }

            function updateDetailPanel() {
                if (state.selectedNodeIds.size === 0) { detailContent.innerHTML =
                        `<div class="detail-empty"><p>点击一个节点查看详情</p><p style="font-size:12px;color:var(--text-light);">支持 Ctrl/Shift 多选</p></div>`;
                    return; }
                if (state.selectedNodeIds.size > 1) { detailContent.innerHTML =
                        `<div class="detail-item"><span class="detail-label">已选择</span><span class="detail-value">${state.selectedNodeIds.size} 个节点</span></div><button class="multi-delete-btn" id="btnBatchDelete" style="width:100%;padding:10px;cursor:pointer;"><i class="las la-trash-alt"></i> 删除选中项</button>`;
                    document.getElementById('btnBatchDelete')?.addEventListener('click', batchDeleteSelected);
                    return; }
                const data = getCurrentData();
                const node = getNodeById(data, Array.from(state.selectedNodeIds)[0]);
                if (!node) { detailContent.innerHTML = '<div class="detail-empty">节点未找到</div>'; return; }
                const path = getPathToNode(data, node.id);
                const pathStr = path.map(p => p.label).join(' / ');
                const childrenCount = node.children ? node.children.length : 0;
                let html =
                    `<div class="detail-item"><span class="detail-label">名称</span><span class="detail-value">${escapeHtml(node.title||node.name)}</span></div><div class="detail-item"><span class="detail-label">类型</span><span class="detail-value">${getTypeLabel(node)}</span></div><div class="detail-item"><span class="detail-label">ID</span><span class="detail-value">${escapeHtml(node.id)}</span></div><div class="detail-item"><span class="detail-label">完整路径</span><span class="detail-value">${escapeHtml(pathStr)}</span></div>`;
                if (node.type === 'shortcut') html +=
                    `<div class="detail-item"><span class="detail-label">目标 ID</span><span class="detail-value">${escapeHtml(node.targetId||'未知')}</span></div>`;
                if (childrenCount > 0) html +=
                    `<div class="detail-item"><span class="detail-label">子节点数</span><span class="detail-value">${childrenCount} 项</span></div>`;
                if (node.size) html +=
                    `<div class="detail-item"><span class="detail-label">文件大小</span><span class="detail-value">${escapeHtml(node.size)}</span></div>`;
                if (node.fileType) html +=
                    `<div class="detail-item"><span class="detail-label">文件类型</span><span class="detail-value">${escapeHtml(node.fileType.toUpperCase())}</span></div>`;
                detailContent.innerHTML = html;
            }

            function getTypeLabel(node) {
                if (node.type === 'shortcut') return '快捷方式';
                if (state.currentTab === 'book') { const map = { chapter: '章节', section: '节', subsection: '小节',
                        root: '根' };
                    return map[node.type] || node.type; } else { const map = { folder: '文件夹', file: '文件',
                        root: '根目录' };
                    return map[node.type] || node.type; }
            }

            function updateClipboardButtons() {
                btnCopy.disabled = state.selectedNodeIds.size === 0;
                btnCut.disabled = state.selectedNodeIds.size === 0;
                btnPaste.disabled = state.clipboard.nodeIds.length === 0;
                btnCreateShortcut.disabled = state.selectedNodeIds.size !== 1;
                if (state.clipboard.nodeIds.length > 0) {
                    const modeText = state.clipboard.mode === 'copy' ? '复制' : '剪切';
                    clipboardInfo.textContent = `剪贴板: ${state.clipboard.nodeIds.length} 个节点 (${modeText})`;
                } else { clipboardInfo.textContent = ''; }
            }

            function toggleHiddenNode(nodeId) {
                const data = getCurrentData();
                const node = getNodeById(data, nodeId);
                if (!node || nodeId === 'root') return;
                node.hidden = !node.hidden;
                saveData();
                renderTree();
            }

            function toggleShowHidden() { state.showHidden = !state.showHidden;
                renderTree(); }

            function copyNodePath(nodeId) {
                const data = getCurrentData();
                const path = getPathToNode(data, nodeId);
                if (path.length === 0) return;
                const pathStr = path.map(p => p.label).join('/');
                navigator.clipboard.writeText(pathStr).then(() => { alert('路径已复制: ' + pathStr); }).catch(err => { alert(
                        '复制失败: ' + err); });
            }

            function openShortcutModal() {
                if (state.selectedNodeIds.size !== 1) { alert('请先选中一个节点'); return; }
                state.shortcutSourceId = Array.from(state.selectedNodeIds)[0];
                const data = getCurrentData();
                const allNodes = getAllNodes(data);
                const folderNodes = allNodes.filter(n => n.type === 'folder' || n.type === 'chapter' || n.type ===
                    'section');
                let options = `<option value="root">根目录</option>`;
                for (const folder of folderNodes) { options +=
                        `<option value="${folder.id}">${escapeHtml(folder._path)}</option>`; }
                shortcutTargetSelect.innerHTML = options;
                shortcutModalOverlay.classList.add('active');
            }

            function confirmShortcutCreation() {
                const targetParentId = shortcutTargetSelect.value;
                if (!targetParentId) return;
                const sourceId = state.shortcutSourceId;
                if (!sourceId) return;
                const data = getCurrentData();
                const sourceNode = getNodeById(data, sourceId);
                if (!sourceNode || sourceId === 'root') return;
                const shortcutName = (sourceNode.name || sourceNode.title) + ' - 快捷方式';
                const newNode = { id: generateId('shortcut'), name: shortcutName, type: 'shortcut', targetId: sourceId,
                    children: [] };
                addNode(targetParentId, newNode);
                shortcutModalOverlay.classList.remove('active');
                state.shortcutSourceId = null;
            }

            function copySelected(mode) {
                if (state.selectedNodeIds.size === 0) { alert('请先选择要复制的节点'); return; }
                state.clipboard = { mode, nodeIds: Array.from(state.selectedNodeIds) };
                updateClipboardButtons();
                renderTree();
            }

            function pasteClipboard() {
                if (state.clipboard.nodeIds.length === 0) { alert('剪贴板为空'); return; }
                const data = getCurrentData();
                let targetParentId = state.currentFolderId;
                if (state.selectedNodeIds.size === 1) {
                    const selectedId = Array.from(state.selectedNodeIds)[0];
                    const selectedNode = getNodeById(data, selectedId);
                    if (selectedNode && (selectedNode.type === 'folder' || selectedNode.type === 'chapter' || selectedNode
                            .type === 'section')) { targetParentId = selectedId; }
                }
                const sourceIds = state.clipboard.nodeIds;
                const isCut = state.clipboard.mode === 'cut';
                for (const sourceId of sourceIds) {
                    if (sourceId === 'root') continue;
                    const sourceNode = getNodeById(data, sourceId);
                    if (!sourceNode) continue;
                    if (targetParentId === sourceId || isDescendant(data, sourceId, targetParentId)) { alert(
                            '不能粘贴到自身或其子目录'); return; }
                    if (isCut) { const parentId = getParentId(data, sourceId); if (parentId === targetParentId)
                            continue;
                        removeNodeFromParent(data, sourceId);
                        addNodeToParent(targetParentId, sourceNode); } else { const clone = deepCloneNode(
                            sourceNode);
                        addNodeToParent(targetParentId, clone); }
                }
                if (isCut) { state.clipboard = { mode: null, nodeIds: [] }; }
                saveData();
                state.selectedNodeIds.clear();
                renderTree();
            }

            function deepCloneNode(node) {
                const clone = JSON.parse(JSON.stringify(node));
                clone.id = generateId(node.type === 'file' ? 'f' : (node.type === 'folder' ? 'fdir' : 'ch'));
                if (clone.children) clone.children = clone.children.map(child => deepCloneNode(child));
                return clone;
            }

            function isDescendant(data, ancestorId, nodeId) {
                let currentId = nodeId;
                while (currentId && currentId !== 'root') { if (currentId === ancestorId) return true;
                    currentId = getParentId(data, currentId); }
                return false;
            }

            function removeNodeFromParent(data, nodeId) {
                const parentId = getParentId(data, nodeId);
                if (!parentId || parentId === 'root') { const idx = data.nodes.findIndex(n => n.id === nodeId); if (idx !== -
                        1) data.nodes.splice(idx, 1); } else { const parent = getNodeById(data, parentId); if (parent &&
                        parent.children) { const idx = parent.children.findIndex(n => n.id === nodeId); if (idx !== -1)
                            parent.children.splice(idx, 1); } }
            }

            function addNodeToParent(parentId, node) {
                if (parentId === 'root') getCurrentData().nodes.push(node);
                else { const parent = getNodeById(getCurrentData(), parentId); if (parent && parent.children) parent
                        .children.push(node); }
            }

            function sortNodes(nodes, direction) {
                if (!direction) return nodes;
                const sorted = [...nodes].sort((a, b) => { const aN = a.title || a.name || '',
                        bN = b.title || b.name || '';
                    return direction === 'asc' ? aN.localeCompare(bN, 'zh-CN') : bN.localeCompare(aN, 'zh-CN'); });
                for (const node of sorted) { if (node.children && node.children.length > 0) node.children = sortNodes(node
                        .children, direction); }
                return sorted;
            }

            function applySort() {
                const data = getCurrentData();
                const clone = JSON.parse(JSON.stringify(data));
                if (state.sortDirection) clone.nodes = sortNodes(clone.nodes, state.sortDirection);
                if (state.currentTab === 'book') bookData.nodes = clone.nodes;
                else fileData.nodes = clone.nodes;
                renderTree();
            }

            function toggleNode(nodeId, forceState) {
                if (nodeId === 'root') { if (forceState !== undefined) { if (forceState) state.expandedNodes.add(
                            'root');
                        else state.expandedNodes.delete('root'); } else { if (state.expandedNodes.has('root'))
                            state.expandedNodes.delete('root');
                        else state.expandedNodes.add('root'); }
                    renderTree(); return; }
                const data = getCurrentData();
                const node = getNodeById(data, nodeId);
                if (!node || !node.children || node.children.length === 0) return;
                if (forceState !== undefined) { if (forceState) state.expandedNodes.add(nodeId);
                    else state.expandedNodes.delete(nodeId); } else { if (state.expandedNodes.has(nodeId)) state
                        .expandedNodes.delete(nodeId);
                    else state.expandedNodes.add(nodeId); }
                renderTree();
            }

            function selectNode(nodeId, { ctrlKey = false, shiftKey = false } = {}) {
                const data = getCurrentData();
                if (shiftKey && state.lastSelectedId) {
                    const allNodes = getAllNodes(data);
                    const visibleNodes = state.searchQuery ? allNodes.filter(n => getSearchResults(data, state
                        .searchQuery).visibleIds.has(n.id)) : allNodes;
                    const ids = visibleNodes.map(n => n.id);
                    const startIdx = ids.indexOf(state.lastSelectedId);
                    const endIdx = ids.indexOf(nodeId);
                    if (startIdx === -1 || endIdx === -1) return;
                    const [min, max] = startIdx < endIdx ? [startIdx, endIdx] : [endIdx, startIdx];
                    state.selectedNodeIds.clear();
                    for (let i = min; i <= max; i++) state.selectedNodeIds.add(ids[i]);
                    state.lastSelectedId = nodeId;
                } else if (ctrlKey) { if (state.selectedNodeIds.has(nodeId)) state.selectedNodeIds.delete(nodeId);
                    else state.selectedNodeIds.add(nodeId);
                    state.lastSelectedId = nodeId; } else { state.selectedNodeIds.clear();
                    state.selectedNodeIds.add(nodeId);
                    state.lastSelectedId = nodeId; }
                renderTree();
            }

            function toggleCheckboxSelection(nodeId, checked) {
                if (checked) state.selectedNodeIds.add(nodeId);
                else state.selectedNodeIds.delete(nodeId);
                state.lastSelectedId = nodeId;
                renderTree();
            }

            function batchDeleteSelected() {
                if (state.selectedNodeIds.size === 0) return;
                if (!confirm(`确定要删除选中的 ${state.selectedNodeIds.size} 个节点吗？`)) return;
                const data = getCurrentData();
                const selectedIds = Array.from(state.selectedNodeIds);
                const idSet = new Set(selectedIds);
                const topLevelIds = [];
                for (const id of selectedIds) {
                    let parentId = getParentId(data, id);
                    let hasSelectedAncestor = false;
                    while (parentId && parentId !== 'root') { if (idSet.has(parentId)) { hasSelectedAncestor =
                                true; break; }
                        parentId = getParentId(data, parentId); }
                    if (!hasSelectedAncestor) topLevelIds.push(id);
                }
                for (const id of topLevelIds) deleteNode(id, false);
                state.selectedNodeIds.clear();
                saveData();
                renderTree();
            }

            function deleteNode(nodeId, reRender = true) {
                if (!nodeId || nodeId === 'root') return;
                const data = getCurrentData();
                const parentId = getParentId(data, nodeId);
                if (!parentId) return;
                const parent = getNodeById(data, parentId);
                if (!parent || !parent.children) return;
                const index = parent.children.findIndex(c => c.id === nodeId);
                if (index !== -1) { parent.children.splice(index, 1);
                    state.selectedNodeIds.delete(nodeId);
                    state.expandedNodes.delete(nodeId); }
                if (reRender) { saveData();
                    renderTree(); }
            }

            function handleSearch(query) {
                state.searchQuery = query.trim();
                if (state.searchQuery) {
                    if (state.preSearchExpanded === null) state.preSearchExpanded = new Set(state.expandedNodes);
                    const data = getCurrentData();
                    const searchResult = getSearchResults(data, state.searchQuery);
                    state.expandedNodes.add('root');
                    for (const id of searchResult.visibleIds) { const node = getNodeById(data, id); if (node && node
                            .children && node.children.length > 0) state.expandedNodes.add(id); }
                } else { if (state.preSearchExpanded) { state.expandedNodes = new Set(state.preSearchExpanded);
                        state.preSearchExpanded = null; } }
                clearSearchBtn.classList.toggle('visible', !!state.searchQuery);
                renderTree();
            }

            function generateId(prefix) { return `${prefix}-${Date.now()}-${Math.random().toString(36).substr(2,5)}`; }

            function addNode(parentId, nodeData) {
                const data = getCurrentData();
                if (parentId === 'root') data.nodes.push(nodeData);
                else { const parent = getNodeById(data, parentId); if (parent && parent.children) { parent.children
                            .push(nodeData); if (!state.expandedNodes.has(parentId)) state.expandedNodes.add(
                            parentId); } else { alert('父节点不存在或不是文件夹'); return false; } }
                saveData();
                renderTree();
                return true;
            }

            function triggerFileUpload(parentId) {
                fileInput.dataset.parentId = parentId;
                fileInput.value = '';
                fileInput.click();
            }

            function triggerDirUpload(parentId) {
                dirInput.dataset.parentId = parentId;
                dirInput.value = '';
                dirInput.click();
            }

            function handleFileUpload(e) {
                const files = e.target.files;
                if (!files.length) return;
                const parentId = fileInput.dataset.parentId || state.currentFolderId;
                const parentNode = getNodeById(getCurrentData(), parentId);
                if (!parentNode) return;
                for (const file of files) {
                    const fileName = file.name;
                    const ext = fileName.includes('.') ? fileName.split('.').pop().toLowerCase() : 'txt';
                    const fileTypeMap = { html: 'html', js: 'js', css: 'css', py: 'py', png: 'img', jpg: 'img', jpeg: 'img',
                        gif: 'img', svg: 'img', ico: 'img', txt: 'txt', md: 'txt', json: 'json', zip: 'zip', rar: 'zip',
                        ttf: 'font', woff: 'font', woff2: 'font', mp4: 'video', mov: 'video', mp3: 'audio', wav: 'audio' };
                    const fileType = fileTypeMap[ext] || 'txt';
                    const size = file.size > 1024 * 1024 ? (file.size / (1024 * 1024)).toFixed(1) + ' MB' : (file.size /
                        1024).toFixed(1) + ' KB';
                    addNode(parentId, { id: generateId('f'), name: fileName, type: 'file', fileType, size,
                        children: [] });
                }
                saveData();
            }

            function handleDirUpload(e) {
                const files = e.target.files;
                if (!files.length) return;
                const parentId = dirInput.dataset.parentId || state.currentFolderId;
                const data = getCurrentData();
                const parentNode = getNodeById(data, parentId);
                if (!parentNode) return;
                const firstFile = files[0];
                const dirName = firstFile.webkitRelativePath.split('/')[0] || '新文件夹';
                const rootDirId = generateId('fdir');
                const rootDirNode = { id: rootDirId, name: dirName, type: 'folder', children: [] };
                if (parentId === 'root') data.nodes.push(rootDirNode);
