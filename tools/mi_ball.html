<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>米球 · 米遇安智能助手</title>
<meta name="theme-color" content="#0078D7">
<link rel="icon" href="https://feng34937.github.io/miyuan/MIYUAN_LOGO_NOBACKGROUND.png">
<link rel="apple-touch-icon" href="https://feng34937.github.io/miyuan/MIYUAN_LOGO_NOBACKGROUND.png">
<style>
:root{
  --bg:#eef3fa; --panel:#fff; --text:#1a2230; --muted:#6b7a8d;
  --border:rgba(0,120,215,.14); --primary:#0078D7; --primary-soft:rgba(0,120,215,.08);
  --bubble-bot:#fff; --bubble-user:linear-gradient(135deg,#0a86e8,#0063b8);
  --shadow:0 8px 24px -14px rgba(16,42,80,.28);
  --glow1:rgba(0,120,215,.16); --glow2:rgba(0,120,215,.10);
  --danger:#e34a4a;
  --sidebar-w:242px;
}
html.dark{
  --bg:#0d1116; --panel:#161a20; --text:#e6edf5; --muted:#8fa0b3;
  --border:rgba(90,169,230,.16); --primary:#5aa9e6; --primary-soft:rgba(90,169,230,.10);
  --bubble-bot:#1b2028; --bubble-user:linear-gradient(135deg,#4a9bdc,#2b7fbf);
  --shadow:0 8px 24px -14px rgba(0,0,0,.7);
  --glow1:rgba(0,120,215,.10); --glow2:rgba(90,169,230,.06);
  --danger:#f26969;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);
  font-size:13.5px;
  transition:background .3s,color .3s;
  -webkit-font-smoothing:antialiased;overflow:hidden;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;
  background:radial-gradient(circle at 12% 8%,var(--glow1),transparent 55%),
             radial-gradient(circle at 88% 92%,var(--glow2),transparent 52%);
}
body::after{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(circle 520px at var(--mx,50vw) var(--my,50vh),
    rgba(0,120,215,.13) 0%,rgba(0,120,215,.04) 45%,transparent 72%);
  opacity:0;transition:opacity .7s ease;
}
html.dark body::after{
  background:radial-gradient(circle 520px at var(--mx,50vw) var(--my,50vh),
    rgba(90,169,230,.13) 0%,rgba(90,169,230,.05) 45%,transparent 72%);
}
body.hovering::after{opacity:1;}

/* ============================================================
   双栏布局
   ============================================================ */
.app{
  position:relative;z-index:1;
  display:flex;
  height:100vh;height:100dvh;
  overflow:hidden;
}

/* ===== 侧边栏 ===== */
.sidebar{
  position:relative;
  width:var(--sidebar-w);
  flex-shrink:0;
  height:100%;
  background:rgba(255,255,255,.52);
  backdrop-filter:blur(32px) saturate(200%);
  -webkit-backdrop-filter:blur(32px) saturate(200%);
  border-right:1px solid rgba(255,255,255,.42);
  display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.2,.9,.4,1);
  box-shadow:4px 0 34px -14px rgba(16,42,80,.16);
  z-index:2;
}
html.dark .sidebar{
  background:rgba(18,22,30,.55);
  border-right-color:rgba(90,169,230,.18);
  box-shadow:4px 0 34px -14px rgba(0,0,0,.5);
}

.sidebar-mask{display:none;}

.sidebar-header{
  padding:13px 14px 11px;
  border-bottom:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.24);
  display:flex;align-items:center;justify-content:space-between;
  flex-shrink:0;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
html.dark .sidebar-header{
  border-bottom-color:rgba(255,255,255,.07);
  background:rgba(255,255,255,.04);
}
.sidebar-header h2{margin:0;font-size:13px;font-weight:800;color:var(--primary);letter-spacing:.03em;}
.sidebar-close{
  background:none;border:none;cursor:pointer;color:var(--muted);
  font-size:16px;padding:2px;display:none;place-items:center;transition:color .2s;
}
.sidebar-close:hover{color:var(--primary);}

.conv-list{
  flex:1;overflow-y:auto;padding:8px 8px;
  display:flex;flex-direction:column;gap:5px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.conv-list::-webkit-scrollbar{width:5px;}
.conv-list::-webkit-scrollbar-thumb{background:var(--border);}

.conv-item{
  position:relative;display:flex;align-items:center;gap:4px;
  padding:8px 9px;cursor:pointer;
  background:rgba(255,255,255,.4);
  border:1px solid rgba(255,255,255,.28);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  transition:all .18s ease;
  border-radius:0;
}
html.dark .conv-item{
  background:rgba(255,255,255,.05);
  border-color:rgba(255,255,255,.06);
}
.conv-item:hover{background:var(--primary-soft);border-color:var(--border);}
.conv-item.active{
  background:rgba(0,120,215,.14);
  border-color:var(--primary);
  box-shadow:0 0 0 1px rgba(0,120,215,.18);
}
html.dark .conv-item.active{background:rgba(90,169,230,.16);}
.conv-item-body{flex:1;min-width:0;}
.conv-item-title{
  font-size:12.5px;font-weight:600;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:1px;line-height:1.35;
}
.conv-item-meta{font-size:9.5px;color:var(--muted);line-height:1.3;}

.conv-rename-input{
  width:100%;font-size:12.5px;font-weight:600;color:var(--text);
  padding:2px 5px;border:1px solid var(--primary);
  background:var(--panel);outline:none;
  font-family:inherit;border-radius:0;
  box-shadow:0 0 0 2px var(--primary-soft);
}

.conv-actions{
  display:flex;gap:1px;flex-shrink:0;
  opacity:0;transition:opacity .16s;
}
.conv-item:hover .conv-actions{opacity:1;}
.conv-act{
  width:21px;height:21px;
  display:grid;place-items:center;background:transparent;
  border:none;color:var(--muted);cursor:pointer;padding:0;
  border-radius:50%;font-size:10.5px;line-height:1;
  transition:all .15s;
}
.conv-act:hover{background:rgba(0,120,215,.15);color:var(--primary);}
.conv-act.danger:hover{background:var(--danger);color:#fff;}

.sidebar-footer{
  padding:9px;
  border-top:1px solid rgba(255,255,255,.45);
  background:rgba(255,255,255,.24);
  flex-shrink:0;
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
}
html.dark .sidebar-footer{
  border-top-color:rgba(255,255,255,.07);
  background:rgba(255,255,255,.04);
}
.new-conv-btn{
  width:100%;padding:9px 12px;
  background:var(--primary);color:#fff;border:none;cursor:pointer;
  font-size:12.5px;font-weight:700;font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:5px;
  transition:filter .2s,transform .15s;
  border-radius:0;
}
.new-conv-btn:hover{filter:brightness(1.08);}
.new-conv-btn:active{transform:scale(.98);}

.empty-conv{font-size:11px;color:var(--muted);text-align:center;padding:22px 10px;}

/* ===== 主区域 ===== */
.main{
  flex:1;min-width:0;
  display:flex;flex-direction:column;
  height:100%;
  overflow:hidden;
}
.main-inner{
  flex:1;min-height:0;
  display:flex;flex-direction:column;
  width:100%;max-width:820px;
  margin:0 auto;
  padding:0 16px;
}

header{
  display:flex;align-items:center;gap:10px;
  padding:11px 0 9px;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
}
.head-info{flex:1;min-width:0;}
.head-info h1{
  margin:0;font-size:14.5px;font-weight:800;letter-spacing:.02em;
  display:flex;align-items:center;gap:5px;flex-wrap:wrap;line-height:1.3;
}
.head-info p{
  margin:1px 0 0;font-size:10px;color:var(--muted);
  display:flex;align-items:center;gap:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.status-dot{
  width:5px;height:5px;border-radius:50%;background:#22c55e;
  box-shadow:0 0 6px rgba(34,197,94,.8);display:inline-block;flex-shrink:0;
  animation:pulseDot 2s ease-in-out infinite;
}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.head-actions{display:flex;gap:6px;flex-shrink:0;}
.icon-btn{
  width:30px;height:30px;display:grid;place-items:center;background:var(--panel);
  border:1px solid var(--border);color:var(--muted);cursor:pointer;
  transition:all .2s cubic-bezier(.2,.9,.4,1);border-radius:0;padding:0;
  position:relative;isolation:isolate;
}
.icon-btn svg{width:15px;height:15px;}
.icon-btn:hover{color:var(--primary);border-color:var(--primary);background:var(--primary-soft);}
.icon-btn:active{transform:scale(.94);}
#convBtn{display:none;}

/* ===== 聊天区 ===== */
#chat{
  flex:1;overflow-y:auto;
  padding:13px 0 10px;
  display:flex;flex-direction:column;gap:10px;
  scrollbar-width:thin;scrollbar-color:var(--border) transparent;
  min-height:0;
}
#chat::-webkit-scrollbar{width:5px;}
#chat::-webkit-scrollbar-thumb{background:var(--border);}

.msg{
  display:flex;gap:5px;align-items:flex-start;
  opacity:0;transform:translateY(6px);
  transition:opacity .28s ease,transform .28s cubic-bezier(.2,.9,.4,1);
  position:relative;
}
.msg.in{opacity:1;transform:translateY(0);}
.msg.user{flex-direction:row-reverse;}

.msg-wrap{position:relative;max-width:min(76%,560px);display:flex;}

.bubble{
  padding:8px 12px;
  font-size:13.2px;line-height:1.6;
  white-space:pre-wrap;word-break:break-word;
  background:var(--bubble-bot);
  border:1px solid var(--border);
  box-shadow:var(--shadow);
  border-radius:0;
  position:relative;isolation:isolate;min-width:38px;
}
.msg.user .bubble{
  background:var(--bubble-user);color:#fff;border:none;
  box-shadow:0 6px 18px -12px rgba(0,120,215,.85);
}

.search-link{
  display:inline-block;margin-top:6px;
  color:var(--primary);font-weight:700;font-size:11.5px;
  text-decoration:underline;text-underline-offset:2px;
}
.msg.user .search-link{color:#fff;}
.search-link:hover{opacity:.75;}
.tag{
  display:inline-block;font-size:9.5px;padding:1px 6px;
  margin-left:5px;border:1px solid var(--border);color:var(--muted);
  vertical-align:middle;
}
.msg.user .tag{border-color:rgba(255,255,255,.4);color:rgba(255,255,255,.85);}

/* 消息操作 */
.msg-actions{
  display:flex;gap:2px;align-items:center;
  opacity:0;transform:translateY(-2px);
  transition:opacity .18s ease,transform .18s ease;
  flex-shrink:0;align-self:flex-start;margin-top:2px;
  pointer-events:none;
}
.msg:hover .msg-actions{opacity:1;transform:translateY(0);pointer-events:auto;}
.msg-act{
  width:22px;height:22px;display:grid;place-items:center;
  background:var(--panel);border:1px solid var(--border);color:var(--muted);
  cursor:pointer;border-radius:50%;padding:0;font-size:10.5px;line-height:1;
  transition:all .16s ease;flex-shrink:0;
}
.msg-act:hover{
  background:var(--primary-soft);color:var(--primary);
  border-color:var(--primary);transform:scale(1.08);
}
.msg-act.danger:hover{background:var(--danger);color:#fff;border-color:var(--danger);}
.msg-act:disabled{opacity:.4;cursor:not-allowed;transform:none;}

/* 打字 */
.typing .bubble{display:flex;gap:4px;align-items:center;padding:10px 13px;font-size:12.5px;color:var(--muted);}
.typing .dot{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:tdot 1.3s ease-in-out infinite;}
.typing .dot:nth-child(2){animation-delay:.16s;}
.typing .dot:nth-child(3){animation-delay:.32s;}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.35;}30%{transform:translateY(-4px);opacity:1;}}

.empty-hint{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  color:var(--muted);font-size:12px;gap:10px;padding:26px 18px;text-align:center;
}
.empty-hint .big{font-size:32px;opacity:.5;}

/* 快捷 */
.chips{display:flex;gap:6px;overflow-x:auto;padding:6px 0;flex-shrink:0;scrollbar-width:none;}
.chips::-webkit-scrollbar{display:none;}
.chip{
  flex:0 0 auto;padding:6px 11px;font-size:11.5px;cursor:pointer;
  background:var(--panel);border:1px solid var(--border);color:var(--primary);
  transition:all .18s cubic-bezier(.2,.9,.4,1);border-radius:0;
  font-family:inherit;white-space:nowrap;position:relative;isolation:isolate;
}
.chip:hover{background:var(--primary-soft);transform:translateY(-1px);}

/* 输入 */
.composer{display:flex;gap:8px;flex-shrink:0;padding:5px 0 8px;}
.composer input{
  flex:1;min-width:0;padding:10px 13px;
  font-size:13px;font-family:inherit;
  border:1px solid var(--border);background:var(--panel);color:var(--text);
  outline:none;border-radius:0;transition:border-color .2s,box-shadow .2s;
}
.composer input::placeholder{font-size:12.5px;}
.composer input:focus{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-soft);}
.send-btn{
  padding:0 18px;background:var(--primary);color:#fff;border:none;cursor:pointer;
  border-radius:0;font-size:12.5px;font-weight:700;font-family:inherit;
  transition:filter .2s,transform .15s;flex-shrink:0;position:relative;isolation:isolate;
}
.send-btn:hover{filter:brightness(1.08);}
.send-btn:active{transform:scale(.97);}
.send-btn:disabled{opacity:.45;cursor:not-allowed;}

/* 版权 */
.copyright{
  flex-shrink:0;text-align:center;
  padding:5px 0 calc(7px + env(safe-area-inset-bottom));
  font-size:10px;color:var(--muted);
  letter-spacing:.05em;
  opacity:.75;
}

/* 光晕 */
.hover-tint{position:relative;isolation:isolate;}
.hover-tint::before{
  content:'';position:absolute;inset:0;z-index:-1;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(0,120,215,.28) 0%,rgba(0,120,215,.10) 42%,transparent 72%);
  opacity:0;transition:opacity .45s cubic-bezier(.2,.9,.4,1);pointer-events:none;
}
html.dark .hover-tint::before{background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(90,169,230,.36) 0%,rgba(90,169,230,.12) 42%,transparent 72%);}
.hover-tint:hover::before{opacity:1;}
.msg.user .bubble.hover-tint::before{background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.32) 0%,rgba(255,255,255,.12) 44%,transparent 72%);}
.send-btn.hover-tint::before{background:radial-gradient(circle at var(--x,50%) var(--y,50%),rgba(255,255,255,.38) 0%,rgba(255,255,255,.14) 45%,transparent 72%);}

/* ===== 米球 ===== */
.mi-ball{
  position:relative;width:1em;height:1em;font-size:38px;border-radius:50%;flex-shrink:0;
  background:radial-gradient(circle at 32% 28%,#a9ddff,#0078D7 55%,#005a9e 100%);
  box-shadow:0 6px 18px -8px rgba(0,120,215,.65),inset 0 -.08em .18em rgba(0,0,0,.18),inset 0 .08em .16em rgba(255,255,255,.35);
  display:flex;align-items:center;justify-content:center;animation:miFloat 4.5s ease-in-out infinite;
}
html.dark .mi-ball{background:radial-gradient(circle at 32% 28%,#cdeeff,#5aa9e6 55%,#3a7ca5 100%);}
@keyframes miFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-5%);}}
#headBall{cursor:pointer;transition:filter .2s ease;font-size:36px;}
#headBall:hover{filter:brightness(1.06);}
#headBall:active{filter:brightness(1.14);}

.mi-face{position:relative;width:.5em;height:.36em;}
.mi-eye{
  position:absolute;top:.055em;width:.083em;height:.125em;background:#0b2b45;border-radius:99px;
  transition:height .14s ease,width .14s ease,transform .2s ease,background .2s ease,border .2s ease,border-radius .2s ease,opacity .2s ease,top .2s ease;
}
.mi-eye-l{left:.06em;} .mi-eye-r{right:.06em;}
.mi-mouth{
  position:absolute;left:50%;bottom:.02em;transform:translateX(-50%);
  width:.17em;height:.07em;border-bottom:.028em solid #0b2b45;
  border-radius:0 0 99px 99px;transition:all .2s ease;
}
.mi-brow{position:absolute;top:.005em;width:.1em;height:.022em;background:#0b2b45;border-radius:99px;opacity:0;transition:all .2s ease;transform-origin:center;}
.mi-brow-l{left:.045em;} .mi-brow-r{right:.045em;}
.mi-blush{position:absolute;top:.16em;width:.11em;height:.055em;border-radius:50%;background:rgba(255,110,140,.55);opacity:0;transition:opacity .2s ease;}
.mi-blush-l{left:-.01em;} .mi-blush-r{right:-.01em;}
.mi-tear{position:absolute;top:.17em;left:.055em;width:.05em;height:.075em;background:#7cc4ff;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;transition:opacity .2s ease;}
.mi-shades{position:absolute;left:-.015em;right:-.015em;top:.045em;height:.1em;background:#0b2b45;border-radius:3px;opacity:0;transition:opacity .2s ease;}

.mi-ball.exp-happy .mi-eye{background:transparent;border-top:.03em solid #0b2b45;border-radius:99px 99px 0 0;height:.07em;}
.mi-ball.exp-happy .mi-mouth{width:.22em;height:.11em;border:.028em solid #0b2b45;border-top:none;border-radius:0 0 99px 99px;}
.mi-ball.exp-laugh .mi-eye{background:transparent;border-top:.03em solid #0b2b45;border-radius:99px 99px 0 0;height:.075em;}
.mi-ball.exp-laugh .mi-mouth{width:.24em;height:.13em;border:.028em solid #0b2b45;border-top:none;border-radius:0 0 99px 99px;background:#7a2233;}
.mi-ball.exp-laugh .mi-blush{opacity:1;}
.mi-ball.exp-surprised .mi-eye{width:.1em;height:.145em;}
.mi-ball.exp-surprised .mi-mouth{width:.09em;height:.09em;border:.028em solid #0b2b45;border-radius:99px;}
.mi-ball.exp-wink .mi-eye-l{height:.022em;}
.mi-ball.exp-wink .mi-mouth{width:.13em;height:.06em;transform:translateX(-50%) rotate(-10deg);}
.mi-ball.exp-sleepy .mi-eye{height:.032em;}
.mi-ball.exp-sleepy .mi-mouth{width:.07em;height:.04em;border-bottom:.022em solid #0b2b45;}
.mi-ball.exp-sly .mi-eye-l{transform:translateX(.022em);}
.mi-ball.exp-sly .mi-eye-r{transform:translateX(-.022em);}
.mi-ball.exp-sly .mi-mouth{width:.12em;height:.06em;transform:translateX(-50%) rotate(9deg);}
.mi-ball.exp-sad .mi-brow{opacity:1;}
.mi-ball.exp-sad .mi-brow-l{transform:rotate(18deg);}
.mi-ball.exp-sad .mi-brow-r{transform:rotate(-18deg);}
.mi-ball.exp-sad .mi-mouth{width:.12em;height:.055em;border-top:.026em solid #0b2b45;border-bottom:none;border-radius:99px 99px 0 0;}
.mi-ball.exp-angry .mi-brow{opacity:1;background:#c0392b;}
.mi-ball.exp-angry .mi-brow-l{transform:rotate(-22deg);}
.mi-ball.exp-angry .mi-brow-r{transform:rotate(22deg);}
.mi-ball.exp-angry .mi-eye{height:.1em;background:#7a1d1d;}
.mi-ball.exp-angry .mi-mouth{width:.12em;height:.05em;border-bottom:.03em solid #7a1d1d;}
.mi-ball.exp-love .mi-eye{width:.075em;height:.075em;background:#e8486f;border-radius:0;transform:rotate(45deg);}
.mi-ball.exp-love .mi-eye::before,.mi-ball.exp-love .mi-eye::after{content:'';position:absolute;width:.075em;height:.075em;border-radius:50%;background:#e8486f;}
.mi-ball.exp-love .mi-eye::before{left:-.038em;top:0;}
.mi-ball.exp-love .mi-eye::after{left:0;top:-.038em;}
.mi-ball.exp-love .mi-mouth{width:.1em;height:.09em;border:.026em solid #e8486f;border-top:none;border-radius:0 0 99px 99px;}
.mi-ball.exp-love .mi-blush{opacity:1;}
.mi-ball.exp-cool .mi-shades{opacity:1;}
.mi-ball.exp-cool .mi-eye{opacity:0;}
.mi-ball.exp-cool .mi-mouth{width:.15em;height:.06em;transform:translateX(-50%) rotate(-6deg);}
.mi-ball.exp-confused .mi-eye-l{width:.09em;height:.13em;}
.mi-ball.exp-confused .mi-eye-r{width:.068em;height:.09em;}
.mi-ball.exp-confused .mi-brow{opacity:1;}
.mi-ball.exp-confused .mi-brow-l{transform:rotate(-14deg);}
.mi-ball.exp-confused .mi-mouth{width:.13em;height:.05em;transform:translateX(-50%) rotate(-8deg);}
.mi-ball.exp-shy .mi-eye{height:.05em;}
.mi-ball.exp-shy .mi-mouth{width:.08em;height:.055em;border:.024em solid #0b2b45;border-radius:99px;}
.mi-ball.exp-shy .mi-blush{opacity:1;background:rgba(255,110,140,.7);}
.mi-ball.exp-thinking .mi-eye{top:.025em;}
.mi-ball.exp-thinking .mi-eye-r{height:.1em;}
.mi-ball.exp-thinking .mi-mouth{width:.06em;height:.06em;border:.026em solid #0b2b45;border-radius:99px;transform:translateX(60%);}
.mi-ball.exp-cry .mi-eye{height:.03em;}

const pad = n => String(n).padStart(2,'0');
const WEEK = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
const weekText = () => WEEK[new Date().getDay()];
const timeText = () => { const d=new Date(); return `现在是 ${pad(d.getHours())}:${pad(d.getMinutes())}（${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日 ${weekText()}）`; };

/* Toast */
let toastTimer = null;
function showToast(msg){

/* ============================================================
   存储层
   ============================================================ */
const STORE_KEY = 'miqiu_conversations_v3';
const store = { conversations: [], currentId: null };

function uid(){ return 'c_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7); }

function serializeStore(){
  return {
    currentId: store.currentId,
    conversations: store.conversations.map(c=>({
      id: c.id,
      title: c.title,
      createdAt: c.createdAt,
      updatedAt: c.updatedAt,
      messages: c.messages.map(m=>({
        role: m.role,
        text: m.text,
        link: m.link || null,
        tag: m.tag || null,
        time: m.time || Date.now()
      }))
    }))
  };
}

function loadStore(){
  let raw = null;
  try{ raw = localStorage.getItem(STORE_KEY); }catch(e){}
  if(!raw){
    try{ raw = localStorage.getItem('miqiu_conversations_v2'); }catch(e){}
  }
  if(!raw) return false;
  try{
    const d = JSON.parse(raw);
    if(d && Array.isArray(d.conversations)){
      store.conversations = d.conversations.map(c=>({
        id: c.id,
        title: c.title || '新对话',
        createdAt: c.createdAt || Date.now(),
        updatedAt: c.updatedAt || Date.now(),
        messages: (c.messages || []).map(m=>({
          role: m.role,
          text: m.text,
          link: m.link || null,
          tag: m.tag || null,
          time: m.time || Date.now()
        }))
      }));
      store.currentId = d.currentId || (store.conversations[0] && store.conversations[0].id) || null;
      return true;
    }
  }catch(e){}
  return false;
}

function saveStore(){
  try{
    localStorage.setItem(STORE_KEY, JSON.stringify(serializeStore()));
    try{ localStorage.removeItem('miqiu_conversations_v2'); }catch(e){}
  }catch(e){
    console.warn('保存失败', e);
    showToast('保存失败，可能是存储空间已满');
  }
}

function getCurrentConv(){
  return store.conversations.find(c => c.id === store.currentId) || null;
}

function createConversation(silent){
  const conv = {
    id: uid(),
    title: '新对话',
    createdAt: Date.now(),
    updatedAt: Date.now(),
    messages: []
  };
  store.conversations.unshift(conv);
  store.currentId = conv.id;
  saveStore();
  if(!silent) renderSidebarList();
  return conv;
}

function deleteConversation(id){
  const idx = store.conversations.findIndex(c => c.id === id);
  if(idx < 0) return;
  const conv = store.conversations[idx];
  if(conv.messages.length > 0){
    if(!confirm('删除这个对话？里面的 ' + conv.messages.length + ' 条消息将一并消失。')) return;
  }
  store.conversations.splice(idx, 1);
  if(store.currentId === id){
    if(store.conversations.length > 0){
      store.currentId = store.conversations[0].id;
    }else{
      createConversation(true);
    }
  }
  saveStore();
  renderSidebarList();
  renderCurrentConversation();
}

function switchConversation(id){
  if(store.currentId === id) return;
  store.currentId = id;
  saveStore();
  renderSidebarList();
  renderCurrentConversation();
  if(window.innerWidth <= 860) closeSidebar();
}

function renameConversation(conv, newTitle){
  const t = String(newTitle).trim();
  if(!t || t === conv.title) return;
  conv.title = t.slice(0, 40);
  conv.updatedAt = Date.now();
  saveStore();
  renderSidebarList();
  if(conv.id === store.currentId){
    convTitle.textContent = conv.title;
  }
}

window.addEventListener('beforeunload', ()=>{ saveStore(); });

/* ============================================================

   ============================================================ */
function chineseRatio(s){
  if(!s) return 0;
  const m = String(s).match(/[\u4e00-\u9fa5]/g);
  const zh = m ? m.length : 0;
  const visible = String(s).replace(/\s/g,'').length;
  return visible ? zh / visible : 0;
}
function englishRatio(s){
  if(!s) return 0;
  const m = String(s).match(/[a-zA-Z]/g);
  const en = m ? m.length : 0;
  const visible = String(s).replace(/\s/g,'').length;
  return visible ? en / visible : 0;
}
function isEnglishQuestion(q){
  return englishRatio(q) >= 0.5 && chineseRatio(q) < 0.15;
}
function isAcceptable(text, requireChinese){
  if(!text) return false;
  if(!requireChinese) return true;
  const letters = String(text).match(/[a-zA-Z]/g);
  if(!letters) return true;
  return chineseRatio(text) >= 0.15;
}

document.addEventListener('mousemove', e=>{

  rafPending=true;
  requestAnimationFrame(()=>{
    rafPending=false;
    const ev=lastEvt; if(!ev) return;
    document.documentElement.style.setProperty('--mx', ev.clientX+'px');
    document.documentElement.style.setProperty('--my', ev.clientY+'px');
    document.body.classList.add('hovering');
    const t = ev.target && ev.target.closest ? ev.target.closest('.hover-tint') : null;
    if(t){
      const r=t.getBoundingClientRect();
      if(r.width && r.height){
        t.style.setProperty('--x', Math.max(0,Math.min(1,(ev.clientX-r.left)/r.width))*100+'%');

    }
  });

function matchQA(c){
  let best=null, bestScore=0;
  for(let i=0;i<QA.length;i++){
    const item=QA[i];
    let s=0;
    for(let j=0;j<item.k.length;j++){
      const k=item.k[j];
      if(k && c.indexOf(k)!==-1) s += k.length;
    }
    if(s>bestScore){ bestScore=s; best=item; }
  }
  return { item:best, score:bestScore };
}

function zhWeather(desc){
  if(!desc) return '未知';
  const s = String(desc).trim();
  if(WEATHER_ZH[s]) return WEATHER_ZH[s];
  const low = s.toLowerCase();
  if(low.includes('thunder')) return '雷阵雨';
  if(low.includes('heavy rain')) return '大雨';
  if(low.includes('moderate rain')) return '中雨';
  if(low.includes('light rain')) return '小雨';
  if(low.includes('rain')) return '有雨';
  if(low.includes('heavy snow')) return '大雪';
  if(low.includes('light snow')) return '小雪';
  if(low.includes('snow')) return '有雪';
  if(low.includes('sleet')) return '雨夹雪';
  if(low.includes('drizzle')) return '毛毛雨';
  if(low.includes('fog')) return '雾';
  if(low.includes('haze')) return '霾';
  if(low.includes('overcast')) return '阴';
  if(low.includes('cloud')) return '多云';
  if(low.includes('sun') || low.includes('clear')) return '晴';
  return s;
}

   联网搜索
   ============================================================ */
function fetchT(url, opts, ms){
  const ctrl = new AbortController();
  const t = setTimeout(()=>ctrl.abort(), ms);
  return fetch(url, Object.assign({}, opts, {signal:ctrl.signal})).finally(()=>clearTimeout(t));
}

async function tryWeather(city){
  try{
    const url = `https://wttr.in/${encodeURIComponent(city)}?format=j1&lang=zh`;
    const res = await fetchT(url, {headers:{'Accept':'application/json'}}, 8000);
    if(!res.ok) return null;
    const data = await res.json();
    const cc = data.current_condition && data.current_condition[0];
    if(!cc) return null;
    let desc = '';
    if(cc.lang_zh && cc.lang_zh[0] && cc.lang_zh[0].value) desc = cc.lang_zh[0].value;
    else if(cc.weatherDesc && cc.weatherDesc[0] && cc.weatherDesc[0].value) desc = zhWeather(cc.weatherDesc[0].value);
    else desc = '未知';
    const area = data.nearest_area && data.nearest_area[0];
    const place = [area&&area.areaName&&area.areaName[0]&&area.areaName[0].value,
                   area&&area.region&&area.region[0]&&area.region[0].value].filter(Boolean).join(' · ') || city;
    return {
      text:`🌤️ ${place} 当前天气\n${desc}，气温 ${cc.temp_C}°C（体感 ${cc.FeelsLikeC}°C）\n湿度 ${cc.humidity}% · 风速 ${cc.windspeedKmph} km/h`,
      src:'天气'
    };
  }catch(e){ return null; }
}

async function tryDDG(q, requireChinese){
  try{
    const url = `https://api.duckduckgo.com/?q=${encodeURIComponent(q)}&format=json&no_html=1&skip_disambig=1&kl=cn-zh`;
    const res = await fetchT(url, {}, 8000);
    if(!res.ok) return null;
    const d = await res.json();
    const candidates = [];
    if(d.Answer) candidates.push({ text:d.Answer, url:null });
    if(d.AbstractText) candidates.push({ text:d.AbstractText, url:d.AbstractURL||null });
    if(d.Definition) candidates.push({ text:d.Definition, url:null });
    const rel = (d.RelatedTopics||[]).find(t=>t && t.Text);
    if(rel) candidates.push({ text:rel.Text, url:rel.FirstURL||null });
    for(const c of candidates){
      if(isAcceptable(c.text, requireChinese)) return { text:`🔎 ${c.text}`, url:c.url, src:'联网' };
    }
    return null;
  }catch(e){ return null; }
}

async function tryTavily(q, requireChinese){
  try{
    const res = await fetchT('https://api.tavily.com/search', {
      method:'POST',
      headers:{'Content-Type':'application/json','X-Tavily-Access-Mode':'keyless'},
      body: JSON.stringify({query:q, max_results:5, include_answer:true, search_depth:'basic'})
    }, 8000);
    if(!res.ok) return null;
    const d = await res.json();
    if(d.answer && isAcceptable(d.answer, requireChinese)){
      return { text:`🔎 ${String(d.answer).trim()}`, url:(d.results&&d.results[0]&&d.results[0].url)||null, src:'联网' };
    }
    const results = d.results || [];
    for(const r of results){
      if(r.content && isAcceptable(r.content, requireChinese)){
        const s = r.content.length>320 ? r.content.slice(0,320)+'…' : r.content;
        return { text:`🔎 ${s}`, url:r.url||null, src:'联网' };
      }
    }
    return null;
  }catch(e){ return null; }
}

function searchAll(q, city, requireChinese){
  return new Promise(resolve=>{
    let done=false;
    const finish = v => { if(!done){ done=true; clearTimeout(timer); resolve(v); } };
    const timer = setTimeout(()=>finish(null), 30000);
    (async ()=>{
      try{
        if(city){
          const w = await tryWeather(city);
          if(w) return finish(w);
        }
        const d = await tryDDG(q, requireChinese);
        if(d) return finish(d);
        const t = await tryTavily(q, requireChinese);
        if(t) return finish(t);
      }catch(e){}
      finish(null);
    })();
  });
}

function tryMath(raw){
  let s = String(raw).replace(/\s/g,'')
    .replace(/[×✕✖]/g,'*').replace(/[÷]/g,'/')
    .replace(/（/g,'(').replace(/）/g,')')
    .replace(/[，。？！、,.?!]/g,'');
  s = s.replace(/(等于多少|等于几|等于|是多少|是几|计算|算一下|帮我算|请问|求)/g,'');
  if(!s) return null;
  let m = s.match(/^(\d+(?:\.\d+)?)(?:的)?(平方|立方|二次方|三次方)$/);
  if(m){ const n=parseFloat(m[1]); const p=(m[2]==='平方'||m[2]==='二次方')?2:3; return {expr:`${m[1]}${m[2]}`, val:Math.pow(n,p)}; }
  m = s.match(/^(?:根号|√)(\d+(?:\.\d+)?)$/);
  if(m) return {expr:`√${m[1]}`, val:Math.sqrt(parseFloat(m[1]))};
  m = s.match(/^(\d+(?:\.\d+)?)%(?:的)?(\d+(?:\.\d+)?)$/);
  if(m) return {expr:`${m[1]}% × ${m[2]}`, val:parseFloat(m[1])/100*parseFloat(m[2])};
  m = s.match(/^(\d+(?:\.\d+)?)的(\d+(?:\.\d+)?)%$/);
  if(m) return {expr:`${m[1]} × ${m[2]}%`, val:parseFloat(m[1])*parseFloat(m[2])/100};
  if(/^[\d+\-*/().%]+$/.test(s) && /[+\-*/%]/.test(s)){
    try{ const v = Function('"use strict";return('+s+')')(); if(typeof v==='number' && isFinite(v)) return {expr:s, val:v}; }catch(e){}
  }
  return null;
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }catch(e){ return false; }
}

function buildActions(convId, msgIdx, msg){

  copyBtn.type = 'button';
  copyBtn.title = '复制';

    regenBtn.type = 'button';
    regenBtn.title = '重新生成';
    regenBtn.textContent = '↻';
    regenBtn.disabled = !!msg._generating;
    regenBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      regenerateMessage(convId, msgIdx);
    });

  }

  const delBtn = document.createElement('button');
  delBtn.className = 'msg-act danger';
  delBtn.type = 'button';
  delBtn.title = '删除';
  delBtn.textContent = '✕';
  delBtn.addEventListener('click', (e)=>{
    e.stopPropagation();
    if(confirm('删除这条消息？')) deleteMessage(convId, msgIdx);
  });
  box.appendChild(delBtn);

  return box;
}

function renderMessage(msg, convId, msgIdx, animate){
  const role = msg.role;
  const el = document.createElement('div');
  el.className = 'msg ' + role;

  if(role === 'bot') el.appendChild(ballEl(24, true));

  const wrapEl = document.createElement('div');
  wrapEl.className = 'msg-wrap';

  if(msg._generating){
    el.classList.add('typing');
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = '<span class="dot"></span><span class="dot"></span><span class="dot"></span>';
    wrapEl.appendChild(b);
  }else{
    const b = document.createElement('div');
    b.className = 'bubble hover-tint';
    b.textContent = msg.text;
    if(msg.tag){
      const t = document.createElement('span');
      t.className = 'tag';
      t.textContent = msg.tag;
      b.appendChild(t);
    }
    if(msg.link){
      const a = document.createElement('a');
      a.className = 'search-link';
      a.href = msg.link.url; a.target='_blank'; a.rel='noopener noreferrer';
      a.textContent = msg.link.label;
      b.appendChild(document.createElement('br'));
      b.appendChild(a);
    }
    wrapEl.appendChild(b);
  }

  el.appendChild(wrapEl);

  if(!msg._generating){
    el.appendChild(buildActions(convId, msgIdx, msg));
  }

  chat.appendChild(el);

  if(animate){
    requestAnimationFrame(()=>el.classList.add('in'));
  }else{
    el.classList.add('in');
  }

  return el;
}

function renderCurrentConversation(){
  const prevScroll = chat.scrollTop;
  const prevHeight = chat.scrollHeight;
  const wasAtBottom = (prevHeight - prevScroll - chat.clientHeight) < 40;

  chat.innerHTML = '';
  const conv = getCurrentConv();
  if(!conv){ convTitle.textContent = '米遇安 · 智能助手'; return; }

  convTitle.textContent = conv.title === '新对话' ? '米遇安 · 智能助手' : conv.title;

  if(conv.messages.length === 0){
    const hint = document.createElement('div');
    hint.className = 'empty-hint';
    hint.innerHTML = '<div class="big">💬</div><div>这是一个新的对话<br>在下方输入框开始聊天吧</div>';
    chat.appendChild(hint);
    return;
  }

  conv.messages.forEach((msg, idx)=>{
    renderMessage(msg, conv.id, idx, false);
  });

  if(wasAtBottom){
    requestAnimationFrame(scrollBottom);
  }else{
    chat.scrollTop = prevScroll;
  }
}

function pushMessage(role, text, link, tag){
  let conv = getCurrentConv();
  if(!conv) conv = createConversation(true);

  const msg = { role, text, link: link || null, tag: tag || null, time: Date.now() };
  conv.messages.push(msg);
  conv.updatedAt = Date.now();

  if(role === 'user' && conv.title === '新对话'){
    const t = text.replace(/\s+/g,' ').trim();
    conv.title = t.length > 18 ? t.slice(0,18) + '…' : (t || '新对话');
  }

  saveStore();
  renderSidebarList();
  return { conv, msg, idx: conv.messages.length - 1 };
}

function deleteMessage(convId, msgIdx){
  const conv = store.conversations.find(c => c.id === convId);
  if(!conv) return;
  if(msgIdx < 0 || msgIdx >= conv.messages.length) return;
  conv.messages.splice(msgIdx, 1);
  conv.updatedAt = Date.now();
  if(conv.messages.length === 0) conv.title = '新对话';
  saveStore();
  renderSidebarList();
  if(convId === store.currentId){
    renderCurrentConversation();
  }
  showToast('已删除');
}

async function regenerateMessage(convId, msgIdx){
  if(state.busy) return;
  const conv = store.conversations.find(c => c.id === convId);
  if(!conv) return;
  const msg = conv.messages[msgIdx];
  if(!msg || msg.role !== 'bot') return;
  if(msg._generating) return;

  let userText = null;
  for(let i = msgIdx - 1; i >= 0; i--){
    if(conv.messages[i].role === 'user'){
      userText = conv.messages[i].text;
      break;
    }
  }
  if(!userText){
    showToast('找不到对应的问题');
    return;
  }

  state.busy = true;
  sendBtn.disabled = true;
  talk();

  const backup = { text: msg.text, link: msg.link, tag: msg.tag };
  msg._generating = true;
  renderCurrentConversation();

  try{
    const res = await respond(userText, null);
    msg.text = res.text;
    msg.link = res.link || null;
    msg.tag = res.tag || null;
    msg.time = Date.now();
    delete msg._generating;
    conv.updatedAt = Date.now();
    saveStore();
    renderSidebarList();
    renderCurrentConversation();
    if(res.follow) setChips(res.follow);
    talk();
  }catch(e){
    msg.text = backup.text;
    msg.link = backup.link;
    msg.tag = backup.tag;
    delete msg._generating;
    saveStore();
    renderCurrentConversation();
    showToast('重新生成失败');
  }finally{
    state.busy = false;
    sendBtn.disabled = false;
  }
}

/* ============================================================
   对话列表
   ============================================================ */
function fmtTime(ts){
  const d = new Date(ts);
  const now = new Date();
  const sameDay = d.getFullYear()===now.getFullYear() && d.getMonth()===now.getMonth() && d.getDate()===now.getDate();
  if(sameDay) return pad(d.getHours()) + ':' + pad(d.getMinutes());
  const diff = (now - d) / 86400000;
  if(diff < 7){
    return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
  }
  return (d.getMonth()+1) + '/' + d.getDate();
}

function startRename(conv, titleEl){
  if(titleEl.querySelector('input')) return;
  const oldTitle = conv.title;
  const inp = document.createElement('input');
  inp.type = 'text';
  inp.className = 'conv-rename-input';
  inp.value = oldTitle;
  inp.maxLength = 40;

  titleEl.textContent = '';
  titleEl.appendChild(inp);
  inp.focus();
  inp.select();

  let finished = false;
  const finish = (save)=>{
    if(finished) return;
    finished = true;
    const nv = inp.value.trim();
    if(save && nv && nv !== oldTitle){
      renameConversation(conv, nv);
    }else{
      renderSidebarList();
    }
  };

  inp.addEventListener('click', e=>e.stopPropagation());
  inp.addEventListener('mousedown', e=>e.stopPropagation());
  inp.addEventListener('keydown', (e)=>{
    if(e.key === 'Enter'){ e.preventDefault(); inp.blur(); }
    else if(e.key === 'Escape'){ e.preventDefault(); inp.value = oldTitle; inp.blur(); }
  });
  inp.addEventListener('blur', ()=> finish(true));
}

function renderSidebarList(){
  convList.innerHTML = '';
  const list = store.conversations.slice().sort((a,b)=> b.updatedAt - a.updatedAt);

  if(list.length === 0){
    const e = document.createElement('div');
    e.className = 'empty-conv';
    e.textContent = '还没有对话，点下方按钮新建';
    convList.appendChild(e);
    return;
  }

  list.forEach(conv=>{
    const item = document.createElement('div');
    item.className = 'conv-item' + (conv.id === store.currentId ? ' active' : '');
    item.dataset.id = conv.id;

    const body = document.createElement('div');
    body.className = 'conv-item-body';

    const title = document.createElement('div');
    title.className = 'conv-item-title';
    title.textContent = conv.title || '新对话';

    const meta = document.createElement('div');
    meta.className = 'conv-item-meta';
    meta.textContent = (conv.messages.length || 0) + ' 条 · ' + fmtTime(conv.updatedAt);

    body.appendChild(title);
    body.appendChild(meta);

    const actions = document.createElement('div');
    actions.className = 'conv-actions';

    const renameBtn = document.createElement('button');
    renameBtn.className = 'conv-act';
    renameBtn.type = 'button';
    renameBtn.title = '重命名';
    renameBtn.textContent = '✎';
    renameBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      startRename(conv, title);
    });

    const delBtn = document.createElement('button');
    delBtn.className = 'conv-act danger';
    delBtn.type = 'button';
    delBtn.title = '删除对话';
    delBtn.textContent = '🗑';
    delBtn.addEventListener('click', (e)=>{
      e.stopPropagation();
      deleteConversation(conv.id);
    });

    actions.appendChild(renameBtn);
    actions.appendChild(delBtn);

    item.appendChild(body);
    item.appendChild(actions);

    title.addEventListener('dblclick', (e)=>{
      e.stopPropagation();
      startRename(conv, title);
    });

    item.addEventListener('click', ()=> switchConversation(conv.id));

    convList.appendChild(item);
  });
}

/* 桌面/移动切换时清理抽屉状态 */
const mqDesktop = window.matchMedia('(min-width: 861px)');
function handleLayoutChange(){

/* ============================================================
   快捷
   ============================================================ */
const DEFAULT_CHIPS = ['你是谁','米遇安第十二次会议','今天上海天气','米遇安有哪些游戏','讲个笑话'];
function setChips(list){
  chipsEl.innerHTML='';
  (list&&list.length?list:DEFAULT_CHIPS).forEach(t=>{
    const b=document.createElement('button');
    b.className='chip hover-tint';
    b.type='button';
    b.textContent=t;
    b.addEventListener('click', ()=>{ input.value=t; send(); });
    chipsEl.appendChild(b);
  });
}

/* ============================================================
   核心 respond
   ============================================================ */
async function respond(raw, typingEl){
  const q = raw.trim();
  const c = norm(q);
  if(!q) return { text:'说点什么吧～' };

  if(/(几点了|现在几点|现在时间|当前时间|什么时间|报时)/.test(c) || c==='几点')
    return { text: timeText(), follow:['今天几号','今天星期几'] };
  if(/(今天.*(几号|日期)|今天几号|今天日期|什么日期|几月几号)/.test(c))
    return { text: dateText(), follow:['现在几点','今天星期几'] };
  if(/(星期几|周几)/.test(c)) return { text:'今天是 '+weekText()+'。', follow:['今天几号','现在几点'] };
  if(/(哪一年|今年是几年|年份|今年几几年)/.test(c))
    return { text:'今年是 '+new Date().getFullYear()+' 年。' };

  const math = tryMath(q);
  if(math) return { text:`🧮 ${math.expr} = ${fmt(math.val)}`, follow:['再算一个','现在几点'] };

  const requireChinese = !isEnglishQuestion(q);
  const m = matchQA(c);

  if(m.item && (m.item.t === 'm' || m.item.t === 's') && m.score >= 2){
    return {
      text: m.item.a,
      follow: m.item.follow,
      tag: m.item.t === 'm' ? '米遇安' : '预设'
    };
  }
  if(m.item && m.item.t === 'g' && m.score >= 5){
    return { text: m.item.a, follow: m.item.follow, tag:'预设' };
  }

  let city = null;
  if(/(天气|气温|温度|下雨|下雨吗|冷吗|热吗|刮风)/.test(c)){
    const mm = q.match(/(?:今天|明天|现在)?\s*([\u4e00-\u9fa5]{2,10}?)(?:的)?(?:天气|气温|温度)/) ||
               q.match(/(?:天气|气温|温度)\s*(?:在|是)?\s*([\u4e00-\u9fa5]{2,10})/);
    city = mm ? mm[1] : null;
    if(city) city = city.replace(/^(今天|明天|现在|请问)/,'').trim();
    if(!city) city = 'Shanghai';
  }

  if(typingEl) setTyping(typingEl, '🔍 正在搜索…');
  const net = await searchAll(q, city, requireChinese);
  if(net){
    return {
      text: net.text,
      link: net.url ? { url:net.url, label:'🔗 来源' } : null,
      tag: net.src || '联网',
      follow: ['今天上海天气','现在几点']
    };
  }

  if(typingEl) setTyping(typingEl, '💭 正在整理…');
  if(m.item && m.score >= 2){
    return {
      text: m.item.a,
      tag: m.item.t === 'm' ? '米遇安' : '预设',
      follow: m.item.follow
    };
  }

  return {
    text:'这个问题我暂时没找到合适的中文答案 🤔\n你可以点下面用 Bing 搜一下 ——',
    link:{ url:'https://www.bing.com/search?q='+encodeURIComponent(q), label:'🔍 搜索「'+q+'」' }
  };
}

function setTyping(el, text){
  const t = el.querySelector('.ttext');
  if(t) t.textContent = text;
}

/* ============================================================
   发送
   ============================================================ */
async function send(){
  if(state.busy) return;
  const text = input.value.trim();
  if(!text) return;

  state.busy = true;
  sendBtn.disabled = true;
  input.value = '';
  talk();

  const userRec = pushMessage('user', text, null, null);
  renderMessage(userRec.msg, userRec.conv.id, userRec.idx, true);

  const typing = document.createElement('div');
  typing.className = 'msg bot typing';
  typing.appendChild(ballEl(24, true));
  const tw = document.createElement('div');
  tw.className = 'msg-wrap';
  const tb = document.createElement('div');
  tb.className = 'bubble';
  tb.innerHTML = '<span class="ttext">…</span><span class="dot"></span><span class="dot"></span><span class="dot"></span>';
  tw.appendChild(tb);
  typing.appendChild(tw);
  chat.appendChild(typing);
  requestAnimationFrame(()=>typing.classList.add('in'));
  scrollBottom();

  try{
    const res = await respond(text, typing);
    typing.remove();
    const botRec = pushMessage('bot', res.text, res.link, res.tag);
    renderMessage(botRec.msg, botRec.conv.id, botRec.idx, true);
    talk();
    if(res.follow) setChips(res.follow);
    scrollBottom();
  }catch(e){
    typing.remove();
    const botRec = pushMessage('bot', '出了点小问题，你再试一次？或者换个说法。', null, null);
    renderMessage(botRec.msg, botRec.conv.id, botRec.idx, true);
  }finally{
    state.busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

const themeBtn=$('themeBtn'), themeIcon=$('themeIcon');

const ICON_SUN='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>';
function applyTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  themeIcon.innerHTML = dark ? ICON_SUN : ICON_MOON;
  try{ localStorage.setItem('miqiu-theme', dark?'dark':'light'); }catch(e){}
}
(function(){
  let s=null; try{ s=localStorage.getItem('miqiu-theme'); }catch(e){}
  if(s) applyTheme(s==='dark');
  else applyTheme(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
})();
themeBtn.addEventListener('click', ()=>applyTheme(!document.documentElement.classList.contains('dark')));

$('clearBtn').addEventListener('click', ()=>{
  const conv = getCurrentConv();
  if(!conv) return;
  if(conv.messages.length === 0) return;
  if(!confirm('清空当前对话的所有消息？')) return;
  conv.messages = [];
  conv.title = '新对话';
  conv.updatedAt = Date.now();
  saveStore();
  renderSidebarList();
  renderCurrentConversation();
  showToast('已清空');
});

}

})();
