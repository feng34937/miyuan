<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>联合日报</title>
    <!-- Google Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0,1" />
    <style>
        /* ===== CSS 变量 – 深红主题 ===== */
        :root {
            --bg-primary: #f8f6f4;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-header: #1a0c0a;
            --bg-sidebar: #f0ecea;
            --text-primary: #1a0c0a;
            --text-secondary: #4a3a3a;
            --text-muted: #8a7a7a;
            --text-white: #ffffff;
            --border-color: #e0d6d2;
            --shadow-sm: 0 2px 8px rgba(80, 20, 20, 0.08);
            --shadow-md: 0 8px 24px rgba(80, 20, 20, 0.12);
            --shadow-lg: 0 16px 48px rgba(80, 20, 20, 0.18);
            --radius: 16px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --accent: #b22222;          /* 深红主色 */
            --accent-hover: #8b1a1a;
            --accent-light: rgba(178, 34, 34, 0.12);
            --tag-bg: #ede8e4;
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-primary: #12100e;
                --bg-secondary: #1e1816;
                --bg-card: #261f1c;
                --bg-header: #0d0807;
                --bg-sidebar: #181210;
                --text-primary: #f0e8e4;
                --text-secondary: #c0b0aa;
                --text-muted: #8a7a74;
                --text-white: #f0e8e4;
                --border-color: #3a2e2a;
                --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.5);
                --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.6);
                --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.7);
                --tag-bg: #2a221e;
                --accent-light: rgba(178, 34, 34, 0.25);
            }
        }

        *,
        *::before,
        *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            transition: background var(--transition), color var(--transition);
            padding-top: 68px;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--text-muted);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .app-header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: var(--bg-header);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 0 24px;
            height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(178, 34, 34, 0.3);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.4);
        }

        .app-header .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            color: #f0e8e4;
            font-weight: 700;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
            text-decoration: none;
            user-select: none;
        }
        .app-header .logo span {
            font-size: 1.6rem;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .header-actions .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 40px;
            padding: 0 16px;
            transition: background var(--transition), box-shadow var(--transition);
            border: 1px solid transparent;
        }
        .header-actions .search-box:focus-within {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(178, 34, 34, 0.3);
        }
        .header-actions .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: #f0e8e4;
            padding: 10px 6px;
            font-size: 0.9rem;
            width: 160px;
            font-family: var(--font-sans);
        }
        .header-actions .search-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .header-actions .search-box .material-symbols-outlined {
            color: rgba(255, 255, 255, 0.6);
            font-size: 1.3rem;
        }

        .header-actions .theme-toggle {
            background: rgba(255, 255, 255, 0.08);
            border: none;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #f0e8e4;
            font-size: 1.3rem;
            transition: background var(--transition);
        }
        .header-actions .theme-toggle:hover {
            background: rgba(178, 34, 34, 0.3);
        }

        .app-main {
            max-width: 1320px;
            margin: 0 auto;
            padding: 24px 24px 60px;
            display: grid;
            grid-template-columns: 220px 1fr;
            gap: 32px;
        }

        .sidebar {
            position: sticky;
            top: 92px;
            align-self: start;
            background: var(--bg-secondary);
            border-radius: var(--radius);
            padding: 20px 12px;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: background var(--transition), border var(--transition);
        }
        .sidebar .section-title {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-muted);
            font-weight: 600;
            padding: 0 12px 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 12px;
        }
        .sidebar .category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar .category-list li {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            font-weight: 500;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
        }
        .sidebar .category-list li .material-symbols-outlined {
            font-size: 1.3rem;
            color: var(--text-muted);
            transition: color var(--transition);
        }
        .sidebar .category-list li:hover {
            background: var(--accent-light);
            color: var(--accent);
        }
        .sidebar .category-list li:hover .material-symbols-outlined {
            color: var(--accent);
        }
        .sidebar .category-list li.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(178, 34, 34, 0.3);
        }
        .sidebar .category-list li.active .material-symbols-outlined {
            color: #fff;
        }
        .sidebar .category-list li .count {
            margin-left: auto;
            background: var(--tag-bg);
            padding: 0 10px;
            border-radius: 30px;
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
        }
        .sidebar .category-list li.active .count {
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
        }

        .content {
            display: flex;
            flex-direction: column;
            gap: 28px;
        }

        .content-header {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .content-header h1 {
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-primary);
        }
        .content-header h1 small {
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 0;
        }
        .content-header .update-time {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: var(--bg-secondary);
            padding: 6px 16px;
            border-radius: 40px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .content-header .update-time .material-symbols-outlined {
            color: var(--accent);
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
        }

        .news-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border-color);
            transition: all var(--transition);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }
        .news-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent);
        }
        .news-card .card-image {
            width: 100%;
            height: 180px;
            background: var(--bg-sidebar);
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }
        .news-card .card-image img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition);
        }
        .news-card:hover .card-image img {
            transform: scale(1.03);
        }
        .news-card .card-image .category-tag {
            position: absolute;
            top: 12px;
            left: 12px;
            background: var(--accent);
            color: #fff;
            font-size: 0.65rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.4px;
            text-transform: uppercase;
            backdrop-filter: blur(4px);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }
        .news-card .card-body {
            padding: 18px 20px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .news-card .card-body .title {
            font-size: 1.05rem;
            font-weight: 600;
            line-height: 1.4;
            color: var(--text-primary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .news-card .card-body .summary {
            font-size: 0.88rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-top: 2px;
            flex: 1;
        }
        .news-card .card-footer {
            padding: 10px 20px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.78rem;
            color: var(--text-muted);
        }
        .news-card .card-footer .source {
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 500;
        }
        .news-card .card-footer .source .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }
        .news-card .card-footer .time {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .news-card .card-footer .time .material-symbols-outlined {
            font-size: 1rem;
        }

        .load-more-wrap {
            display: flex;
            justify-content: center;
            margin-top: 12px;
        }
        .load-more-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 12px 40px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-sans);
        }
        .load-more-btn:hover {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            box-shadow: 0 8px 24px rgba(178, 34, 34, 0.25);
        }
        .load-more-btn .material-symbols-outlined {
            font-size: 1.2rem;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
        .empty-state .material-symbols-outlined {
            font-size: 3.6rem;
            margin-bottom: 16px;
            opacity: 0.4;
        }
        .empty-state h3 {
            font-size: 1.2rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .loader {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--accent);
            border-radius: 50%;
            width: 36px;
            height: 36px;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 1024px) {
            .app-main {
                grid-template-columns: 1fr;
                padding: 16px;
            }
            .sidebar {
                position: relative;
                top: 0;
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                padding: 16px 18px;
            }
            .sidebar .section-title {
                display: none;
            }
            .sidebar .category-list {
                flex-direction: row;
                flex-wrap: wrap;
                gap: 6px;
            }
            .sidebar .category-list li {
                padding: 6px 16px;
                border-radius: 40px;
                font-size: 0.8rem;
                background: var(--tag-bg);
            }
            .sidebar .category-list li .count {
                display: none;
            }
            .sidebar .category-list li.active {
                background: var(--accent);
                color: #fff;
            }
        }

        @media (max-width: 640px) {
            body {
                padding-top: 60px;
            }
            .app-header {
                padding: 0 14px;
                height: 60px;
            }
            .app-header .logo {
                font-size: 1.0rem;
            }
            .header-actions .search-box input {
                width: 100px;
                font-size: 0.8rem;
                padding: 8px 4px;
            }
            .header-actions .search-box {
                padding: 0 10px;
            }
            .header-actions .theme-toggle {
                width: 34px;
                height: 34px;
                font-size: 1.1rem;
            }
            .app-main {
                padding: 12px;
                gap: 20px;
            }
            .news-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .content-header h1 {
                font-size: 1.2rem;
            }
            .content-header .update-time {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .news-card .card-image {
                height: 150px;
            }
            .news-card .card-body .title {
                font-size: 0.95rem;
            }
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <header class="app-header" role="banner">
        <a href="#" class="logo" aria-label="联合日报 首页">
            <span>📰</span> 联合日报
        </a>

        <div class="header-actions">
            <div class="search-box" role="search">
                <span class="material-symbols-outlined" aria-hidden="true">search</span>
                <input type="text" id="searchInput" placeholder="搜索新闻..." aria-label="搜索新闻" />
            </div>
            <button class="theme-toggle" id="themeToggle" aria-label="切换主题">
                <span class="material-symbols-outlined" id="themeIcon">dark_mode</span>
            </button>
        </div>
    </header>

    <!-- ===== 主内容 ===== -->
    <main class="app-main" role="main">

        <!-- 侧边栏分类 -->
        <aside class="sidebar" role="navigation" aria-label="新闻分类">
            <div class="section-title">📂 分类</div>
            <ul class="category-list" id="categoryList">
                <!-- 由 JS 动态生成 -->
            </ul>
        </aside>

        <!-- 内容区 -->
        <section class="content">
            <div class="content-header">
                <h1 id="categoryTitle">
                    全部新闻
                    <small id="newsCount">0 条</small>
                </h1>
                <div class="update-time">
                    <span class="material-symbols-outlined" aria-hidden="true">schedule</span>
                    <span id="updateTime">更新中...</span>
                </div>
            </div>

            <!-- 新闻网格 -->
            <div class="news-grid" id="newsGrid" role="list">
                <!-- 由 JS 渲染 -->
            </div>

            <!-- 加载更多 -->
            <div class="load-more-wrap">
                <button class="load-more-btn" id="loadMoreBtn">
                    <span class="material-symbols-outlined" aria-hidden="true">expand_more</span>
                    加载更多
                </button>
            </div>
        </section>

    </main>

    <script>
        // ============================================================
        //  新闻获取逻辑 — 从网络 RSS 聚合
        // ============================================================

        // ---- 辅助函数 ----
        function formatRelativeDate(dateStr) {
            try {
                const date = new Date(dateStr);
                if (isNaN(date.getTime())) return "最新";
                const now = new Date();
                const diff = Math.floor((now - date) / (1000 * 60 * 60 * 24));
                if (diff === 0) return "今日";
                if (diff === 1) return "昨日";
                if (diff < 7) return `${diff}天前`;
                return `${date.getMonth()+1}月${date.getDate()}日`;
            } catch(e) { return "近日"; }
        }

        function escapeHtml(str) {
            if(!str) return "";
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            });
        }

        // ---- 网络分类映射（新增“文化”） ----
        function mapCategory(netCat) {
            const map = {
                'technology': '科技',
                'sports': '体育',
                'international': '财经',
                'domestic': '财经',
                'culture': '文化',        // 独立为“文化”
                'education': '娱乐',      // 教育仍归入娱乐（可自行调整）
                'health': '娱乐'
            };
            return map[netCat] || '科技';
        }

        // ---- 分类图标 ----
        function getCategoryIcon(cat) {
            const icons = {
                '全部': 'dashboard',
                '科技': 'smartphone',
                '财经': 'trending_up',
                '体育': 'sports_basketball',
                '娱乐': 'movie',
                '文化': 'palette'          // 文化图标
            };
            return icons[cat] || 'label';
        }

        // ---- 网络获取函数 ----
        async function fetchNetworkNews() {
            const sources = [
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.theverge.com/rss/index.xml", category: "technology", limit: 10 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.wired.com/feed/rss", category: "technology", limit: 8 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.artnews.com/feed/", category: "culture", limit: 8 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.smithsonianmag.com/feed/", category: "culture", limit: 8 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.chronicle.com/rss/news", category: "education", limit: 12 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.edweek.org/rss/feed.xml", category: "education", limit: 10 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.insidehighered.com/rss.xml", category: "education", limit: 8 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.health.harvard.edu/feed", category: "health", limit: 12 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.medicalnewstoday.com/featured/feed", category: "health", limit: 10 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.webmd.com/rss.xml", category: "health", limit: 8 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.espn.com/espn/rss/news", category: "sports", limit: 10 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.bbc.com/sport/rss", category: "sports", limit: 8 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://feeds.bbci.co.uk/news/world/rss.xml", category: "international", limit: 12 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://www.reuters.com/rssFeed/topNews", category: "international", limit: 10 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://news.sina.com.cn/roll/rollnews_sudoku_0_1.xml", category: "domestic", limit: 15 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=http://www.people.com.cn/rss/politics.xml", category: "domestic", limit: 12 },
                { url: "https://api.rss2json.com/v1/api.json?rss_url=https://cn.reuters.com/rssNews/CNTopNews", category: "domestic", limit: 10 }
            ];
            let allArticles = [];
            try {
                const fetchPromises = sources.map(async (source) => {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 8000);
                        const response = await fetch(source.url, { signal: controller.signal });
                        clearTimeout(timeoutId);
                        if (!response.ok) return [];
                        const data = await response.json();
                        if (data?.items && Array.isArray(data.items)) {
                            return data.items.slice(0, source.limit).map(item => ({
                                title: item.title || "无标题",
                                summary: (item.description || item.content || "").replace(/<[^>]*>/g, '').substring(0, 200),
                                pubDate: item.pubDate || new Date().toISOString(),
                                link: item.link || "#",
                                category: source.category,
                                image: (item.enclosure && item.enclosure.link) || 
                                       (item.thumbnail && item.thumbnail) || 
                                       `https://picsum.photos/seed/${encodeURIComponent(item.title)}/600/400`
                            }));
                        }
                        return [];
                    } catch (err) { return []; }
                });
                const results = await Promise.allSettled(fetchPromises);
                for (const result of results) {
                    if (result.status === 'fulfilled') allArticles.push(...result.value);
                }
            } catch(e) { console.error(e); }
            // 去重 (按标题前80字符)
            const uniqueMap = new Map();
            for (const article of allArticles) {
                const key = article.title.substring(0, 80);
                if (!uniqueMap.has(key)) uniqueMap.set(key, article);
            }
            allArticles = Array.from(uniqueMap.values());
            allArticles.sort((a,b) => new Date(b.pubDate) - new Date(a.pubDate));
            return allArticles;
        }

        // ============================================================
        //  应用状态与渲染
        // ============================================================
        let allNewsItems = [];
        let currentCategory = '全部';
        let searchQuery = '';
        let currentPage = 0;
        const pageSize = 8;

        const categoryListEl = document.getElementById('categoryList');
        const newsGridEl = document.getElementById('newsGrid');
        const categoryTitleEl = document.getElementById('categoryTitle');
        const newsCountEl = document.getElementById('newsCount');
        const updateTimeEl = document.getElementById('updateTime');
        const searchInput = document.getElementById('searchInput');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');

        // ---- 过滤与映射 ----
        function getFilteredNews() {
            let result = [...allNewsItems];
            if (currentCategory !== '全部') {
                result = result.filter(item => mapCategory(item.category) === currentCategory);
            }
            const q = searchQuery.trim().toLowerCase();
            if (q) {
                result = result.filter(item =>
                    item.title.toLowerCase().includes(q) ||
                    item.summary.toLowerCase().includes(q) ||
                    (item.link && item.link.toLowerCase().includes(q))
                );
            }
            return result;
        }

        // ---- 渲染分类侧边栏（新增“文化”） ----
        function renderCategories() {
            const categoryCounts = {};
            allNewsItems.forEach(item => {
                const localCat = mapCategory(item.category);
                categoryCounts[localCat] = (categoryCounts[localCat] || 0) + 1;
            });
            // 分类顺序：全部、科技、财经、体育、娱乐、文化
            const categories = ['全部', '科技', '财经', '体育', '娱乐', '文化'];
            const totalCount = allNewsItems.length;

            categoryListEl.innerHTML = '';
            categories.forEach(cat => {
                const count = cat === '全部' ? totalCount : (categoryCounts[cat] || 0);
                const li = document.createElement('li');
                li.dataset.category = cat;
                li.className = cat === currentCategory ? 'active' : '';
                li.setAttribute('role', 'tab');
                li.setAttribute('aria-selected', cat === currentCategory);

                li.innerHTML = `
                    <span class="material-symbols-outlined" aria-hidden="true">${getCategoryIcon(cat)}</span>
                    ${cat}
                    <span class="count">${count}</span>
                `;
                li.addEventListener('click', () => {
                    currentCategory = cat;
                    searchQuery = '';
                    searchInput.value = '';
                    currentPage = 0;
                    renderCategories();
                    renderNews();
                    updateHeaderInfo();
                });
                categoryListEl.appendChild(li);
            });
        }

        // ---- 渲染新闻卡片 ----
        function renderNews() {
            const filtered = getFilteredNews();
            const start = 0;
            const end = (currentPage + 1) * pageSize;
            const data = filtered.slice(0, end);

            if (allNewsItems.length === 0) {
                newsGridEl.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <div class="loader" style="margin:0 auto 20px;"></div>
                        <h3>正在加载新闻...</h3>
                        <p>请稍候，聚合全球资讯</p>
                    </div>
                `;
                loadMoreBtn.style.display = 'none';
                return;
            }

            if (data.length === 0) {
                newsGridEl.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <span class="material-symbols-outlined" aria-hidden="true">inbox</span>
                        <h3>没有找到相关新闻</h3>
                        <p>试试调整关键词或分类</p>
                    </div>
                `;
                loadMoreBtn.style.display = 'none';
                return;
            }

            newsGridEl.innerHTML = data.map(item => {
                const localCat = mapCategory(item.category);
                const sourceName = item.link ? new URL(item.link).hostname.replace(/^www\./, '') : '网络';
                return `
                    <div class="news-card" role="listitem" data-link="${item.link}">
                        <div class="card-image">
                            <img src="${item.image}" alt="${escapeHtml(item.title)}" loading="lazy" />
                            <span class="category-tag">${localCat}</span>
                        </div>
                        <div class="card-body">
                            <div class="title">${escapeHtml(item.title)}</div>
                            <div class="summary">${escapeHtml(item.summary)}</div>
                        </div>
                        <div class="card-footer">
                            <span class="source">
                                <span class="dot"></span>
                                ${sourceName}
                            </span>
                            <span class="time">
                                <span class="material-symbols-outlined" aria-hidden="true">schedule</span>
                                ${formatRelativeDate(item.pubDate)}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');

            const total = filtered.length;
            if (end >= total) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'flex';
            }
        }

        // ---- 更新头部信息 ----
        function updateHeaderInfo() {
            const filtered = getFilteredNews();
            const total = filtered.length;
            const catName = currentCategory;
            const title = catName === '全部' ? '全部新闻' : `${catName} · 新闻`;
            categoryTitleEl.innerHTML = `
                ${title}
                <small>${total} 条</small>
            `;
            newsCountEl.textContent = `${total} 条`;

            const now = new Date();
            updateTimeEl.textContent = `更新 ${now.toLocaleString('zh-CN', { hour12: false })}`;
        }

        // ---- 加载更多 ----
        function loadMore() {
            const filtered = getFilteredNews();
            const total = filtered.length;
            const currentEnd = (currentPage + 1) * pageSize;
            if (currentEnd < total) {
                currentPage++;
                renderNews();
            }
            if (currentPage * pageSize >= total) {
                loadMoreBtn.style.display = 'none';
            }
        }

        // ---- 搜索防抖 ----
        let searchTimer = null;
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            searchTimer = setTimeout(() => {
                searchQuery = searchInput.value;
                currentCategory = '全部';
                currentPage = 0;
                renderCategories();
                renderNews();
                updateHeaderInfo();
            }, 300);
        });

        // ---- 主题切换 ----
        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark-theme');
            if (isDark) {
                document.documentElement.style.setProperty('--bg-primary', '#12100e');
                document.documentElement.style.setProperty('--bg-secondary', '#1e1816');
                document.documentElement.style.setProperty('--bg-card', '#261f1c');
                document.documentElement.style.setProperty('--bg-header', '#0d0807');
                document.documentElement.style.setProperty('--bg-sidebar', '#181210');
                document.documentElement.style.setProperty('--text-primary', '#f0e8e4');
                document.documentElement.style.setProperty('--text-secondary', '#c0b0aa');
                document.documentElement.style.setProperty('--text-muted', '#8a7a74');
                document.documentElement.style.setProperty('--text-white', '#f0e8e4');
                document.documentElement.style.setProperty('--border-color', '#3a2e2a');
                document.documentElement.style.setProperty('--shadow-sm', '0 2px 8px rgba(0,0,0,0.5)');
                document.documentElement.style.setProperty('--shadow-md', '0 8px 24px rgba(0,0,0,0.6)');
                document.documentElement.style.setProperty('--shadow-lg', '0 16px 48px rgba(0,0,0,0.7)');
                document.documentElement.style.setProperty('--tag-bg', '#2a221e');
                document.documentElement.style.setProperty('--accent-light', 'rgba(178,34,34,0.25)');
                themeIcon.textContent = 'light_mode';
            } else {
                document.documentElement.style.removeProperty('--bg-primary');
                document.documentElement.style.removeProperty('--bg-secondary');
                document.documentElement.style.removeProperty('--bg-card');
                document.documentElement.style.removeProperty('--bg-header');
                document.documentElement.style.removeProperty('--bg-sidebar');
                document.documentElement.style.removeProperty('--text-primary');
                document.documentElement.style.removeProperty('--text-secondary');
                document.documentElement.style.removeProperty('--text-muted');
                document.documentElement.style.removeProperty('--text-white');
                document.documentElement.style.removeProperty('--border-color');
                document.documentElement.style.removeProperty('--shadow-sm');
                document.documentElement.style.removeProperty('--shadow-md');
                document.documentElement.style.removeProperty('--shadow-lg');
                document.documentElement.style.removeProperty('--tag-bg');
                document.documentElement.style.removeProperty('--accent-light');
                themeIcon.textContent = 'dark_mode';
            }
        }
        themeToggle.addEventListener('click', toggleTheme);
        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            themeIcon.textContent = 'light_mode';
        }

        // ---- 点击卡片跳转 ----
        newsGridEl.addEventListener('click', (e) => {
            const card = e.target.closest('.news-card');
            if (card) {
                const link = card.dataset.link;
                if (link && link !== '#') {
                    window.open(link, '_blank');
                }
            }
        });

        // ---- 加载网络新闻 ----
        async function loadNewsFromNetwork() {
            newsGridEl.innerHTML = `
                <div class="empty-state" style="grid-column:1/-1;">
                    <div class="loader" style="margin:0 auto 20px;"></div>
                    <h3>正在聚合全球资讯...</h3>
                    <p>请稍候，从多个源获取最新新闻</p>
                </div>
            `;
            try {
                const networkNews = await fetchNetworkNews();
                allNewsItems = networkNews;
                if (allNewsItems.length === 0) {
                    newsGridEl.innerHTML = `
                        <div class="empty-state" style="grid-column:1/-1;">
                            <span class="material-symbols-outlined" aria-hidden="true">wifi_off</span>
                            <h3>暂时无法获取新闻</h3>
                            <p>请检查网络后 <button class="load-more-btn" onclick="location.reload()" style="margin-top:12px;">重新加载</button></p>
                        </div>
                    `;
                    loadMoreBtn.style.display = 'none';
                } else {
                    currentCategory = '全部';
                    searchQuery = '';
                    searchInput.value = '';
                    currentPage = 0;
                    renderCategories();
                    renderNews();
                    updateHeaderInfo();
                }
            } catch (err) {
                console.error(err);
                newsGridEl.innerHTML = `
                    <div class="empty-state" style="grid-column:1/-1;">
                        <span class="material-symbols-outlined" aria-hidden="true">error</span>
                        <h3>加载失败</h3>
                        <p>请刷新页面重试</p>
                    </div>
                `;
                loadMoreBtn.style.display = 'none';
            }
        }

        // ---- 初始化 ----
        function init() {
            loadMoreBtn.addEventListener('click', loadMore);
            loadNewsFromNetwork();
        }

        init();
    </script>

</body>
</html>
