<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>学海 - 肉鸽射击游戏</title>
    <!-- 网站标签页图标（png） -->
    <link rel="icon" href="https://feng34937.github.io/miyuan/MIYUAN_LOGO_NOBACKGROUND.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a1a;
            --panel-bg: rgba(10, 10, 40, 0.85);
            --text: #e0e0f0;
            --gold: #f0c040;
            --danger: #e04040;
            --heal: #40d070;
            --accent: #6090f0;
            --purple: #b060e0;
            --cyan: #40d0d0;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #050510;
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            cursor: default;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            -webkit-touch-callout: none;
        }
        #game-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: #0a0a20;
            border: none;
            border-radius: 0px;
            box-shadow: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            border-radius: 0px;
            border: none;
            touch-action: none;
        }
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            pointer-events: none;
            padding: 8px 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 4px;
            flex-wrap: wrap;
            z-index: 10;
        }
        .ui-panel {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 0px;
            padding: 5px 8px;
            color: var(--text);
            font-size: 10px;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            pointer-events: auto;
            min-width: 55px;
            text-align: center;
            letter-spacing: 0.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1px;
        }
        .ui-panel .label {
            font-size: 9px;
            text-transform: uppercase;
            opacity: 0.8;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .ui-panel .value {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
        }
        .hp-bar-bg {
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.12);
            border-radius: 0px;
            margin-top: 1px;
            overflow: hidden;
        }
        .hp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #e04040, #f06060);
            border-radius: 0px;
            transition: width 0.3s;
        }
        .exp-bar-bg {
            width: 100%;
            height: 2px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 0px;
            margin-top: 1px;
            overflow: hidden;
        }
        .exp-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6090f0, #80b0ff);
            border-radius: 0px;
            transition: width 0.3s;
        }
        #upgrade-modal,
        #shop-modal,
        #monster-buff-modal,
        #weapon-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.82);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            pointer-events: auto;
            flex-direction: column;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }
        #upgrade-modal.active,
        #shop-modal.active,
        #monster-buff-modal.active,
        #weapon-modal.active {
            display: flex;
        }
        #upgrade-modal .title,
        #shop-modal .title,
        #monster-buff-modal .title,
        #weapon-modal .title {
            font-size: 24px;
            font-weight: 900;
            color: #f0d060;
            text-shadow: 0 0 20px rgba(240, 200, 60, 0.55);
            margin-bottom: 4px;
            letter-spacing: 2px;
            text-align: center;
        }
        #shop-modal .title {
            color: #40d0d0;
            text-shadow: 0 0 20px rgba(64, 208, 208, 0.55);
        }
        #monster-buff-modal .title {
            color: #e06060;
            text-shadow: 0 0 20px rgba(224, 96, 96, 0.55);
        }
        #weapon-modal .title {
            color: #c080f0;
            text-shadow: 0 0 20px rgba(192, 128, 240, 0.55);
        }
        #upgrade-modal .subtitle,
        #shop-modal .subtitle,
        #monster-buff-modal .subtitle,
        #weapon-modal .subtitle {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 10px;
            text-align: center;
            max-width: 85vw;
        }
        #upgrade-modal .timer-bar,
        #shop-modal .timer-bar,
        #monster-buff-modal .timer-bar,
        #weapon-modal .timer-bar {
            width: 400px;
            max-width: 80vw;
            height: 5px;
            background: rgba(255, 255, 255, 0.13);
            border-radius: 0px;
            margin-bottom: 14px;
            overflow: hidden;
        }
        #upgrade-modal .timer-fill,
        #shop-modal .timer-fill,
        #monster-buff-modal .timer-fill,
        #weapon-modal .timer-fill {
            height: 100%;
            background: #f08040;
            border-radius: 0px;
            transition: width 0.1s linear;
        }
        #shop-modal .timer-fill {
            background: #40c0c0;
        }
        #monster-buff-modal .timer-fill {
            background: #e06060;
        }
        #weapon-modal .timer-fill {
            background: #c080f0;
        }
        .upgrade-options,
        .shop-options,
        .buff-options,
        .weapon-options {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .upgrade-card,
        .shop-card,
        .buff-card,
        .weapon-card {
            background: rgba(20, 20, 50, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.28);
            border-radius: 0px;
            padding: 14px 16px;
            cursor: pointer;
            min-width: 130px;
            max-width: 200px;
            text-align: center;
            transition: all 0.2s;
            color: #fff;
            pointer-events: auto;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .upgrade-card:hover,
        .shop-card:hover,
        .buff-card:hover,
        .weapon-card:hover {
            border-color: #f0d060;
            box-shadow: 0 0 30px rgba(240, 200, 60, 0.4);
            transform: translateY(-4px);
        }
        .buff-card:hover {
            border-color: #e06060;
            box-shadow: 0 0 30px rgba(224, 96, 96, 0.4);
        }
        .weapon-card:hover {
            border-color: #c080f0;
            box-shadow: 0 0 30px rgba(192, 128, 240, 0.4);
        }
        .shop-card:hover {
            border-color: #40d0d0;
            box-shadow: 0 0 30px rgba(64, 208, 208, 0.4);
        }
        .shop-card.unaffordable {
            opacity: 0.45;
            pointer-events: none;
            border-color: rgba(255, 80, 80, 0.5);
            cursor: not-allowed;
        }
        .upgrade-card .expr {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 4px 0;
            font-family: 'Courier New', 'SF Mono', 'Consolas', monospace;
            line-height: 1.3;
        }
        .upgrade-card .vars {
            font-size: 11px;
            opacity: 0.8;
            color: #ffe0a0;
            margin-bottom: 2px;
            font-family: 'Courier New', 'SF Mono', 'Consolas', monospace;
        }
        .upgrade-card .attr-name,
        .buff-card .buff-name,
        .weapon-card .weapon-name {
            font-size: 12px;
            opacity: 0.85;
            letter-spacing: 1px;
            margin-top: 2px;
        }
        .buff-card .buff-desc {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 4px;
        }
        .shop-card .shop-icon,
        .weapon-card .weapon-icon {
            font-size: 28px;
            margin-bottom: 4px;
        }
        .shop-card .shop-name,
        .weapon-card .weapon-name {
            font-size: 13px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .shop-card .shop-desc,
        .weapon-card .weapon-desc {
            font-size: 10px;
            opacity: 0.75;
            margin: 4px 0;
            line-height: 1.3;
        }
        .shop-card .shop-cost {
            font-size: 11px;
            font-weight: 700;
            margin-top: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .shop-card .shop-cost.cost-exp {
            color: #f0c040;
        }
        .shop-card .shop-cost.cost-hp {
            color: #f06060;
        }
        .upgrade-card .key-hint,
        .shop-card .key-hint,
        .buff-card .key-hint,
        .weapon-card .key-hint {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 9px;
            opacity: 0.5;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 0px;
            padding: 2px 5px;
        }
        .upgrade-card.card-damage {
            border-left: 4px solid #f06050;
        }
        .upgrade-card.card-hp {
            border-left: 4px solid #50d070;
        }
        .upgrade-card.card-speed {
            border-left: 4px solid #50b0f0;
        }
        .upgrade-card.card-atkspeed {
            border-left: 4px solid #d080f0;
        }
        #difficulty-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.86);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            pointer-events: auto;
            flex-direction: column;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #difficulty-modal .title {
            font-size: 34px;
            font-weight: 900;
            color: #f0d060;
            text-shadow: 0 0 30px rgba(240, 200, 60, 0.65);
            margin-bottom: 4px;
            letter-spacing: 3px;
        }
        #difficulty-modal .subtitle {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .diff-options {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .diff-card {
            background: rgba(15, 15, 40, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.23);
            border-radius: 0px;
            padding: 16px 20px;
            cursor: pointer;
            min-width: 140px;
            text-align: center;
            transition: all 0.2s;
            color: #fff;
            pointer-events: auto;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .diff-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 0 35px rgba(200, 180, 60, 0.48);
            border-color: #f0d060;
        }
        .diff-card .diff-name {
            font-size: 17px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .diff-card .diff-desc {
            font-size: 10px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .diff-card.easy {
            border-color: #50d070;
        }
        .diff-card.easy:hover {
            border-color: #70f090;
            box-shadow: 0 0 35px rgba(80, 200, 100, 0.48);
        }
        .diff-card.normal {
            border-color: #f0c040;
        }
        .diff-card.hard {
            border-color: #e05050;
        }
        .diff-card.hard:hover {
            border-color: #ff7070;
            box-shadow: 0 0 35px rgba(220, 60, 60, 0.48);
        }
        #gameover-modal {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.86);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 150;
            pointer-events: auto;
            flex-direction: column;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
        }
        #gameover-modal.active {
            display: flex;
        }
        #gameover-modal .title {
            font-size: 30px;
            font-weight: 900;
            color: #e04040;
            text-shadow: 0 0 25px rgba(220, 50, 50, 0.55);
            margin-bottom: 6px;
            letter-spacing: 2px;
        }
        #gameover-modal .stats {
            color: #ccc;
            font-size: 13px;
            margin-bottom: 12px;
            text-align: center;
            line-height: 1.8;
        }
        #gameover-modal button {
            background: #f0c040;
            color: #111;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 700;
            border-radius: 0px;
            cursor: pointer;
            letter-spacing: 1px;
            transition: all 0.2s;
            pointer-events: auto;
        }
        #gameover-modal button:hover {
            background: #f8d860;
            box-shadow: 0 0 25px rgba(240, 200, 60, 0.48);
            transform: scale(1.04);
        }
        #copyright {
            position: absolute;
            bottom: 8px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.35);
            font-size: 10px;
            letter-spacing: 1px;
            pointer-events: none;
            z-index: 5;
            text-align: center;
            white-space: nowrap;
        }
        #mobile-controls {
            position: absolute;
            bottom: 16px;
            right: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            z-index: 20;
            pointer-events: auto;
        }
        .ctrl-row {
            display: flex;
            gap: 3px;
        }
        .ctrl-btn {
            width: 44px;
            height: 44px;
            background: rgba(20, 20, 40, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 20px;
            cursor: pointer;
            transition: all 0.15s;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .ctrl-btn:active {
            background: rgba(80, 120, 240, 0.5);
            border-color: #80a0ff;
            transform: scale(0.93);
        }
        .ctrl-btn i {
            pointer-events: none;
        }
        #effects-indicator {
            position: absolute;
            bottom: 80px;
            left: 10px;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            z-index: 15;
            pointer-events: none;
        }
        .effect-icon {
            width: 24px;
            height: 24px;
            background: rgba(0, 0, 0, 0.65);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 0px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: #fff;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            position: relative;
        }
        .effect-icon .badge {
            position: absolute;
            top: -4px;
            right: -6px;
            font-size: 7px;
            background: #e04040;
            color: #fff;
            border-radius: 0px;
            padding: 0px 2px;
            min-width: 10px;
            text-align: center;
        }
        @keyframes pulse {
            0%,
            100% {
                opacity: 0.7;
            }
            50% {
                opacity: 1;
            }
        }
        @media (max-width: 600px) {
            .ui-panel {
                padding: 3px 5px;
                font-size: 8px;
                min-width: 40px;
                gap: 0px;
            }
            .ui-panel .value {
                font-size: 11px;
            }
            .ui-panel .label {
                font-size: 7px;
                gap: 1px;
            }
            .upgrade-card,
            .shop-card,
            .buff-card,
            .weapon-card {
                min-width: 95px;
                padding: 10px 10px;
            }
            .upgrade-card .expr {
                font-size: 20px;
            }
            .upgrade-card .vars {
                font-size: 9px;
            }
            .shop-card .shop-name,
            .weapon-card .weapon-name {
                font-size: 11px;
            }
            .shop-card .shop-desc,
            .weapon-card .weapon-desc {
                font-size: 9px;
            }
            .diff-card {
                min-width: 100px;
                padding: 12px 14px;
            }
            .diff-card .diff-name {
                font-size: 14px;
            }
            #upgrade-modal .title,
            #shop-modal .title,
            #monster-buff-modal .title,
            #weapon-modal .title {
                font-size: 20px;
            }
            #difficulty-modal .title {
                font-size: 26px;
            }
            #gameover-modal .title {
                font-size: 24px;
            }
            .ctrl-btn {
                width: 38px;
                height: 38px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="ui-overlay">
            <div class="ui-panel" id="hp-panel">
                <div class="label"><i class="fas fa-heart"></i> 血量</div>
                <div class="value" id="hp-value">10 / 10</div>
                <div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar" style="width:100%"></div></div>
            </div>
            <div class="ui-panel" id="wave-panel">
                <div class="label"><i class="fas fa-water"></i> 波次</div>
                <div class="value" id="wave-value">1</div>
            </div>
            <div class="ui-panel" id="level-panel">
                <div class="label"><i class="fas fa-star"></i> 等级</div>
                <div class="value" id="level-value">1</div>
                <div class="exp-bar-bg"><div class="exp-bar-fill" id="exp-bar" style="width:0%"></div></div>
                <div style="font-size:8px;opacity:0.65;margin-top:0px;" id="exp-text">0 / 10</div>
            </div>
            <div class="ui-panel" id="dmg-panel">
                <div class="label"><i class="fas fa-bolt"></i> 伤害</div>
                <div class="value" id="dmg-value">2</div>
            </div>
            <div class="ui-panel" id="atkspd-panel">
                <div class="label"><i class="fas fa-stopwatch"></i> 攻速</div>
                <div class="value" id="atkspd-value">1.5s</div>
            </div>
            <div class="ui-panel" id="kills-panel">
                <div class="label"><i class="fas fa-skull"></i> 击杀</div>
                <div class="value" id="kills-value">0</div>
            </div>
        </div>
        <div id="difficulty-modal">
            <div class="title"><i class="fas fa-book"></i> 学 海</div>
            <div class="subtitle">选择你的起点</div>
            <div class="diff-options">
                <div class="diff-card easy" onclick="selectDifficulty('easy')">
                    <div class="diff-name"><i class="fas fa-seedling"></i> 年级前1000</div>
                    <div class="diff-desc">伤害+50% · 血量+50%</div>
                    <div class="diff-desc" style="margin-top:2px;opacity:0.5;">（简单）</div>
                </div>
                <div class="diff-card normal" onclick="selectDifficulty('normal')">
                    <div class="diff-name"><i class="fas fa-user-graduate"></i> 年级前300</div>
                    <div class="diff-desc">无改动</div>
                    <div class="diff-desc" style="margin-top:2px;opacity:0.5;">（普通）</div>
                </div>
                <div class="diff-card hard" onclick="selectDifficulty('hard')">
                    <div class="diff-name"><i class="fas fa-crown"></i> 年级前10</div>
                    <div class="diff-desc">怪物血量+50% · 数量+50%</div>
                    <div class="diff-desc" style="margin-top:2px;opacity:0.5;">（困难）</div>
                </div>
            </div>
        </div>
        <div id="upgrade-modal">
            <div class="title"><i class="fas fa-level-up-alt"></i> 升级！选择奖励</div>
            <div class="subtitle">快速计算表达式，限时选择（按 1 / 2 / 3 键或点击）</div>
            <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
            <div class="upgrade-options" id="upgrade-options"></div>
        </div>
        <div id="shop-modal">
            <div class="title"><i class="fas fa-store-alt"></i> 学海补给站</div>
            <div class="subtitle">BOSS已击败！花费经验或血量购买强化（按 1/2/3 或点击）</div>
            <div class="timer-bar"><div class="timer-fill" id="shop-timer-fill" style="width:100%"></div></div>
            <div class="shop-options" id="shop-options"></div>
        </div>
        <div id="monster-buff-modal">
            <div class="title"><i class="fas fa-skull"></i> 怪物强化</div>
            <div class="subtitle">为下波怪物选择一个增益效果（按 1/2/3 或点击）</div>
            <div class="timer-bar"><div class="timer-fill" id="monster-buff-timer-fill" style="width:100%"></div></div>
            <div class="buff-options" id="buff-options"></div>
        </div>
        <div id="weapon-modal">
            <div class="title"><i class="fas fa-crosshairs"></i> 武器进化</div>
            <div class="subtitle">选择一种子弹模式（按 1/2/3 或点击）</div>
            <div class="timer-bar"><div class="timer-fill" id="weapon-timer-fill" style="width:100%"></div></div>
            <div class="weapon-options" id="weapon-options"></div>
        </div>
        <div id="gameover-modal">
            <div class="title"><i class="fas fa-skull-crossbones"></i> 学海无涯</div>
            <div class="stats" id="gameover-stats"></div>
            <button onclick="restartGame()"><i class="fas fa-redo-alt"></i> 重新挑战</button>
        </div>
        <div id="effects-indicator"></div>
        <div id="mobile-controls">
            <div class="ctrl-row"><div class="ctrl-btn" id="btn-up"><i class="fas fa-chevron-up"></i></div></div>
            <div class="ctrl-row">
                <div class="ctrl-btn" id="btn-left"><i class="fas fa-chevron-left"></i></div>
                <div class="ctrl-btn" id="btn-down"><i class="fas fa-chevron-down"></i></div>
                <div class="ctrl-btn" id="btn-right"><i class="fas fa-chevron-right"></i></div>
            </div>
        </div>
        <div id="copyright">© 2026 米遇安</div>
    </div>
    <script>
        (function() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            let GAME_W = window.innerWidth;
            let GAME_H = window.innerHeight;
            function resizeCanvas() {
                GAME_W = window.innerWidth;
                GAME_H = window.innerHeight;
                canvas.width = GAME_W;
                canvas.height = GAME_H;
                if (player) {
                    player.x = Math.min(player.x, GAME_W - player.radius);
                    player.y = Math.min(player.y, GAME_H - player.radius);
                    player.x = Math.max(player.x, player.radius);
                    player.y = Math.max(player.y, player.radius);
                }
            }
            window.addEventListener('resize', resizeCanvas);

            const hpValueEl = document.getElementById('hp-value');
            const hpBarEl = document.getElementById('hp-bar');
            const waveValueEl = document.getElementById('wave-value');
            const levelValueEl = document.getElementById('level-value');
            const expBarEl = document.getElementById('exp-bar');
            const expTextEl = document.getElementById('exp-text');
            const dmgValueEl = document.getElementById('dmg-value');
            const atkspdValueEl = document.getElementById('atkspd-value');
            const killsValueEl = document.getElementById('kills-value');
            const upgradeModal = document.getElementById('upgrade-modal');
            const upgradeOptionsEl = document.getElementById('upgrade-options');
            const timerFillEl = document.getElementById('timer-fill');
            const shopModal = document.getElementById('shop-modal');
            const shopOptionsEl = document.getElementById('shop-options');
            const shopTimerFillEl = document.getElementById('shop-timer-fill');
            const monsterBuffModal = document.getElementById('monster-buff-modal');
            const buffOptionsEl = document.getElementById('buff-options');
            const monsterBuffTimerFillEl = document.getElementById('monster-buff-timer-fill');
            const weaponModal = document.getElementById('weapon-modal');
            const weaponOptionsEl = document.getElementById('weapon-options');
            const weaponTimerFillEl = document.getElementById('weapon-timer-fill');
            const difficultyModal = document.getElementById('difficulty-modal');
            const gameoverModal = document.getElementById('gameover-modal');
            const gameoverStatsEl = document.getElementById('gameover-stats');
            const effectsIndicator = document.getElementById('effects-indicator');

            let gameStarted = false;
            let gameOver = false;
            let isPaused = false;
            let difficulty = null;
            let difficultyMultiplier = 1;
            let monsterCountMultiplier = 1;
            let playerDamageMultiplier = 1;
            let playerHPMultiplier = 1;
            let bossDefeatedThisWave = false;
            let pendingShop = false;
            let pendingMonsterBuff = false;
            let monsterBuffApplied = false;

            let player = {
                x: GAME_W / 2,
                y: GAME_H / 2,
                radius: 16,
                maxHP: 10,
                hp: 10,
                damage: 2,
                attackCooldown: 1.5,
                attackTimer: 0,
                moveSpeed: 220,
                invincibleTimer: 0,
                level: 1,
                exp: 0,
                expToNext: 10,
                kills: 0,
                effects: [],
                weaponType: 'normal',
            };

            let bullets = [];
            let enemies = [];
            let enemyBullets = [];
            let expOrbs = [];
            let particles = [];
            let waveNumber = 1;
            let enemiesRemainingInWave = 0;
            let waveDelayTimer = 0;
            let totalEnemiesToSpawn = 0;
            let enemiesSpawnedThisWave = 0;
            let spawnQueue = [];
            let spawnTimer = 0;

            let upgradeChoices = [];
            let upgradeTimer = 0;
            const UPGRADE_TIME_LIMIT = 8;
            let isChoosingUpgrade = false;

            let shopChoices = [];
            let shopTimer = 0;
            const SHOP_TIME_LIMIT = 12;
            let isShopping = false;

            let monsterBuffChoices = [];
            let monsterBuffTimer = 0;
            const MONSTER_BUFF_TIME_LIMIT = 10;
            let isChoosingMonsterBuff = false;

            let weaponChoices = [];
            let weaponTimer = 0;
            const WEAPON_TIME_LIMIT = 10;
            let isChoosingWeapon = false;

            let keys = {};
            let touchMoveActive = false;
            let touchStartX = 0,
                touchStartY = 0,
                touchCurrentX = 0,
                touchCurrentY = 0;
            const touchMoveThreshold = 8;

            function getExpToNext(level) {
                if (level === 1) return 10;
                if (level === 2) return 20;
                if (level === 3) return 30;
                if (level === 4) return 50;
                if (level === 5) return 100;
                if (level === 6) return 200;
                return 200 + (level - 6) * 100;
            }

            function hasEffect(type) { return player.effects.some(e => e.type === type); }
            function getEffect(type) { return player.effects.find(e => e.type === type); }
            function addEffect(effect) {
                const existing = getEffect(effect.type);
                if (existing) {
                    if (effect.type === 'shield') existing.charges = (existing.charges || 0) + (effect.charges || 3);
                    else if (effect.type === 'killHeal') existing.amount = (existing.amount || 0) + (effect.amount || 1);
                    else if (effect.type === 'bonusExp') existing.amount = (existing.amount || 0) + (effect.amount || 2);
                    else if (effect.type === 'percentDamage') existing.ratio = (existing.ratio || 0) + (effect.ratio || 0.02);
                    else if (effect.type === 'fullScreenAttack') { existing.interval = Math.max(3, (existing.interval || 8) - 1); existing.damageRatio = (existing.damageRatio || 0.5) + 0.1; }
                    else if (effect.type === 'periodicInvincible') { existing.interval = Math.max(5, (existing.interval || 15) - 2); existing.duration = (existing.duration || 2) + 0.5; }
                    else if (effect.type === 'knockback') { existing.interval = Math.max(4, (existing.interval || 10) - 1); existing.force = (existing.force || 150) + 30; }
                } else {
                    const e = { ...effect };
                    if (e.type === 'fullScreenAttack') { e.timer = e.interval || 8; e.damageRatio = e.damageRatio || 0.5; }
                    else if (e.type === 'periodicInvincible') { e.timer = e.interval || 15; e.duration = e.duration || 2; e.active = false; e.activeTimer = 0; }
                    else if (e.type === 'knockback') { e.timer = e.interval || 10; e.radius = e.radius || 200; e.force = e.force || 150; }
                    else if (e.type === 'shield') { e.charges = e.charges || 3; }
                    else if (e.type === 'killHeal') { e.amount = e.amount || 2; }
                    else if (e.type === 'bonusExp') { e.amount = e.amount || 3; }
                    else if (e.type === 'percentDamage') { e.ratio = e.ratio || 0.04; }
                    player.effects.push(e);
                }
                updateEffectsUI();
            }
            function removeEffect(type) { const idx = player.effects.findIndex(e => e.type === type); if (idx >= 0) player.effects.splice(idx, 1); updateEffectsUI(); }
            function updateEffectsUI() {
                effectsIndicator.innerHTML = '';
                const iconMap = {
                    'killHeal': '<i class="fas fa-heart" style="color:#50d070;"></i>',
                    'shield': '<i class="fas fa-shield-alt" style="color:#80c0ff;"></i>',
                    'fullScreenAttack': '<i class="fas fa-bomb" style="color:#ffa040;"></i>',
                    'bonusExp': '<i class="fas fa-star" style="color:#f0d060;"></i>',
                    'periodicInvincible': '<i class="fas fa-clock" style="color:#d0a0ff;"></i>',
                    'percentDamage': '<i class="fas fa-percent" style="color:#ff8080;"></i>',
                    'knockback': '<i class="fas fa-arrow-circle-up" style="color:#80e0e0;"></i>',
                };
                player.effects.forEach(e => {
                    const div = document.createElement('div');
                    div.className = 'effect-icon';
                    div.innerHTML = iconMap[e.type] || '<i class="fas fa-question"></i>';
                    if (e.type === 'shield' && e.charges > 0) {
                        const badge = document.createElement('span');
                        badge.className = 'badge';
                        badge.textContent = e.charges;
                        div.appendChild(badge);
                    }
                    effectsIndicator.appendChild(div);
                });
            }

            window.selectDifficulty = function(diff) {
                difficulty = diff;
                if (diff === 'easy') { playerDamageMultiplier = 1.5; playerHPMultiplier = 1.5; difficultyMultiplier = 1.0; monsterCountMultiplier = 1.0; }
                else if (diff === 'normal') { playerDamageMultiplier = 1.0; playerHPMultiplier = 1.0; difficultyMultiplier = 1.0; monsterCountMultiplier = 1.0; }
                else { playerDamageMultiplier = 1.0; playerHPMultiplier = 1.0; difficultyMultiplier = 1.5; monsterCountMultiplier = 1.5; }
                player.maxHP = Math.round(10 * playerHPMultiplier);
                player.hp = player.maxHP;
                player.damage = Math.round(2 * playerDamageMultiplier);
                difficultyModal.style.display = 'none';
                gameStarted = true;
                startWave(1);
                updateUI();
            };

            function startWave(waveNum) {
                waveNumber = waveNum;
                waveDelayTimer = 0;
                bossDefeatedThisWave = false;
                pendingShop = false;
                monsterBuffApplied = false;
                let baseCount = 3 + Math.floor(waveNum * 1.2);
                baseCount = Math.round(baseCount * monsterCountMultiplier);
                if (baseCount < 3) baseCount = 3;
                let hasBoss = (waveNum % 10 === 0);
                let eliteCount = Math.floor(waveNum / 3);
                totalEnemiesToSpawn = baseCount + eliteCount + (hasBoss ? 1 : 0);
                enemiesSpawnedThisWave = 0;
                enemiesRemainingInWave = totalEnemiesToSpawn;
                spawnQueue = [];
                spawnTimer = 0;
                if (hasBoss) spawnQueue.push({ type: 'boss', delay: 0.5 });
                for (let i = 0; i < eliteCount; i++) spawnQueue.push({ type: 'elite', delay: 0.3 + i * 0.6 });
                for (let i = 0; i < baseCount; i++) {
                    let type = 'normal';
                    if (waveNum > 2 && Math.random() < 0.25) type = 'ranged';
                    if (waveNum > 4 && Math.random() < 0.2) type = 'exploder';
                    if (waveNum > 3 && Math.random() < 0.15) type = 'drop';
                    spawnQueue.push({ type, delay: 0.1 + i * 0.25 });
                }
                spawnQueue.sort((a, b) => { if (a.type === 'boss') return -1; if (b.type === 'boss') return 1; return Math.random() - 0.5; });
                let cumulativeDelay = 0;
                for (let item of spawnQueue) { cumulativeDelay += item.type === 'boss' ? 0.8 : (item.type === 'elite' ? 0.5 : 0.2 + Math.random() * 0.4); item.delay = cumulativeDelay; }
                updateUI();
            }

            function spawnEnemy(type) {
                let edge = Math.floor(Math.random() * 4);
                let x, y;
                const margin = 30;
                switch (edge) { case 0: x = -margin; y = Math.random() * GAME_H; break; case 1: x = GAME_W + margin; y = Math.random() * GAME_H; break; case 2: x = Math.random() * GAME_W; y = -margin; break; case 3: x = Math.random() * GAME_W; y = GAME_H + margin; break; }
                if (type === 'drop') { x = player.x + (Math.random() - 0.5) * 300; y = player.y - 100 - Math.random() * 200; }
                let speed = type === 'boss' ? 55 : (type === 'elite' ? 80 : (type === 'ranged' ? 45 : (type === 'exploder' ? 70 : 50 + Math.random() * 30)));
                let enemy = {
                    x, y, type,
                    radius: type === 'boss' ? 32 : (type === 'elite' ? 20 : (type === 'exploder' ? 16 : 13)),
                    hp: 0, maxHP: 0,
                    speed,
                    damage: type === 'boss' ? 3 : (type === 'elite' ? 2 : (type === 'exploder' ? 4 : 1)),
                    expValue: type === 'boss' ? 100 : (type === 'elite' ? 15 : 5),
                    color: type === 'boss' ? '#f0a030' : (type === 'elite' ? '#c060e0' : (type === 'ranged' ? '#e07040' : (type === 'exploder' ? '#ff4040' : '#e05050'))),
                    glowColor: type === 'boss' ? '#ffcc00' : (type === 'elite' ? '#d080ff' : (type === 'ranged' ? '#ff8844' : (type === 'exploder' ? '#ff6666' : '#ff6666'))),
                    pulsePhase: Math.random() * Math.PI * 2,
                    hitFlash: 0,
                    attackTimer: type === 'ranged' ? 1.2 + Math.random() * 0.8 : 0,
                    explodeTriggered: false,
                };
                if (type === 'boss') { let bossTier = Math.floor(waveNumber / 10); enemy.maxHP = Math.round(300 + (bossTier - 1) * 900); }
                else if (type === 'elite') { enemy.maxHP = Math.round(15 * Math.pow(1.3, waveNumber - 1)); if (enemy.maxHP < 15) enemy.maxHP = 15; }
                else { enemy.maxHP = Math.round(5 * Math.pow(1.3, waveNumber - 1)); if (enemy.maxHP < 5) enemy.maxHP = 5; }
                enemy.maxHP = Math.round(enemy.maxHP * difficultyMultiplier);
                enemy.hp = enemy.maxHP;
                enemies.push(enemy);
                enemiesSpawnedThisWave++;
            }

            function generateUpgradeChoices() {
                let choices = [];
                let attributes = ['damage', 'maxHP', 'attackSpeed', 'moveSpeed'];
                let attrNames = { 'damage': '伤害', 'maxHP': '血量', 'attackSpeed': '攻速', 'moveSpeed': '移速' };
                let attrCardClasses = { 'damage': 'card-damage', 'maxHP': 'card-hp', 'attackSpeed': 'card-atkspeed', 'moveSpeed': 'card-speed' };
                const templates = [
                    { name: 'quadratic', gen: () => { let a = Math.floor(Math.random() * 3) + 1; let b = Math.floor(Math.random() * 5) + 1; let c = Math.floor(Math.random() * 6) - 2; let x = Math.floor(Math.random() * 4) + 2; return { expr: `${a}x²+${b}x${c>=0?'+'+c:c}`, vars: `x=${x}`, value: a * x * x + b * x + c }; } },
                    { name: 'bilinear', gen: () => { let a = Math.floor(Math.random() * 4) + 1; let b = Math.floor(Math.random() * 4) + 1; let c = Math.floor(Math.random() * 5) - 1; let x = Math.floor(Math.random() * 3) + 2; let y = Math.floor(Math.random() * 3) + 2; return { expr: `${a}x+${b}y${c>=0?'+'+c:c}`, vars: `x=${x}, y=${y}`, value: a * x + b * y + c }; } },
                    { name: 'fraction', gen: () => { let a = Math.floor(Math.random() * 3) + 2; let b = Math.floor(Math.random() * 5); let c = Math.floor(Math.random() * 3) + 1; let x = Math.floor(Math.random() * 3) + 3; let y = Math.floor(Math.random() * 3) + 1; let denom = y + c; let num = a * x + b; return { expr: `(${a}x+${b})/(y+${c})`, vars: `x=${x}, y=${y}`, value: Math.round(num / denom * 10) / 10 }; } },
                    { name: 'sqrt', gen: () => { let a = Math.floor(Math.random() * 4) + 2; let b = Math.floor(Math.random() * 3); let c = Math.floor(Math.random() * 4) + 1; let x = Math.floor(Math.random() * 3) + 3; let inner = a * x + b; return { expr: `√(${a}x+${b})+${c}`, vars: `x=${x}`, value: Math.round((Math.sqrt(inner) + c) * 10) / 10 }; } },
                    { name: 'sqfrac', gen: () => { let a = Math.floor(Math.random() * 3) + 1; let b = Math.floor(Math.random() * 3) + 1; let x = Math.floor(Math.random() * 3) + 2; let y = Math.floor(Math.random() * 3) + 2; let num = (x + a) * (x + a); let denom = y + b; return { expr: `(x+${a})²/(y+${b})`, vars: `x=${x}, y=${y}`, value: Math.round(num / denom * 10) / 10 }; } },
                    { name: 'mixed', gen: () => { let a = Math.floor(Math.random() * 3) + 2; let b = Math.floor(Math.random() * 2) + 1; let x = Math.floor(Math.random() * 3) + 2; let y = Math.floor(Math.random() * 3) + 1; return { expr: `${a}(x+y)+${b}xy`, vars: `x=${x}, y=${y}`, value: a * (x + y) + b * x * y }; } },
                ];
                for (let i = 0; i < 3; i++) {
                    let attr = attributes[Math.floor(Math.random() * attributes.length)];
                    let template = templates[Math.floor(Math.random() * templates.length)];
                    let generated = template.gen();
                    let computedValue = generated.value;
                    if (computedValue < 1) computedValue = 1;
                    if (computedValue > 80) computedValue = 80;
                    if (attr === 'attackSpeed' && computedValue > 20) computedValue = Math.round(computedValue * 0.3);
                    if (attr === 'moveSpeed' && computedValue > 40) computedValue = Math.round(computedValue * 0.5);
                    choices.push({ attr, attrName: attrNames[attr], cardClass: attrCardClasses[attr], displayExpr: generated.expr, displayVars: generated.vars, computedValue: computedValue });
                }
                return choices;
            }
            function applyUpgrade(choice) {
                let val = choice.computedValue;
                let attr = choice.attr;
                if (attr === 'damage') { player.damage += val; if (player.damage < 0.5) player.damage = 0.5; player.damage = Math.round(player.damage * 10) / 10; }
                else if (attr === 'maxHP') { player.maxHP += Math.round(val); player.maxHP = Math.round(player.maxHP); if (player.maxHP < 3) player.maxHP = 3; player.hp = Math.min(player.hp + Math.round(val * 0.6), player.maxHP); if (player.hp > player.maxHP) player.hp = player.maxHP; if (player.hp < 1) player.hp = 1; }
                else if (attr === 'attackSpeed') { player.attackCooldown -= val * 0.06; if (player.attackCooldown < 0.12) player.attackCooldown = 0.12; if (player.attackCooldown > 5) player.attackCooldown = 5; player.attackCooldown = Math.round(player.attackCooldown * 100) / 100; }
                else if (attr === 'moveSpeed') { player.moveSpeed += val * 12; if (player.moveSpeed < 80) player.moveSpeed = 80; if (player.moveSpeed > 600) player.moveSpeed = 600; player.moveSpeed = Math.round(player.moveSpeed); }
            }
            function triggerUpgrade() { isChoosingUpgrade = true; isPaused = true; upgradeChoices = generateUpgradeChoices(); upgradeTimer = UPGRADE_TIME_LIMIT; upgradeModal.classList.add('active'); renderUpgradeOptions(); timerFillEl.style.width = '100%'; }
            function renderUpgradeOptions() {
                upgradeOptionsEl.innerHTML = '';
                upgradeChoices.forEach((choice, index) => {
                    let card = document.createElement('div');
                    card.className = 'upgrade-card ' + choice.cardClass;
                    card.innerHTML = `<div class="key-hint">${index+1}</div><div class="vars">${choice.displayVars}</div><div class="expr">${choice.displayExpr}</div><div class="attr-name">${choice.attrName} ≈${choice.computedValue}</div>`;
                    card.addEventListener('click', () => selectUpgrade(index));
                    upgradeOptionsEl.appendChild(card);
                });
            }
            function selectUpgrade(index) { if (!isChoosingUpgrade) return; if (index < 0 || index >= upgradeChoices.length) return; applyUpgrade(upgradeChoices[index]); finishUpgrade(); }
            function finishUpgrade() { isChoosingUpgrade = false; isPaused = false; upgradeModal.classList.remove('active'); upgradeChoices = []; player.level++; player.exp = Math.max(0, player.exp - player.expToNext); player.expToNext = getExpToNext(player.level); updateUI(); checkWeaponUpgrade(); }
            function checkWeaponUpgrade() { if (player.level % 5 === 0 && player.level > 0) { triggerWeaponSelect(); } }

            function generateShopItems() {
                const allItems = [
                    { type: 'killHeal', name: '杀怪回血', desc: '击杀敌人回复3点血量', icon: 'fa-heart', costType: 'exp', costAmount: 28, effectData: { type: 'killHeal', amount: 3 } },
                    { type: 'shield', name: '伤害免疫', desc: '获得4次伤害免疫护盾', icon: 'fa-shield-alt', costType: 'exp', costAmount: 32, effectData: { type: 'shield', charges: 4 } },
                    { type: 'fullScreenAttack', name: '全屏弹幕', desc: '每7秒向全屏发射子弹(50%伤害)', icon: 'fa-bomb', costType: 'exp', costAmount: 40, effectData: { type: 'fullScreenAttack', interval: 7, damageRatio: 0.5, timer: 0 } },
                    { type: 'bonusExp', name: '额外经验', desc: '击杀敌人额外获得4点经验', icon: 'fa-star', costType: 'exp', costAmount: 22, effectData: { type: 'bonusExp', amount: 4 } },
                    { type: 'periodicInvincible', name: '周期无敌', desc: '每14秒获得2.5秒无敌', icon: 'fa-clock', costType: 'maxHP', costAmount: 6, effectData: { type: 'periodicInvincible', interval: 14, duration: 2.5, timer: 0, active: false, activeTimer: 0 } },
                    { type: 'percentDamage', name: '百分比伤害', desc: '子弹附加敌人当前血量5%的伤害', icon: 'fa-percent', costType: 'exp', costAmount: 45, effectData: { type: 'percentDamage', ratio: 0.05 } },
                    { type: 'knockback', name: '周期击退', desc: '每9秒击退周围敌人', icon: 'fa-arrow-circle-up', costType: 'exp', costAmount: 26, effectData: { type: 'knockback', interval: 9, timer: 0, radius: 200, force: 160 } },
                ];
                let shuffled = [...allItems].sort(() => Math.random() - 0.5);
                return shuffled.slice(0, 3);
            }
            function canAfford(item) { if (item.costType === 'exp') return player.exp >= item.costAmount; if (item.costType === 'maxHP') return player.maxHP > item.costAmount + 3; return false; }
            function purchaseItem(item) { if (!canAfford(item)) return false; if (item.costType === 'exp') { player.exp -= item.costAmount; } else { player.maxHP -= item.costAmount; player.hp = Math.min(player.hp, player.maxHP); if (player.hp < 1) player.hp = 1; } addEffect(item.effectData); updateUI(); return true; }
            function triggerShop() { isShopping = true; isPaused = true; shopChoices = generateShopItems(); shopTimer = SHOP_TIME_LIMIT; shopModal.classList.add('active'); renderShopOptions(); shopTimerFillEl.style.width = '100%'; }
            function renderShopOptions() {
                shopOptionsEl.innerHTML = '';
                shopChoices.forEach((item, index) => {
                    let card = document.createElement('div');
                    card.className = 'shop-card';
                    if (!canAfford(item)) card.classList.add('unaffordable');
                    let costClass = item.costType === 'exp' ? 'cost-exp' : 'cost-hp';
                    let costIcon = item.costType === 'exp' ? 'fa-star' : 'fa-heart';
                    let costLabel = item.costType === 'exp' ? '经验' : '最大血量';
                    card.innerHTML = `<div class="key-hint">${index+1}</div><div class="shop-icon"><i class="fas ${item.icon}"></i></div><div class="shop-name">${item.name}</div><div class="shop-desc">${item.desc}</div><div class="shop-cost ${costClass}"><i class="fas ${costIcon}"></i> ${item.costAmount} ${costLabel}</div>`;
                    card.addEventListener('click', () => selectShopItem(index));
                    shopOptionsEl.appendChild(card);
                });
            }
            function selectShopItem(index) { if (!isShopping) return; if (index < 0 || index >= shopChoices.length) return; if (!canAfford(shopChoices[index])) return; purchaseItem(shopChoices[index]); finishShop(); }
            function finishShop() { isShopping = false; isPaused = false; shopModal.classList.remove('active'); shopChoices = []; pendingShop = false; bossDefeatedThisWave = false; updateUI(); startWave(waveNumber + 1); }

            function generateMonsterBuffChoices() {
                const buffs = [
                    { name: '生命强化', desc: '怪物血量+30%', apply: () => { for (let e of enemies) e.maxHP = Math.round(e.maxHP * 1.3); e.hp = e.maxHP; } },
                    { name: '速度激增', desc: '怪物移速+40%', apply: () => { for (let e of enemies) e.speed *= 1.4; } },
                    { name: '伤害提升', desc: '怪物伤害+2', apply: () => { for (let e of enemies) e.damage += 2; } },
                    { name: '增援部队', desc: '额外生成3只怪物', apply: () => { for (let i=0;i<3;i++) spawnEnemy('normal'); totalEnemiesToSpawn+=3; enemiesRemainingInWave+=3; } },

                ctx.restore();
            }

            function init() { resizeCanvas(); player.x = GAME_W / 2; player.y = GAME_H / 2; player.expToNext = getExpToNext(1); updateUI(); difficultyModal.style.display = 'flex'; requestAnimationFrame(gameLoop); }
            init();
        })();
    </script>
</body>
</html>
