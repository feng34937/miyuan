<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>学海 - 肉鸽射击游戏</title>
    <!-- 网站标签页图标（png） -->
    <link rel="icon" href="https://feng34937.github.io/miyuan/MIYUAN_LOGO_NOBACKGROUND.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg: #0a0a1a; --panel-bg: rgba(10,10,40,0.85); --text: #e0e0f0;
            --gold: #f0c040; --danger: #e04040; --heal: #40d070; --accent: #6090f0;
            --purple: #b060e0; --cyan: #40d0d0;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        html,body { width:100%; height:100%; overflow:hidden; background:#050510; font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif; user-select:none; -webkit-user-select:none; touch-action:none; display:flex; justify-content:center; align-items:center; }
        #game-container { position:fixed; top:0; left:0; width:100vw; height:100vh; overflow:hidden; background:#0a0a20; border:none; border-radius:0; }
        canvas { display:block; width:100%; height:100%; border-radius:0; touch-action:none; }
        #ui-overlay { position:absolute; top:0; left:0; right:0; pointer-events:none; padding:8px 10px; display:flex; justify-content:space-between; align-items:flex-start; gap:4px; flex-wrap:wrap; z-index:10; }
        .ui-panel { background:rgba(0,0,0,0.7); border:1px solid rgba(255,255,255,0.18); border-radius:0; padding:5px 8px; color:var(--text); font-size:10px; backdrop-filter:blur(8px); pointer-events:auto; min-width:55px; text-align:center; letter-spacing:0.5px; display:flex; flex-direction:column; align-items:center; gap:1px; }
        .ui-panel .label { font-size:9px; opacity:0.8; display:flex; align-items:center; gap:3px; }
        .ui-panel .value { font-size:14px; font-weight:700; color:#fff; text-shadow:0 0 8px rgba(255,255,255,0.35); }
        .hp-bar-bg { width:100%; height:3px; background:rgba(255,255,255,0.12); margin-top:1px; overflow:hidden; }
        .hp-bar-fill { height:100%; background:linear-gradient(90deg,#e04040,#f06060); transition:width 0.3s; }
        .exp-bar-bg { width:100%; height:2px; background:rgba(255,255,255,0.1); margin-top:1px; overflow:hidden; }
        .exp-bar-fill { height:100%; background:linear-gradient(90deg,#6090f0,#80b0ff); transition:width 0.3s; }
        #upgrade-modal,#shop-modal,#monster-buff-modal,#bullet-select-modal { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.82); display:none; justify-content:center; align-items:center; z-index:100; pointer-events:auto; flex-direction:column; backdrop-filter:blur(5px); }
        #upgrade-modal.active,#shop-modal.active,#monster-buff-modal.active,#bullet-select-modal.active { display:flex; }
        .modal-title { font-size:24px; font-weight:900; color:#f0d060; text-shadow:0 0 20px rgba(240,200,60,0.55); margin-bottom:4px; letter-spacing:2px; text-align:center; }
        #shop-modal .modal-title { color:#40d0d0; } #monster-buff-modal .modal-title { color:#e06060; } #bullet-select-modal .modal-title { color:#80c0ff; }
        .modal-subtitle { font-size:11px; color:#ccc; margin-bottom:10px; text-align:center; max-width:85vw; }
        .timer-bar { width:400px; max-width:80vw; height:5px; background:rgba(255,255,255,0.13); margin-bottom:14px; overflow:hidden; }
        .timer-fill { height:100%; background:#f08040; transition:width 0.1s linear; }
        #shop-modal .timer-fill { background:#40c0c0; } #monster-buff-modal .timer-fill { background:#e06060; } #bullet-select-modal .timer-fill { background:#6090f0; }
        .options-container { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
        .option-card { background:rgba(20,20,50,0.85); border:2px solid rgba(255,255,255,0.28); border-radius:0; padding:14px 16px; cursor:pointer; min-width:130px; max-width:200px; text-align:center; transition:all 0.2s; color:#fff; pointer-events:auto; position:relative; overflow:hidden; backdrop-filter:blur(12px); }
        .option-card:hover { border-color:#f0d060; box-shadow:0 0 30px rgba(240,200,60,0.4); transform:translateY(-4px); }
        .shop-card:hover { border-color:#40d0d0; box-shadow:0 0 30px rgba(64,208,208,0.4); }
        .monster-buff-card:hover { border-color:#e06060; box-shadow:0 0 30px rgba(224,96,96,0.4); }
        .bullet-card:hover { border-color:#80c0ff; box-shadow:0 0 30px rgba(128,192,255,0.4); }
        .unaffordable { opacity:0.45; pointer-events:none; border-color:rgba(255,80,80,0.5); }
        .key-hint { position:absolute; top:6px; right:8px; font-size:9px; opacity:0.5; background:rgba(255,255,255,0.08); padding:2px 5px; }
        #difficulty-modal { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.86); display:flex; justify-content:center; align-items:center; z-index:200; pointer-events:auto; flex-direction:column; backdrop-filter:blur(6px); }
        #difficulty-modal .title { font-size:34px; font-weight:900; color:#f0d060; text-shadow:0 0 30px rgba(240,200,60,0.65); margin-bottom:4px; }
        #difficulty-modal .subtitle { font-size:14px; color:#ccc; margin-bottom:20px; }
        .diff-options { display:flex; gap:16px; flex-wrap:wrap; justify-content:center; }
        .diff-card { background:rgba(15,15,40,0.85); border:2px solid rgba(255,255,255,0.23); border-radius:0; padding:16px 20px; cursor:pointer; min-width:140px; text-align:center; transition:all 0.2s; color:#fff; pointer-events:auto; backdrop-filter:blur(12px); }
        .diff-card:hover { transform:translateY(-6px); box-shadow:0 0 35px rgba(200,180,60,0.48); border-color:#f0d060; }
        #gameover-modal { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.86); display:none; justify-content:center; align-items:center; z-index:150; pointer-events:auto; flex-direction:column; backdrop-filter:blur(6px); }
        #gameover-modal.active { display:flex; }
        #copyright { position:absolute; bottom:8px; left:50%; transform:translateX(-50%); color:rgba(255,255,255,0.35); font-size:10px; pointer-events:none; z-index:5; }
        #mobile-controls { position:absolute; bottom:16px; right:16px; display:flex; flex-direction:column; align-items:center; gap:3px; z-index:20; pointer-events:auto; }
        .ctrl-row { display:flex; gap:3px; }
        .ctrl-btn { width:44px; height:44px; background:rgba(20,20,40,0.7); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,0.25); border-radius:0; display:flex; align-items:center; justify-content:center; color:#fff; font-size:20px; cursor:pointer; transition:all 0.15s; }
        .ctrl-btn:active { background:rgba(80,120,240,0.5); border-color:#80a0ff; transform:scale(0.93); }
        #effects-indicator { position:absolute; bottom:80px; left:10px; display:flex; flex-wrap:wrap; gap:4px; z-index:15; pointer-events:none; }
        .effect-icon { width:24px; height:24px; background:rgba(0,0,0,0.65); border:1px solid rgba(255,255,255,0.25); border-radius:0; display:flex; align-items:center; justify-content:center; font-size:12px; color:#fff; backdrop-filter:blur(4px); position:relative; }
        .effect-icon .badge { position:absolute; top:-4px; right:-6px; font-size:7px; background:#e04040; color:#fff; border-radius:0; padding:0 2px; }
        @media (max-width:600px) { .ui-panel { padding:3px 5px; font-size:8px; min-width:40px; } .option-card { min-width:95px; padding:10px; } .modal-title { font-size:20px; } .ctrl-btn { width:38px; height:38px; font-size:16px; } }
    </style>
</head>
<body>
<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    <div id="ui-overlay">
        <div class="ui-panel"><div class="label"><i class="fas fa-heart"></i> 血量</div><div class="value" id="hp-value">10/10</div><div class="hp-bar-bg"><div class="hp-bar-fill" id="hp-bar" style="width:100%"></div></div></div>
        <div class="ui-panel"><div class="label"><i class="fas fa-water"></i> 波次</div><div class="value" id="wave-value">1</div></div>
        <div class="ui-panel"><div class="label"><i class="fas fa-star"></i> 等级</div><div class="value" id="level-value">1</div><div class="exp-bar-bg"><div class="exp-bar-fill" id="exp-bar" style="width:0%"></div></div><div style="font-size:8px;opacity:0.65" id="exp-text">0/10</div></div>
        <div class="ui-panel"><div class="label"><i class="fas fa-bolt"></i> 伤害</div><div class="value" id="dmg-value">2</div></div>
        <div class="ui-panel"><div class="label"><i class="fas fa-stopwatch"></i> 攻速</div><div class="value" id="atkspd-value">1.5s</div></div>
        <div class="ui-panel"><div class="label"><i class="fas fa-skull"></i> 击杀</div><div class="value" id="kills-value">0</div></div>
        <div class="ui-panel"><div class="label"><i class="fas fa-crosshairs"></i> 子弹</div><div class="value" id="bullet-type-value">普通</div></div>
    </div>
    <div id="difficulty-modal">
        <div class="title"><i class="fas fa-book"></i> 学 海</div>
        <div class="subtitle">选择你的起点</div>
        <div class="diff-options">
            <div class="diff-card" onclick="selectDifficulty('easy')"><div><i class="fas fa-seedling"></i> 年级前1000</div><div style="font-size:10px;opacity:0.7;">伤害+50% · 血量+50%</div></div>
            <div class="diff-card" onclick="selectDifficulty('normal')"><div><i class="fas fa-user-graduate"></i> 年级前300</div><div style="font-size:10px;opacity:0.7;">无改动</div></div>
            <div class="diff-card" onclick="selectDifficulty('hard')"><div><i class="fas fa-crown"></i> 年级前10</div><div style="font-size:10px;opacity:0.7;">怪物血量+50% · 数量+50%</div></div>
        </div>
    </div>
    <div id="upgrade-modal">
        <div class="modal-title"><i class="fas fa-level-up-alt"></i> 升级！选择奖励</div>
        <div class="modal-subtitle">根据表达式选择强化属性（按1/2/3或点击）</div>
        <div class="timer-bar"><div class="timer-fill" id="timer-fill" style="width:100%"></div></div>
        <div class="options-container" id="upgrade-options"></div>
    </div>
    <div id="shop-modal">
        <div class="modal-title"><i class="fas fa-store-alt"></i> 学海补给站</div>
        <div class="modal-subtitle">花费经验或血量购买强化（按1/2/3或点击）</div>
        <div class="timer-bar"><div class="timer-fill" id="shop-timer-fill" style="width:100%"></div></div>
        <div class="options-container" id="shop-options"></div>
    </div>
    <div id="monster-buff-modal">
        <div class="modal-title"><i class="fas fa-skull"></i> 怪物强化选择</div>
        <div class="modal-subtitle">为本波怪物选择一个增益（按1/2/3或点击）</div>
        <div class="timer-bar"><div class="timer-fill" id="monster-buff-timer-fill" style="width:100%"></div></div>
        <div class="options-container" id="monster-buff-options"></div>
    </div>
    <div id="bullet-select-modal">
        <div class="modal-title"><i class="fas fa-crosshairs"></i> 选择子弹类型</div>
        <div class="modal-subtitle">更换主武器（按1/2/3或点击）</div>
        <div class="timer-bar"><div class="timer-fill" id="bullet-timer-fill" style="width:100%"></div></div>
        <div class="options-container" id="bullet-options"></div>
    </div>
    <div id="gameover-modal">
        <div class="modal-title"><i class="fas fa-skull-crossbones"></i> 学海无涯</div>
        <div class="stats" id="gameover-stats"></div>
        <button onclick="restartGame()"><i class="fas fa-redo-alt"></i> 重新挑战</button>
    </div>
    <div id="effects-indicator"></div>
    <div id="mobile-controls">
        <div class="ctrl-row"><div class="ctrl-btn" id="btn-up"><i class="fas fa-chevron-up"></i></div></div>
        <div class="ctrl-row">
            <div class="ctrl-btn" id="btn-left"><i class="fas fa-chevron-left"></i></div>
            <div class="ctrl-btn" id="btn-down"><i class="fas fa-chevron-down"></i></div>
            <div class="ctrl-btn" id="btn-right"><i class="fas fa-chevron-right"></i></div>
        </div>
    </div>
    <div id="copyright">© 2026 米遇安</div>
</div>
<script>
(function() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    let GAME_W = window.innerWidth, GAME_H = window.innerHeight;
    function resizeCanvas() {
        GAME_W = window.innerWidth; GAME_H = window.innerHeight;
        canvas.width = GAME_W; canvas.height = GAME_H;
        if (player) {
            player.x = Math.min(player.x, GAME_W - player.radius);
            player.y = Math.min(player.y, GAME_H - player.radius);
            player.x = Math.max(player.x, player.radius);
            player.y = Math.max(player.y, player.radius);
        }
    }
    window.addEventListener('resize', resizeCanvas);

    const elements = {
        hpValue: document.getElementById('hp-value'), hpBar: document.getElementById('hp-bar'),
        waveValue: document.getElementById('wave-value'), levelValue: document.getElementById('level-value'),
        expBar: document.getElementById('exp-bar'), expText: document.getElementById('exp-text'),
        dmgValue: document.getElementById('dmg-value'), atkspdValue: document.getElementById('atkspd-value'),
        killsValue: document.getElementById('kills-value'), bulletTypeValue: document.getElementById('bullet-type-value'),
        upgradeModal: document.getElementById('upgrade-modal'), upgradeOptions: document.getElementById('upgrade-options'), timerFill: document.getElementById('timer-fill'),
        shopModal: document.getElementById('shop-modal'), shopOptions: document.getElementById('shop-options'), shopTimerFill: document.getElementById('shop-timer-fill'),
        monsterBuffModal: document.getElementById('monster-buff-modal'), monsterBuffOptions: document.getElementById('monster-buff-options'), monsterBuffTimerFill: document.getElementById('monster-buff-timer-fill'),
        bulletSelectModal: document.getElementById('bullet-select-modal'), bulletOptions: document.getElementById('bullet-options'), bulletTimerFill: document.getElementById('bullet-timer-fill'),
        difficultyModal: document.getElementById('difficulty-modal'), gameoverModal: document.getElementById('gameover-modal'), gameoverStats: document.getElementById('gameover-stats'),
        effectsIndicator: document.getElementById('effects-indicator')
    };

    let gameStarted = false, gameOver = false, isPaused = false;
    let difficulty = null, difficultyMultiplier = 1, monsterCountMultiplier = 1, playerDamageMultiplier = 1, playerHPMultiplier = 1;
    let bossDefeatedThisWave = false, pendingShop = false, pendingMonsterBuff = false, pendingBulletSelect = false;

    const player = {
        x: GAME_W/2, y: GAME_H/2, radius: 16, maxHP: 10, hp: 10, damage: 2, attackCooldown: 1.5, attackTimer: 0,
        moveSpeed: 220, invincibleTimer: 0, level: 1, exp: 0, expToNext: 10, kills: 0, effects: [], bulletMode: 'normal'
    };

    let bullets = [], enemyBullets = [], enemies = [], expOrbs = [], particles = [];
    let waveNumber = 1, enemiesRemainingInWave = 0, waveDelayTimer = 0, totalEnemiesToSpawn = 0, enemiesSpawnedThisWave = 0;
    let spawnQueue = [], spawnTimer = 0;
    let monsterBuffs = [];

    let upgradeChoices = [], upgradeTimer = 0; const UPGRADE_TIME_LIMIT = 8; let isChoosingUpgrade = false;
    let shopChoices = [], shopTimer = 0; const SHOP_TIME_LIMIT = 12; let isShopping = false;
    let monsterBuffChoices = [], monsterBuffTimer = 0; const MONSTER_BUFF_TIME_LIMIT = 8; let isChoosingMonsterBuff = false;
    let bulletChoices = [], bulletTimer = 0; const BULLET_TIME_LIMIT = 8; let isChoosingBullet = false;

    let keys = {};
    let touchActive = false, touchStartX = 0, touchStartY = 0, touchCurrentX = 0, touchCurrentY = 0;
    const touchThreshold = 8;

    function getExpToNext(level) {
        if (level === 1) return 10; if (level === 2) return 20; if (level === 3) return 30;
        if (level === 4) return 50; if (level === 5) return 100; if (level === 6) return 200;
        return 200 + (level - 6) * 100;
    }

    function hasEffect(type) { return player.effects.some(e=>e.type===type); }
    function getEffect(type) { return player.effects.find(e=>e.type===type); }
    function addEffect(effect) {
        const existing = getEffect(effect.type);
        if (existing) {
            if (effect.type==='shield') existing.charges = (existing.charges||0)+(effect.charges||3);
            else if (effect.type==='killHeal') existing.amount = (existing.amount||0)+(effect.amount||2);
            else if (effect.type==='bonusExp') existing.amount = (existing.amount||0)+(effect.amount||3);
            else if (effect.type==='percentDamage') existing.ratio = (existing.ratio||0)+(effect.ratio||0.04);
            else if (effect.type==='fullScreenAttack') { existing.interval = Math.max(3,(existing.interval||8)-1); existing.damageRatio = (existing.damageRatio||0.5)+0.1; }
            else if (effect.type==='periodicInvincible') { existing.interval = Math.max(5,(existing.interval||15)-2); existing.duration = (existing.duration||2)+0.5; }
            else if (effect.type==='knockback') { existing.interval = Math.max(4,(existing.interval||10)-1); existing.force = (existing.force||150)+30; }
        } else {
            const e = {...effect};
            if (e.type==='fullScreenAttack') { e.timer=e.interval||8; e.damageRatio=e.damageRatio||0.5; }
            else if (e.type==='periodicInvincible') { e.timer=e.interval||15; e.duration=e.duration||2; e.active=false; e.activeTimer=0; }
            else if (e.type==='knockback') { e.timer=e.interval||10; e.radius=e.radius||200; e.force=e.force||150; }
            else if (e.type==='shield') e.charges=e.charges||3;
            player.effects.push(e);
        }
        updateEffectsUI();
    }
    function removeEffect(type) { const idx = player.effects.findIndex(e=>e.type===type); if(idx>=0) player.effects.splice(idx,1); updateEffectsUI(); }
    function updateEffectsUI() {
        elements.effectsIndicator.innerHTML = '';
        const icons = {
            killHeal: '<i class="fas fa-heart" style="color:#50d070;"></i>',
            shield: '<i class="fas fa-shield-alt" style="color:#80c0ff;"></i>',
            fullScreenAttack: '<i class="fas fa-bomb" style="color:#ffa040;"></i>',
            bonusExp: '<i class="fas fa-star" style="color:#f0d060;"></i>',
            periodicInvincible: '<i class="fas fa-clock" style="color:#d0a0ff;"></i>',
            percentDamage: '<i class="fas fa-percent" style="color:#ff8080;"></i>',
            knockback: '<i class="fas fa-arrow-circle-up" style="color:#80e0e0;"></i>'
        };
        player.effects.forEach(e=>{
            const div = document.createElement('div'); div.className='effect-icon';
            div.innerHTML = icons[e.type] || '<i class="fas fa-question"></i>';
            if(e.type==='shield'&&e.charges>0){ const badge = document.createElement('span'); badge.className='badge'; badge.textContent=e.charges; div.appendChild(badge); }
            elements.effectsIndicator.appendChild(div);
        });
    }

    // 子弹选择
    function generateBulletChoices() {
        return [
            { name: '散射弹', desc: '三方向', icon: 'fa-arrows-alt', mode: 'spread' },
            { name: '激光', desc: '穿透', icon: 'fa-bolt', mode: 'laser' },
            { name: '机枪', desc: '极速', icon: 'fa-gun', mode: 'machinegun' }
        ];
    }
    function triggerBulletSelect() { isChoosingBullet=true; isPaused=true; bulletChoices=generateBulletChoices(); bulletTimer=BULLET_TIME_LIMIT; elements.bulletSelectModal.classList.add('active'); renderBulletOptions(); }
    function renderBulletOptions() {
        elements.bulletOptions.innerHTML='';
        bulletChoices.forEach((c,i)=>{
            const card=document.createElement('div'); card.className='option-card bullet-card';
            card.innerHTML=`<div class="key-hint">${i+1}</div><div style="font-size:24px;"><i class="fas ${c.icon}"></i></div><div style="font-weight:700;">${c.name}</div><div style="font-size:10px;">${c.desc}</div>`;
            card.addEventListener('click',()=>selectBullet(i));
            elements.bulletOptions.appendChild(card);
        });
    }
    function selectBullet(index) {
        if(!isChoosingBullet||index<0||index>=bulletChoices.length) return;
        player.bulletMode=bulletChoices[index].mode;
        if(player.bulletMode==='machinegun') { player.attackCooldown=Math.max(0.2,player.attackCooldown*0.3); player.damage*=0.5; }
        else if(player.bulletMode==='laser') { player.attackCooldown=Math.max(0.5,player.attackCooldown*1.2); player.damage*=0.7; }
        finishBulletSelect();
    }
    function finishBulletSelect() { isChoosingBullet=false; isPaused=false; pendingBulletSelect=false; elements.bulletSelectModal.classList.remove('active'); updateUI(); }

    // 怪物增益
    function generateMonsterBuffs() {
        return [
            { name: '迅捷', desc: '移速+40%', effect: m=>{ m.speed*=1.4; } },
            { name: '坚甲', desc: '血量+50%', effect: m=>{ m.maxHP=Math.round(m.maxHP*1.5); m.hp=m.maxHP; } },
            { name: '狂暴', desc: '伤害+2', effect: m=>{ m.damage+=2; } },
            { name: '荆棘', desc: '反弹接触伤害', effect: null },
            { name: '恢复', desc: '死亡治疗周围', effect: null }
        ];
    }
    function triggerMonsterBuffSelect() { isChoosingMonsterBuff=true; isPaused=true; pendingMonsterBuff=false; monsterBuffChoices=generateMonsterBuffs(); monsterBuffTimer=MONSTER_BUFF_TIME_LIMIT; elements.monsterBuffModal.classList.add('active'); renderMonsterBuffOptions(); }
    function renderMonsterBuffOptions() {
        elements.monsterBuffOptions.innerHTML='';
        monsterBuffChoices.forEach((c,i)=>{
            const card=document.createElement('div'); card.className='option-card monster-buff-card';
            card.innerHTML=`<div class="key-hint">${i+1}</div><div style="font-size:20px;"><i class="fas fa-skull"></i></div><div style="font-weight:700;">${c.name}</div><div style="font-size:10px;">${c.desc}</div>`;
            card.addEventListener('click',()=>selectMonsterBuff(i));
            elements.monsterBuffOptions.appendChild(card);
        });
    }
    function selectMonsterBuff(index) {
        if(!isChoosingMonsterBuff||index<0||index>=monsterBuffChoices.length) return;
        monsterBuffs.push(monsterBuffChoices[index]);
        finishMonsterBuffSelect();
    }
    function finishMonsterBuffSelect() { isChoosingMonsterBuff=false; isPaused=false; elements.monsterBuffModal.classList.remove('active'); startWaveAfterBuff(); }

    window.selectDifficulty = function(diff) {
        difficulty = diff;
        if(diff==='easy'){ playerDamageMultiplier=1.5; playerHPMultiplier=1.5; difficultyMultiplier=1.0; monsterCountMultiplier=1.0; }
        else if(diff==='normal'){ playerDamageMultiplier=1.0; playerHPMultiplier=1.0; difficultyMultiplier=1.0; monsterCountMultiplier=1.0; }
        else { playerDamageMultiplier=1.0; playerHPMultiplier=1.0; difficultyMultiplier=1.5; monsterCountMultiplier=1.5; }
        player.maxHP = Math.round(10*playerHPMultiplier); player.hp = player.maxHP;
        player.damage = Math.round(2*playerDamageMultiplier);
        elements.difficultyModal.style.display = 'none';
        gameStarted = true;
        startWave(1);
        updateUI();
    };

    function startWave(waveNum) {
        waveNumber = waveNum; waveDelayTimer = 0; bossDefeatedThisWave = false; pendingShop = false;
        monsterBuffs = [];
        if(waveNum % 5 === 0 && waveNum > 0) {
            pendingMonsterBuff = true;
            triggerMonsterBuffSelect();
            return;
        }
        startWaveAfterBuff();
    }
    function startWaveAfterBuff() {
        let baseCount = 3 + Math.floor(waveNumber * 1.2);
        baseCount = Math.round(baseCount * monsterCountMultiplier);
        if(baseCount<3) baseCount=3;
        let hasBoss = (waveNumber%10===0);
        let eliteCount = Math.floor(waveNumber/3);
        let rangedCount = Math.floor(waveNumber/4);
        let exploderCount = Math.floor(waveNumber/5);
        let dropCount = Math.floor(waveNumber/6);
        totalEnemiesToSpawn = baseCount + eliteCount + rangedCount + exploderCount + dropCount + (hasBoss?1:0);
        enemiesSpawnedThisWave = 0; enemiesRemainingInWave = totalEnemiesToSpawn;
        spawnQueue = []; spawnTimer = 0;
        if(hasBoss) spawnQueue.push({type:'boss',delay:0.5});
        for(let i=0;i<eliteCount;i++) spawnQueue.push({type:'elite',delay:0.3+i*0.6});
        for(let i=0;i<rangedCount;i++) spawnQueue.push({type:'ranged',delay:0.2+i*0.5});
        for(let i=0;i<exploderCount;i++) spawnQueue.push({type:'exploder',delay:0.4+i*0.7});
        for(let i=0;i<dropCount;i++) spawnQueue.push({type:'drop',delay:0.6+i*0.8});
        for(let i=0;i<baseCount;i++) spawnQueue.push({type:'normal',delay:0.1+i*0.25});
        spawnQueue.sort((a,b)=>a.type==='boss'?-1:b.type==='boss'?1:Math.random()-0.5);
        let cum=0;
        spawnQueue.forEach(item=>{ cum+=item.type==='boss'?0.8:(item.type==='elite'?0.5:0.2+Math.random()*0.4); item.delay=cum; });
        updateUI();
    }
    function applyMonsterBuffs(enemy) {
        monsterBuffs.forEach(buff => { if(buff.effect) buff.effect(enemy); });
    }
    function spawnEnemy(type) {
        let edge = Math.floor(Math.random()*4), x, y, margin=30;
        switch(edge){ case 0: x=-margin; y=Math.random()*GAME_H; break; case 1: x=GAME_W+margin; y=Math.random()*GAME_H; break; case 2: x=Math.random()*GAME_W; y=-margin; break; case 3: x=Math.random()*GAME_W; y=GAME_H+margin; break; }
        if(type==='drop') { x = player.x + (Math.random()*200-100); y = player.y + (Math.random()*200-100); x = Math.max(30, Math.min(GAME_W-30, x)); y = Math.max(30, Math.min(GAME_H-30, y)); }
        let speedMult = 0.65;
        let enemy = {
            x, y, type,
            radius: type==='boss'?32:(type==='elite'?20:(type==='ranged'?15:(type==='exploder'?14:(type==='drop'?16:13)))),
            hp:0, maxHP:0,
            speed: (type==='boss'?90:(type==='elite'?130:(type==='ranged'?70:(type==='exploder'?120:(type==='drop'?100:100+Math.random()*60)))))*speedMult,
            damage: type==='boss'?3:(type==='elite'?2:(type==='ranged'?1:(type==='exploder'?3:1))),
            expValue: type==='boss'?100:(type==='elite'?15:(type==='ranged'?10:(type==='exploder'?12:5))),
            color: type==='boss'?'#f0a030':(type==='elite'?'#c060e0':(type==='ranged'?'#40a0ff':(type==='exploder'?'#ff6040':(type==='drop'?'#80c0ff':'#e05050')))),
            glowColor: type==='boss'?'#ffcc00':(type==='elite'?'#d080ff':(type==='ranged'?'#80c0ff':(type==='exploder'?'#ff8040':(type==='drop'?'#a0d0ff':'#ff6666')))),
            pulsePhase: Math.random()*Math.PI*2, hitFlash:0, specialTimer: type==='ranged'?1.5+Math.random():0
        };
        if(type==='boss'){ let tier=Math.floor(waveNumber/10); enemy.maxHP=Math.round(300+(tier-1)*900); }
        else if(type==='elite'){ enemy.maxHP=Math.round(15*Math.pow(1.3,waveNumber-1)); if(enemy.maxHP<15)enemy.maxHP=15; }
        else { enemy.maxHP=Math.round(5*Math.pow(1.3,waveNumber-1)); if(enemy.maxHP<5)enemy.maxHP=5; }
        enemy.maxHP = Math.round(enemy.maxHP*difficultyMultiplier);
        applyMonsterBuffs(enemy);
        enemy.hp = enemy.maxHP;
        enemies.push(enemy);
        enemiesSpawnedThisWave++;
    }

    // 简化升级表达式
    function generateUpgradeChoices() {
        let choices = [], attributes = ['damage','maxHP','attackSpeed','moveSpeed'];
        let attrNames = {damage:'伤害',maxHP:'血量',attackSpeed:'攻速',moveSpeed:'移速'};
        const ops = ['+','-','×','÷','√','²','³'];
        for(let i=0;i<3;i++){
            let attr = attributes[Math.floor(Math.random()*attributes.length)];
            let op = ops[Math.floor(Math.random()*ops.length)];
            let num, expr, value;
            if(op==='√'){ let n=[4,9,16,25][Math.floor(Math.random()*4)]; expr=`√${n}`; value=Math.sqrt(n); }
            else if(op==='²'){ num=Math.floor(Math.random()*5)+2; expr=`${num}²`; value=num*num; }
            else if(op==='³'){ num=Math.floor(Math.random()*3)+2; expr=`${num}³`; value=num*num*num; }
            else { num=Math.floor(Math.random()*8)+2; expr=op+num; if(op==='+') value=num; else if(op==='-') value=-num; else if(op==='×') value=num; else value=1/num; }
            if(attr==='attackSpeed') value=value*0.5;
            if(attr==='moveSpeed') value=value*0.3;
            choices.push({attr, attrName:attrNames[attr], expr, value});
        }
        return choices;
    }
    function applyUpgrade(choice) {
        let val = choice.value;
        if(choice.attr==='damage'){ player.damage+=val; if(player.damage<0.5)player.damage=0.5; player.damage=Math.round(player.damage*10)/10; }
        else if(choice.attr==='maxHP'){ 
            let oldMax = player.maxHP;
            player.maxHP += Math.round(val);
            if(player.maxHP<3) player.maxHP=3;
            // 按比例增加当前血量
            player.hp = Math.min(player.maxHP, Math.round(player.hp * (player.maxHP / oldMax)));
            if(player.hp<1) player.hp=1;
        }
        else if(choice.attr==='attackSpeed'){ player.attackCooldown-=val*0.1; if(player.attackCooldown<0.12)player.attackCooldown=0.12; if(player.attackCooldown>5)player.attackCooldown=5; player.attackCooldown=Math.round(player.attackCooldown*100)/100; }
        else if(choice.attr==='moveSpeed'){ player.moveSpeed+=val*15; if(player.moveSpeed<80)player.moveSpeed=80; if(player.moveSpeed>600)player.moveSpeed=600; }
    }
    function triggerUpgrade() { isChoosingUpgrade=true; isPaused=true; upgradeChoices=generateUpgradeChoices(); upgradeTimer=UPGRADE_TIME_LIMIT; elements.upgradeModal.classList.add('active'); renderUpgradeOptions(); elements.timerFill.style.width='100%'; }
    function renderUpgradeOptions() {
        elements.upgradeOptions.innerHTML='';
        upgradeChoices.forEach((c,i)=>{
            const card=document.createElement('div'); card.className='option-card';
            card.innerHTML=`<div class="key-hint">${i+1}</div><div style="font-size:22px;font-weight:900;">${c.expr}</div><div style="margin-top:4px;">${c.attrName}</div>`;
            card.addEventListener('click',()=>selectUpgrade(i));
            elements.upgradeOptions.appendChild(card);
        });
    }
    function selectUpgrade(index) { if(!isChoosingUpgrade||index<0||index>=upgradeChoices.length) return; applyUpgrade(upgradeChoices[index]); finishUpgrade(); }
    function finishUpgrade() {
        isChoosingUpgrade=false; isPaused=false; elements.upgradeModal.classList.remove('active');
        player.level++; player.exp = Math.max(0, player.exp - player.expToNext);
        player.expToNext = getExpToNext(player.level);
        if(player.level % 5 === 0) { pendingBulletSelect=true; triggerBulletSelect(); }
        updateUI();
    }

    function generateShopItems() {
        const all = [
            { type:'killHeal', name:'杀怪回血', desc:'击杀回复3血量', icon:'fa-heart', costType:'exp', cost:28, data:{type:'killHeal',amount:3} },
            { type:'shield', name:'伤害免疫', desc:'4次护盾', icon:'fa-shield-alt', costType:'exp', cost:32, data:{type:'shield',charges:4} },
            { type:'fullScreenAttack', name:'全屏弹幕', desc:'每7秒全屏子弹', icon:'fa-bomb', costType:'exp', cost:40, data:{type:'fullScreenAttack',interval:7,damageRatio:0.5} },
            { type:'bonusExp', name:'额外经验', desc:'击杀+4经验', icon:'fa-star', costType:'exp', cost:22, data:{type:'bonusExp',amount:4} },
            { type:'periodicInvincible', name:'周期无敌', desc:'每14秒2.5秒无敌', icon:'fa-clock', costType:'maxHP', cost:6, data:{type:'periodicInvincible',interval:14,duration:2.5} },

    function canAfford(item) { return item.costType==='exp'?player.exp>=item.cost:(player.maxHP>item.cost+3); }
    function purchaseItem(item) {
        if(!canAfford(item)) return false;
        if(item.costType==='exp') player.exp-=item.cost; else { player.maxHP-=item.cost; player.hp=Math.min(player.hp,player.maxHP); }
        addEffect(item.data); updateUI(); return true;
    }
    function triggerShop() { isShopping=true; isPaused=true; shopChoices=generateShopItems(); shopTimer=SHOP_TIME_LIMIT; elements.shopModal.classList.add('active'); renderShopOptions(); elements.shopTimerFill.style.width='100%'; }
    function renderShopOptions() {
        elements.shopOptions.innerHTML='';
        shopChoices.forEach((item,i)=>{
            const card=document.createElement('div'); card.className='option-card shop-card';
            if(!canAfford(item)) card.classList.add('unaffordable');
            card.innerHTML=`<div class="key-hint">${i+1}</div><div style="font-size:24px;"><i class="fas ${item.icon}"></i></div><div style="font-weight:700;">${item.name}</div><div style="font-size:10px;">${item.desc}</div><div style="margin-top:4px;"><i class="fas ${item.costType==='exp'?'fa-star':'fa-heart'}"></i> ${item.cost} ${item.costType==='exp'?'经验':'最大血量'}</div>`;
            card.addEventListener('click',()=>selectShopItem(i));
            elements.shopOptions.appendChild(card);
        });
    }
    function selectShopItem(index) { if(!isShopping||index<0||index>=shopChoices.length||!canAfford(shopChoices[index])) return; purchaseItem(shopChoices[index]); finishShop(); }
    function finishShop() { isShopping=false; isPaused=false; elements.shopModal.classList.remove('active'); pendingShop=false; bossDefeatedThisWave=false; updateUI(); startWave(waveNumber+1); }

    function endGame() { gameOver=true; isPaused=true; elements.gameoverModal.classList.add('active'); elements.gameoverStats.innerHTML = `波次:${waveNumber} 等级:${player.level} 击杀:${player.kills} 伤害:${player.damage}`; }
    window.restartGame = function() {
        gameOver=false; isPaused=false; isChoosingUpgrade=false; isShopping=false; isChoosingMonsterBuff=false; isChoosingBullet=false;
        pendingShop=false; pendingMonsterBuff=false; pendingBulletSelect=false;
        bullets=[]; enemyBullets=[]; enemies=[]; expOrbs=[]; particles=[]; spawnQueue=[];
        waveNumber=1; enemiesRemainingInWave=0; waveDelayTimer=0; bossDefeatedThisWave=false;
        player.x=GAME_W/2; player.y=GAME_H/2; player.hp=Math.round(10*playerHPMultiplier); player.maxHP=Math.round(10*playerHPMultiplier);
        player.damage=Math.round(2*playerDamageMultiplier); player.attackCooldown=1.5; player.attackTimer=0; player.moveSpeed=220;
        player.level=1; player.exp=0; player.expToNext=getExpToNext(1); player.kills=0; player.effects=[]; player.bulletMode='normal';
        elements.gameoverModal.classList.remove('active'); elements.upgradeModal.classList.remove('active'); elements.shopModal.classList.remove('active'); elements.monsterBuffModal.classList.remove('active'); elements.bulletSelectModal.classList.remove('active');
        elements.difficultyModal.style.display='flex'; updateEffectsUI(); updateUI();
    };

    function updateUI() {
        elements.hpValue.textContent = Math.round(player.hp)+'/'+Math.round(player.maxHP);
        elements.hpBar.style.width = Math.max(0,(player.hp/player.maxHP)*100)+'%';
        elements.waveValue.textContent = waveNumber;
        elements.levelValue.textContent = player.level;
        elements.expBar.style.width = Math.min(100,(player.exp/player.expToNext)*100)+'%';
        elements.expText.textContent = Math.round(player.exp)+'/'+player.expToNext;
        elements.dmgValue.textContent = player.damage;
        elements.atkspdValue.textContent = player.attackCooldown.toFixed(2)+'s';
        elements.killsValue.textContent = player.kills;
        elements.bulletTypeValue.textContent = {normal:'普通',spread:'散射',laser:'激光',machinegun:'机枪'}[player.bulletMode];
    }

    function spawnParticles(x,y,color,count) { for(let i=0;i<count;i++){ let a=Math.random()*Math.PI*2; particles.push({x,y,vx:Math.cos(a)*(60+Math.random()*200),vy:Math.sin(a)*(60+Math.random()*200),life:0.3+Math.random()*0.5,maxLife:0.3+Math.random()*0.5,color,radius:1.5+Math.random()*3}); } }

    window.addEventListener('keydown',e=>{
        keys[e.key.toLowerCase()]=true;
        if(isChoosingUpgrade){ if(e.key==='1')selectUpgrade(0); if(e.key==='2')selectUpgrade(1); if(e.key==='3')selectUpgrade(2); }
        if(isShopping){ if(e.key==='1')selectShopItem(0); if(e.key==='2')selectShopItem(1); if(e.key==='3')selectShopItem(2); }
        if(isChoosingMonsterBuff){ if(e.key==='1')selectMonsterBuff(0); if(e.key==='2')selectMonsterBuff(1); if(e.key==='3')selectMonsterBuff(2); }
        if(isChoosingBullet){ if(e.key==='1')selectBullet(0); if(e.key==='2')selectBullet(1); if(e.key==='3')selectBullet(2); }
    });
    window.addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
    function setupMobileButtons() {
        const map = { 'btn-up':'w', 'btn-down':'s', 'btn-left':'a', 'btn-right':'d' };
        Object.entries(map).forEach(([id,key])=>{
            const btn=document.getElementById(id);
            btn.addEventListener('pointerdown',e=>{ e.preventDefault(); keys[key]=true; });
            btn.addEventListener('pointerup',e=>{ e.preventDefault(); keys[key]=false; });
            btn.addEventListener('pointerleave',()=>{ keys[key]=false; });
            btn.addEventListener('pointercancel',()=>{ keys[key]=false; });
        });
    }
    setupMobileButtons();
    canvas.addEventListener('touchstart',e=>{ e.preventDefault(); if(e.touches.length===1){ touchActive=true; touchStartX=e.touches[0].clientX; touchStartY=e.touches[0].clientY; touchCurrentX=touchStartX; touchCurrentY=touchStartY; } },{passive:false});
    canvas.addEventListener('touchmove',e=>{ e.preventDefault(); if(!touchActive||e.touches.length!==1)return; touchCurrentX=e.touches[0].clientX; touchCurrentY=e.touches[0].clientY; },{passive:false});
    canvas.addEventListener('touchend',()=>{ touchActive=false; keys.w=keys.s=keys.a=keys.d=false; });
    function processTouchMove() {
        if(!touchActive||gameOver||isPaused) return;
        let dx=touchCurrentX-touchStartX, dy=touchCurrentY-touchStartY, dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<touchThreshold){ keys.w=keys.s=keys.a=keys.d=false; return; }
        let nx=dx/dist, ny=dy/dist;
        keys.a=nx<-0.3; keys.d=nx>0.3; keys.w=ny<-0.3; keys.s=ny>0.3;
    }

    let lastTime = performance.now();
    function gameLoop(ts) {
        if(!gameStarted&&!gameOver){ render(ts); requestAnimationFrame(gameLoop); return; }
        let dt = (ts-lastTime)/1000; if(dt<=0)dt=0.016; if(dt>0.2)dt=0.2; lastTime=ts;
        if(!isPaused&&!gameOver){ processTouchMove(); update(dt); }
        if(isChoosingUpgrade){ upgradeTimer-=dt; elements.timerFill.style.width=Math.max(0,(upgradeTimer/UPGRADE_TIME_LIMIT)*100)+'%'; if(upgradeTimer<=0) finishUpgrade(); }
        if(isShopping){ shopTimer-=dt; elements.shopTimerFill.style.width=Math.max(0,(shopTimer/SHOP_TIME_LIMIT)*100)+'%'; if(shopTimer<=0) finishShop(); }
        if(isChoosingMonsterBuff){ monsterBuffTimer-=dt; elements.monsterBuffTimerFill.style.width=Math.max(0,(monsterBuffTimer/MONSTER_BUFF_TIME_LIMIT)*100)+'%'; if(monsterBuffTimer<=0) finishMonsterBuffSelect(); }
        if(isChoosingBullet){ bulletTimer-=dt; elements.bulletTimerFill.style.width=Math.max(0,(bulletTimer/BULLET_TIME_LIMIT)*100)+'%'; if(bulletTimer<=0) finishBulletSelect(); }
        render(ts); updateUI();
        requestAnimationFrame(gameLoop);
    }

    function update(dt) {
        // 移动
        let dx=0,dy=0;
        if(keys.w||keys.arrowup)dy-=1; if(keys.s||keys.arrowdown)dy+=1;
        if(keys.a||keys.arrowleft)dx-=1; if(keys.d||keys.arrowright)dx+=1;
        if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}
        player.x+=dx*player.moveSpeed*dt; player.y+=dy*player.moveSpeed*dt;
        player.x=Math.max(player.radius,Math.min(GAME_W-player.radius,player.x));
        player.y=Math.max(player.radius,Math.min(GAME_H-player.radius,player.y));
        if(player.invincibleTimer>0) player.invincibleTimer-=dt;

        // 效果计时
        player.effects.forEach(e=>{
            if(e.type==='fullScreenAttack'){ e.timer-=dt; if(e.timer<=0){ e.timer=e.interval; for(let i=0;i<16;i++){ let a=(Math.PI*2/16)*i; bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*400,vy:Math.sin(a)*400,damage:player.damage*(e.damageRatio||0.5),radius:5,life:1.8,isFullScreen:true}); } } }
            if(e.type==='periodicInvincible'){ e.timer-=dt; if(e.timer<=0&&!e.active){ e.active=true; e.activeTimer=e.duration; e.timer=e.interval; } if(e.active){ e.activeTimer-=dt; player.invincibleTimer=Math.max(player.invincibleTimer,e.activeTimer); if(e.activeTimer<=0)e.active=false; } }
            if(e.type==='knockback'){ e.timer-=dt; if(e.timer<=0){ e.timer=e.interval; enemies.forEach(en=>{ let d=Math.hypot(en.x-player.x,en.y-player.y); if(d<(e.radius||200)&&d>1){ let a=Math.atan2(en.y-player.y,en.x-player.x); en.x+=Math.cos(a)*(e.force||150)*0.06; en.y+=Math.sin(a)*(e.force||150)*0.06; } }); } }
        });

        // 攻击
        player.attackTimer-=dt;
        if(player.attackTimer<=0 && enemies.length>0){
            let nearest=null, nearestDist=Infinity;
            enemies.forEach(e=>{ let d=Math.hypot(e.x-player.x,e.y-player.y); if(d<nearestDist){ nearestDist=d; nearest=e; } });
            if(nearest && nearestDist<800){
                let angle = Math.atan2(nearest.y-player.y, nearest.x-player.x);
                if(player.bulletMode==='spread'){
                    for(let i=-1;i<=1;i++){ let a=angle+i*0.2; bullets.push({x:player.x,y:player.y,vx:Math.cos(a)*500,vy:Math.sin(a)*500,damage:player.damage,radius:4,life:2.5}); }
                    player.attackTimer=player.attackCooldown;
                }else if(player.bulletMode==='laser'){
                    bullets.push({x:player.x,y:player.y,vx:Math.cos(angle)*800,vy:Math.sin(angle)*800,damage:player.damage,radius:3,life:0.6,penetrate:true});
                    player.attackTimer=player.attackCooldown*0.6;
                }else if(player.bulletMode==='machinegun'){
                    bullets.push({x:player.x,y:player.y,vx:Math.cos(angle)*600,vy:Math.sin(angle)*600,damage:player.damage,radius:3,life:1.5});
                    player.attackTimer=0.25;
                }else{
                    bullets.push({x:player.x,y:player.y,vx:Math.cos(angle)*500,vy:Math.sin(angle)*500,damage:player.damage,radius:4,life:2.5});
                    player.attackTimer=player.attackCooldown;
                }
            }
        }

        // 子弹更新
        for(let i=bullets.length-1;i>=0;i--){ let b=bullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; if(b.life<=0||b.x<-50||b.x>GAME_W+50||b.y<-50||b.y>GAME_H+50) bullets.splice(i,1); }
        for(let i=enemyBullets.length-1;i>=0;i--){ let b=enemyBullets[i]; b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt; if(b.life<=0||b.x<-50||b.x>GAME_W+50||b.y<-50||b.y>GAME_H+50) enemyBullets.splice(i,1); }

        // 敌人AI
        enemies.forEach(en=>{
            let angle = Math.atan2(player.y-en.y, player.x-en.x);
            en.x += Math.cos(angle)*en.speed*dt;
            en.y += Math.sin(angle)*en.speed*dt;
            en.pulsePhase += dt*4;
            if(en.hitFlash>0) en.hitFlash-=dt;
            if(en.type==='ranged'){
                en.specialTimer -= dt;
                if(en.specialTimer<=0){ en.specialTimer=2.0+Math.random(); let a=Math.atan2(player.y-en.y,player.x-en.x); enemyBullets.push({x:en.x,y:en.y,vx:Math.cos(a)*250,vy:Math.sin(a)*250,damage:en.damage,radius:3,life:3}); }
            }
            if(en.type==='exploder'){
                let d=Math.hypot(en.x-player.x,en.y-player.y);
                if(d < en.radius+player.radius+40){ en.hp=0; }
            }
        });

        // 敌人子弹 vs 玩家
        for(let i=enemyBullets.length-1;i>=0;i--){
            let b=enemyBullets[i];
            if(Math.hypot(b.x-player.x,b.y-player.y) < player.radius+b.radius && player.invincibleTimer<=0){
                if(hasEffect('shield')){ let sh=getEffect('shield'); if(sh.charges>0){ sh.charges--; spawnParticles(player.x,player.y,'#80c0ff',10); if(sh.charges<=0) removeEffect('shield'); } }
                else { player.hp-=b.damage; player.invincibleTimer=0.5; spawnParticles(player.x,player.y,'#ff4444',8); }
                enemyBullets.splice(i,1);
                if(player.hp<=0){ player.hp=0; endGame(); return; }
            }
        }

        // 玩家子弹 vs 敌人
        for(let i=bullets.length-1;i>=0;i--){
            let b=bullets[i]; let hit=false;
            for(let j=enemies.length-1;j>=0;j--){
                let en=enemies[j];
                if(Math.hypot(b.x-en.x,b.y-en.y) < en.radius+b.radius){
                    let totalDmg=b.damage;
                    if(hasEffect('percentDamage')) totalDmg += en.hp*(getEffect('percentDamage').ratio||0.04);
                    en.hp-=totalDmg; en.hitFlash=0.08; spawnParticles(b.x,b.y,'#ffff80',3);
                    if(!b.penetrate) hit=true;
                    if(en.hp<=0){
                        spawnParticles(en.x,en.y,en.glowColor,15);
                        expOrbs.push({x:en.x,y:en.y,value:en.expValue,radius:6,life:20});
                        player.kills++; enemiesRemainingInWave--;
                        if(en.type==='boss') bossDefeatedThisWave=true;
                        if(hasEffect('killHeal')) player.hp=Math.min(player.maxHP,player.hp+(getEffect('killHeal').amount||2));
                        if(hasEffect('bonusExp')) player.exp+=(getEffect('bonusExp').amount||3);
                        if(en.type==='exploder'){
                            for(let k=0;k<8;k++){ let a=Math.random()*Math.PI*2; enemyBullets.push({x:en.x,y:en.y,vx:Math.cos(a)*180,vy:Math.sin(a)*180,damage:2,radius:3,life:1.5}); }
                        }
                        // 荆棘反弹
                        let thornBuff = monsterBuffs.find(b=>b.name==='荆棘');
                        if(thornBuff && Math.hypot(en.x-player.x,en.y-player.y)<player.radius+en.radius){
                            if(hasEffect('shield')){ let sh=getEffect('shield'); if(sh.charges>0){ sh.charges--; spawnParticles(player.x,player.y,'#80c0ff',10); } else { player.hp-=en.damage; player.invincibleTimer=0.5; } } else { player.hp-=en.damage; player.invincibleTimer=0.5; }
                            if(player.hp<=0){ player.hp=0; endGame(); return; }
                        }
                        // 恢复增益
                        let healBuff = monsterBuffs.find(b=>b.name==='恢复');
                        if(healBuff){ enemies.forEach(other=>{ if(other!==en && Math.hypot(other.x-en.x,other.y-en.y)<80){ other.hp=Math.min(other.maxHP,other.hp+10); } }); }
                        enemies.splice(j,1);
                    }
                    if(hit && !b.penetrate) break;
                }
            }
            if(hit && !b.penetrate) bullets.splice(i,1);
        }

        // 敌人接触玩家
        enemies.forEach(en=>{
            if(Math.hypot(en.x-player.x,en.y-player.y) < player.radius+en.radius && player.invincibleTimer<=0){
                if(hasEffect('shield')){ let sh=getEffect('shield'); if(sh.charges>0){ sh.charges--; spawnParticles(player.x,player.y,'#80c0ff',10); if(sh.charges<=0)removeEffect('shield'); } }
                else { player.hp-=en.damage; player.invincibleTimer=0.5; spawnParticles(player.x,player.y,'#ff4444',8); }
                if(player.hp<=0){ player.hp=0; endGame(); return; }
            }
        });

        // 经验球
        for(let i=expOrbs.length-1;i>=0;i--){
            let orb=expOrbs[i]; let d=Math.hypot(orb.x-player.x,orb.y-player.y);
            if(d<120){ let a=Math.atan2(player.y-orb.y,player.x-orb.x); orb.x+=Math.cos(a)*350*dt; orb.y+=Math.sin(a)*350*dt; }
            if(d<player.radius+orb.radius+8){ player.exp+=orb.value; spawnParticles(orb.x,orb.y,'#80ff80',5); expOrbs.splice(i,1); if(player.exp>=player.expToNext&&!isChoosingUpgrade&&!isShopping&&!isChoosingMonsterBuff&&!isChoosingBullet&&!gameOver) triggerUpgrade(); }
            orb.life-=dt; if(orb.life<=0) expOrbs.splice(i,1);
        }
        // 粒子
        for(let i=particles.length-1;i>=0;i--){ let p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; if(p.life<=0) particles.splice(i,1); }
        // 生成
        if(spawnQueue.length>0){ spawnTimer+=dt; while(spawnQueue.length>0&&spawnTimer>=spawnQueue[0].delay) spawnEnemy(spawnQueue.shift().type); }
        // 波次完成
        if(enemiesRemainingInWave<=0&&spawnQueue.length===0&&enemies.length===0&&!isChoosingUpgrade&&!isShopping&&!gameOver&&!pendingShop&&!isChoosingMonsterBuff&&!isChoosingBullet){
            if(waveNumber%10===0&&bossDefeatedThisWave){ pendingShop=true; triggerShop(); }
            else{ waveDelayTimer+=dt; if(waveDelayTimer>=1.8) startWave(waveNumber+1); }
        }
    }

    function render(ts) {
        ctx.clearRect(0,0,GAME_W,GAME_H);
        ctx.fillStyle='#0a0a1e'; ctx.fillRect(0,0,GAME_W,GAME_H);
        ctx.strokeStyle='rgba(255,255,255,0.02)'; ctx.lineWidth=1; let gs=40;
        for(let x=gs;x<GAME_W;x+=gs){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,GAME_H); ctx.stroke(); }
        for(let y=gs;y<GAME_H;y+=gs){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(GAME_W,y); ctx.stroke(); }
        expOrbs.forEach(o=>{ ctx.fillStyle=`rgba(80,255,120,${Math.min(1,o.life/5)})`; ctx.beginPath(); ctx.arc(o.x,o.y,o.radius,0,Math.PI*2); ctx.fill(); });
        particles.forEach(p=>{ ctx.globalAlpha=p.life/p.maxLife; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.radius*ctx.globalAlpha,0,Math.PI*2); ctx.fill(); }); ctx.globalAlpha=1;
        bullets.forEach(b=>{ ctx.fillStyle=b.isFullScreen?'#ff9040':'#ffe860'; ctx.beginPath(); ctx.arc(b.x,b.y,b.radius,0,Math.PI*2); ctx.fill(); });
        enemyBullets.forEach(b=>{ ctx.fillStyle='#ff6060'; ctx.beginPath(); ctx.arc(b.x,b.y,b.radius,0,Math.PI*2); ctx.fill(); });
        enemies.forEach(en=>{
            ctx.save(); let flash=en.hitFlash>0&&Math.floor(en.hitFlash*30)%2===0;
            if(en.type==='boss'){ ctx.fillStyle='rgba(255,180,40,0.3)'; ctx.beginPath(); ctx.arc(en.x,en.y,en.radius+12,0,Math.PI*2); ctx.fill(); }
            ctx.fillStyle=flash?'#fff':en.color; ctx.beginPath(); ctx.arc(en.x,en.y,en.radius,0,Math.PI*2); ctx.fill();
            ctx.restore();
        });
        ctx.save(); if(player.invincibleTimer>0&&Math.floor(player.invincibleTimer*20)%2===0) ctx.globalAlpha=0.4;
        ctx.fillStyle='#5088f0'; ctx.beginPath(); ctx.arc(player.x,player.y,player.radius,0,Math.PI*2); ctx.fill();
        ctx.fillStyle='#a0c8ff'; ctx.beginPath(); ctx.arc(player.x,player.y,player.radius*0.55,0,Math.PI*2); ctx.fill();
        ctx.restore();
    }

    function init() { resizeCanvas(); player.x=GAME_W/2; player.y=GAME_H/2; player.expToNext=getExpToNext(1); updateUI(); elements.difficultyModal.style.display='flex'; requestAnimationFrame(gameLoop); }
    init();
})();
</script>
